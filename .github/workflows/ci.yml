name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: .python-version

      - name: Instalar uv
        run: python -m pip install uv==0.12.5

      - name: Dependencias
        run: uv sync --locked

      - name: make check
        run: make check

  secretos:
    name: secretos (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      # ADR-0001: el repo es público; ningún secreto en toda la historia.
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 git /repo --redact -v

  schemathesis:
    name: schemathesis (OpenAPI publicado)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: .python-version

      - name: Instalar uv
        run: python -m pip install uv==0.12.5

      - name: Dependencias
        run: uv sync --locked

      # F3.5: sin 5xx ni respuestas fuera de esquema, con entradas generadas (sin red)
      - name: Schemathesis
        run: uv run pytest tests_lentos -q -p schemathesis

  postgres:
    name: postgres (llaves y uso con varias réplicas)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgis/postgis:17-3.5-alpine
        env:
          POSTGRES_PASSWORD: pruebas
          POSTGRES_DB: terranova
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: .python-version

      - name: Instalar uv
        run: python -m pip install uv==0.12.5

      - name: Dependencias
        run: uv sync --locked --extra postgres --extra datasets

      - name: Pruebas contra Postgres
        env:
          TERRANOVA_PG_PRUEBAS: postgresql://postgres:pruebas@localhost:5432/terranova
        run: uv run --extra postgres --extra datasets pytest tests/test_postgres.py tests/test_copias.py -q -rs

  descubrimiento:
    name: descubrimiento (catálogo con pgvector)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:pg17  # Postgres con la extensión pgvector (ADR-0028)
        env:
          POSTGRES_PASSWORD: pruebas
          POSTGRES_DB: terranova
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: .python-version

      - name: Instalar uv
        run: python -m pip install uv==0.12.5

      - name: Dependencias
        run: uv sync --locked --extra postgres

      - name: Pruebas del almacén (pgvector)
        env:
          TERRANOVA_PG_PRUEBAS: postgresql://postgres:pruebas@localhost:5432/terranova
        run: uv run --extra postgres pytest tests/test_almacen_descubrimiento.py -q -rs

  imagen:
    name: imagen de la puerta
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: docker build
        run: docker build -t terranova/puerta:ci .

      - name: sin pimienta no arranca (falla cerrado)
        run: |
          set +e
          docker run --rm terranova/puerta:ci timeout 20 terranova
          rc=$?
          # 124 = timeout la mató porque siguió corriendo: arrancó sin TERRANOVA_PIMIENTA
          if [ "$rc" -eq 124 ] || [ "$rc" -eq 0 ]; then echo "arrancó sin pimienta (rc=$rc)"; exit 1; fi
          echo "no arranca sin pimienta (rc=$rc): bien"

      # Trivy escanea la imagen construida en busca de HIGH/CRITICAL con arreglo (--ignore-unfixed
      # evita ruido por las que nadie puede corregir todavía). Informativo por ahora (no bloquea):
      # se vuelve bloqueante cuando se confirme que la línea base queda limpia. Dependabot (docker)
      # mantiene al día la imagen base.
      - name: trivy (vulnerabilidades de la imagen, informativo)
        continue-on-error: true
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.67.0 image             --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --no-progress terranova/puerta:ci

  seguridad:
    name: seguridad (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: .python-version

      - name: Instalar uv
        run: python -m pip install uv==0.12.5

      # Bloquea el merge: audita el cierre de dependencias que de verdad SE DESPLIEGA en la puerta
      # (núcleo + postgres + redis, sin dev), que es su superficie de ataque (Dockerfile).
      - name: pip-audit (puerta)
        run: |
          uv export --no-dev --no-emit-project --extra postgres --extra redis             --format requirements-txt > req-puerta.txt
          uv run --with pip-audit pip-audit -r req-puerta.txt

      # Informativo (no bloquea): el microservicio de embeddings es una imagen aparte, en la red
      # interna, sin exposición, con modelos solo de texto. fastembed arrastra pillow y fija
      # pillow<12, así que sus CVE no se pueden corregir sin subir fastembed: se vigilan aquí y con
      # Dependabot, sin frenar cada PR por una dependencia que no está en la ruta del dato.
      - name: pip-audit (embeddings, informativo)
        continue-on-error: true
        run: |
          uv export --no-dev --no-emit-project --extra descubrimiento             --format requirements-txt > req-embeddings.txt
          uv run --with pip-audit pip-audit -r req-embeddings.txt

  observabilidad:
    name: observabilidad (reglas de Prometheus)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: promtool check config y test rules
        run: |
          docker run --rm --entrypoint promtool -w /o -v "$PWD/docker/observabilidad:/o:ro"             -v "$PWD/docker/observabilidad/reglas.yml:/etc/prometheus/reglas.yml:ro"             prom/prometheus:v3.5.0 check config prometheus.yml
          docker run --rm --entrypoint promtool -w /o -v "$PWD/docker/observabilidad:/o:ro"             prom/prometheus:v3.5.0 test rules reglas_test.yml
          python3 -c "import json; json.load(open('docker/observabilidad/grafana/tableros/terranova.json'))"

  datasets:
    name: datasets (restricciones, sin red)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: .python-version

      - name: Instalar uv
        run: python -m pip install uv==0.12.5

      - name: Dependencias
        run: uv sync --locked --extra datasets

      - name: Pruebas del dataset
        run: uv run pytest tests/test_restricciones.py -q -rs
