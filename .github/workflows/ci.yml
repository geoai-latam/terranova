name: CI

# El repo es privado (enmienda de la ADR-0001): GitHub Actions da 2.000 min/mes. Cada PR corre solo
# los trabajos que cubren lo que tocó (trabajo `cambios`); al fusionar no se repite todo, y una
# pasada completa diaria sobre main (y la manual) atrapa los choques entre PR.
on:
  pull_request:
  schedule:
    - cron: "0 6 * * *"  # 01:00 en Colombia
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cambios:
    name: qué cambió
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      codigo: ${{ steps.f.outputs.codigo }}
      api: ${{ steps.f.outputs.api }}
      postgres: ${{ steps.f.outputs.postgres }}
      descubrimiento: ${{ steps.f.outputs.descubrimiento }}
      imagen: ${{ steps.f.outputs.imagen }}
      deps: ${{ steps.f.outputs.deps }}
      observabilidad: ${{ steps.f.outputs.observabilidad }}
      datasets: ${{ steps.f.outputs.datasets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      # Fuera de un PR (pasada diaria o manual) corre todo. En un PR, cada trabajo corre si se tocó
      # algo que cubre; tocar el CI o las dependencias lo corre todo.
      - id: f
        env:
          BASE: ${{ github.base_ref }}
        run: |
          trabajos="codigo api postgres descubrimiento imagen deps observabilidad datasets"
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            for t in $trabajos; do echo "$t=true" >> "$GITHUB_OUTPUT"; done; exit 0
          fi
          git diff --name-only "origin/$BASE" HEAD > cambios.txt
          cat cambios.txt
          todo='^\.github/|^(pyproject\.toml|uv\.lock|\.python-version)$'
          hay() { if grep -qE "$todo|$2" cambios.txt; then echo "$1=true"; else echo "$1=false"; fi >> "$GITHUB_OUTPUT"; }
          hay codigo '^(src|catalogo|tests|scripts|esquemas)/|^Makefile$|^docs/HERRAMIENTAS\.md$'
          hay api '^(src|catalogo|tests_lentos)/'
          hay postgres '^src/|^catalogo/|^tests/(test_postgres|test_copias|conftest)\.py$'
          hay descubrimiento '^src/terranova/(almacen_descubrimiento|descubrimiento|embeddings[a-z_]*|bd)\.py$|^tests/test_almacen_descubrimiento\.py$'
          hay imagen '^(src|catalogo)/|^Dockerfile$|^\.dockerignore$'
          hay deps '^$'
          hay observabilidad '^docker/observabilidad/'
          hay datasets '^src/terranova/restricciones[a-z_]*\.py$|^scripts/dataset_|^tests/test_restricciones\.py$'

  check:
    name: check (ruff, mypy, pytest)
    needs: cambios
    if: needs.cambios.outputs.codigo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20  # la suite ya tarda ~9,5 min en CI; con 10 el job moría con todo en verde
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version-file: .python-version

      - name: Instalar uv
        run: python -m pip install uv==0.12.5

      - name: Dependencias
        run: uv sync --locked

      - name: make check
        run: make check

  secretos:
    name: secretos (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      # Ningún secreto en toda la historia, aunque el repo sea privado (enmienda de la ADR-0001).
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 git /repo --redact -v

  schemathesis:
    name: schemathesis (OpenAPI publicado)
    needs: cambios
    if: needs.cambios.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version-file: .python-version

      - name: Instalar uv
        run: python -m pip install uv==0.12.5

      - name: Dependencias
        run: uv sync --locked

      # F3.5: sin 5xx ni respuestas fuera de esquema, con entradas generadas (sin red)
      - name: Schemathesis
        run: uv run pytest tests_lentos -q -p schemathesis

  postgres:
    name: postgres (llaves y uso con varias réplicas)
    needs: cambios
    if: needs.cambios.outputs.postgres == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgis/postgis:17-3.5-alpine
        env:
          POSTGRES_PASSWORD: pruebas
          POSTGRES_DB: terranova
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version-file: .python-version

      - name: Instalar uv
        run: python -m pip install uv==0.12.5

      - name: Dependencias
        run: uv sync --locked --extra postgres --extra datasets

      - name: Pruebas contra Postgres
        env:
          TERRANOVA_PG_PRUEBAS: postgresql://postgres:pruebas@localhost:5432/terranova
        run: uv run --extra postgres --extra datasets pytest tests/test_postgres.py tests/test_copias.py -q -rs

  descubrimiento:
    name: descubrimiento (catálogo con pgvector)
    needs: cambios
    if: needs.cambios.outputs.descubrimiento == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:pg17  # Postgres con la extensión pgvector (ADR-0028)
        env:
          POSTGRES_PASSWORD: pruebas
          POSTGRES_DB: terranova
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version-file: .python-version

      - name: Instalar uv
        run: python -m pip install uv==0.12.5

      - name: Dependencias
        run: uv sync --locked --extra postgres

      - name: Pruebas del almacén (pgvector)
        env:
          TERRANOVA_PG_PRUEBAS: postgresql://postgres:pruebas@localhost:5432/terranova
        run: uv run --extra postgres pytest tests/test_almacen_descubrimiento.py -q -rs

  imagen:
    name: imagen de la puerta
    needs: cambios
    if: needs.cambios.outputs.imagen == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: docker build
        run: docker build -t terranova/puerta:ci .

      - name: sin pimienta no arranca (falla cerrado)
        run: |
          set +e
          docker run --rm terranova/puerta:ci timeout 20 terranova
          rc=$?
          # 124 = timeout la mató porque siguió corriendo: arrancó sin TERRANOVA_PIMIENTA
          if [ "$rc" -eq 124 ] || [ "$rc" -eq 0 ]; then echo "arrancó sin pimienta (rc=$rc)"; exit 1; fi
          echo "no arranca sin pimienta (rc=$rc): bien"

      # Trivy escanea la imagen construida en busca de HIGH/CRITICAL con arreglo (--ignore-unfixed
      # evita ruido por las que nadie puede corregir todavía). Informativo por ahora (no bloquea):
      # se vuelve bloqueante cuando se confirme que la línea base queda limpia. Dependabot (docker)
      # mantiene al día la imagen base.
      - name: trivy (vulnerabilidades de la imagen, informativo)
        continue-on-error: true
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.67.0 image             --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --no-progress terranova/puerta:ci

  seguridad:
    name: seguridad (pip-audit)
    needs: cambios
    if: needs.cambios.outputs.deps == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version-file: .python-version

      - name: Instalar uv
        run: python -m pip install uv==0.12.5

      # Bloquea el merge: audita el cierre de dependencias que de verdad SE DESPLIEGA en la puerta
      # (núcleo + postgres + redis, sin dev), que es su superficie de ataque (Dockerfile).
      - name: pip-audit (puerta)
        run: |
          uv export --no-dev --no-emit-project --extra postgres --extra redis             --format requirements-txt > req-puerta.txt
          uv run --with pip-audit pip-audit -r req-puerta.txt

      # Informativo (no bloquea): el microservicio de embeddings es una imagen aparte, en la red
      # interna, sin exposición, con modelos solo de texto. fastembed arrastra pillow y fija
      # pillow<12, así que sus CVE no se pueden corregir sin subir fastembed: se vigilan aquí y con
      # Dependabot, sin frenar cada PR por una dependencia que no está en la ruta del dato.
      - name: pip-audit (embeddings, informativo)
        continue-on-error: true
        run: |
          uv export --no-dev --no-emit-project --extra descubrimiento             --format requirements-txt > req-embeddings.txt
          uv run --with pip-audit pip-audit -r req-embeddings.txt

  observabilidad:
    name: observabilidad (reglas de Prometheus)
    needs: cambios
    if: needs.cambios.outputs.observabilidad == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: promtool check config y test rules
        run: |
          docker run --rm --entrypoint promtool -w /o -v "$PWD/docker/observabilidad:/o:ro"             -v "$PWD/docker/observabilidad/reglas.yml:/etc/prometheus/reglas.yml:ro"             prom/prometheus:v3.5.0 check config prometheus.yml
          docker run --rm --entrypoint promtool -w /o -v "$PWD/docker/observabilidad:/o:ro"             prom/prometheus:v3.5.0 test rules reglas_test.yml
          python3 -c "import json; json.load(open('docker/observabilidad/grafana/tableros/terranova.json'))"

      - name: amtool check-config (sin destino y con Telegram)
        run: |
          a="$PWD/docker/observabilidad/alertmanager/arrancar.sh:/a.sh:ro"
          docker run --rm --entrypoint /bin/sh -v "$a" prom/alertmanager:v0.28.1 /a.sh revisar
          docker run --rm -e ALERTAS_TELEGRAM_TOKEN=123:abc -e ALERTAS_TELEGRAM_CHAT=-100123             --entrypoint /bin/sh -v "$a" prom/alertmanager:v0.28.1 /a.sh revisar

  datasets:
    name: datasets (restricciones, sin red)
    needs: cambios
    if: needs.cambios.outputs.datasets == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version-file: .python-version

      - name: Instalar uv
        run: python -m pip install uv==0.12.5

      - name: Dependencias
        run: uv sync --locked --extra datasets

      - name: Pruebas del dataset
        run: uv run pytest tests/test_restricciones.py -q -rs
