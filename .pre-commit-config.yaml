# Instalar una vez: `uv run pre-commit install`. Las mismas comprobaciones corren en CI.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Misma versión que pyproject.toml. Subir las dos a la vez.
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]  # compose usa la etiqueta !reset
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key
