id: anh.produccion_crudo
titulo: "Producción fiscalizada de crudo por campo y municipio (ANH, mensual desde 2014)"
entidad: Agencia Nacional de Hidrocarburos (ANH)
competencia: fiscaliza la producción de hidrocarburos y liquida las regalías (Decreto-Ley 4137 de 2011; Ley 2056 de 2020)
acto: null
licencia:
  spdx: CC-BY-SA-4.0
  url: https://creativecommons.org/licenses/by-sa/4.0/
  verificada: 2026-10-28
  evidencia: https://www.datos.gov.co/api/views/fdvb-hsrf.json
  cita: "Creative Commons Attribution | Share Alike 4.0 International"
uso_comercial: si
clase_acceso: api
atribucion: "Fuente: Agencia Nacional de Hidrocarburos (ANH), producción fiscalizada de crudo. Fuente: Portal de Datos Abiertos www.datos.gov.co"
protocolo: socrata
conector: datos-abiertos-mcp
# La columna CodDaneMunicipio de este conjunto repite el código del departamento (Puerto Gaitán = 50):
# no sirve para filtrar. El municipio se pide por nombre, con su departamento, y se compara sin
# tildes, mayúsculas ni espacios. La producción viene como texto con separador de miles
# («9,663.00»): se suma en la fuente con replace(…)::number.
url: https://www.datos.gov.co/resource/fdvb-hsrf.json
modo: en_vivo
frescura: {ttl_cache_s: 604800, sla_actualizacion: P3M}
cobertura: {pais: CO, columna_tiempo: vigencia}
datos_personales: ninguno
estado: publicada
campos:
  vigencia: {nombre: anio, tipo: int, desc: "año de la producción"}
  mes: {nombre: mes, tipo: int, desc: "mes de la producción (1 a 12)"}
  departamento: {nombre: departamento, tipo: str, desc: "departamento, en mayúsculas y sin tildes como lo escribe la ANH (GUAJIRA, NARIÑO)"}
  municipio: {nombre: municipio, tipo: str, desc: "municipio como lo escribe la ANH (PUERTO GAITAN, CUCUTA); «MUNICIPIO NN» y «PENDIENTE CERTIFICADO IGAC» son producción sin municipio asignado"}
  operadora: {nombre: operadora, tipo: str, desc: "empresa operadora que reporta la producción"}
  contrato: {nombre: contrato, tipo: str, desc: "contrato de exploración y producción o de asociación"}
  campo: {nombre: campo, tipo: str, desc: "campo de hidrocarburos"}
  produccion_bls: {nombre: produccion_bls_texto, tipo: str, desc: "producción del mes en barriles, como texto con separador de miles («9,663.00»)"}
comportamiento: {max_por_pagina: 50000}
dcat: {publisher: Agencia Nacional de Hidrocarburos, theme: minas y energía, accrualPeriodicity: quarterly}
# Spec 07: medido en la fuente, no en Terrnova.
perfil:
  medido: 2026-10-28
  fila: "la producción de un campo (con su contrato y operadora) en un municipio y un mes, en barriles; 53 237 filas de enero de 2014 a marzo de 2026"
  clave: {columna: vigencia + mes + municipio + contrato + campo, unica: false}  # dos filas si cambió la operadora en el mes
  operaciones: {filtrar: 0.5, agrupar: 0.5}  # en la fuente; con el nombre normalizado, hasta 7 s en frío
  hallazgos:
  - "CodDaneMunicipio repite el código del departamento en todas las filas (Puerto Gaitán = 50): no se puede filtrar por DIVIPOLA"
  - "la producción es texto con separador de miles («70,734.00»): ::number falla; replace(…, ',', '')::number funciona"
  - "noviembre de 2025 está incompleto: 106 filas y 5,5 millones de barriles frente a ~330 filas y ~23 millones en los demás meses (Puerto Gaitán: 447 138 barriles frente a ~6,4 millones)"
  - "los nombres van sin tildes salvo unos pocos (SAN MARTÍN, PURIFICACIÓN) y con variantes (VILLA NUEVA en Casanare, RIO NEGRO en Antioquia, CUCUTA): se comparan sin tildes ni espacios"
  - "hay municipios homónimos (San Martín en Cesar y en Meta): por eso se pide también el departamento"
  - "sin filas repetidas; las cifras cuadran con la producción nacional (diciembre de 2025: 23,0 millones de barriles, ~743 000 barriles diarios)"
  decision: "en vivo por municipio (nombre y departamento) o por campo y año, sumando por mes en la fuente"
