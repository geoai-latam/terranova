id: ani.peajes
titulo: Peajes de las concesiones de la ANI
entidad: Agencia Nacional de Infraestructura (ANI)
competencia: estructura, contrata y supervisa las concesiones de infraestructura de transporte (Decreto 4165 de 2011)
acto: null
# La ANI declara CC BY-SA 4.0 en su página de datos abiertos para «Concesiones ANI» y «Tarifas de
# Peajes ANI», que son los mismos datos de estas capas.
licencia:
  spdx: CC-BY-SA-4.0
  url: https://creativecommons.org/licenses/by-sa/4.0/
  verificada: 2026-10-28
  evidencia: https://www.ani.gov.co/datos-abiertos/
  cita: "Concesiones ANI … Licencia: Atribución/Reconocimiento-Compartir Igual 4.0 Internacional"
uso_comercial: si
clase_acceso: api
atribucion: "Fuente: Agencia Nacional de Infraestructura (ANI)"
protocolo: arcgis_rest
conector: arcgis-mcp
# Servicio `Hosted/ModosANI` del ArcGIS Server de la ANI, capa 5 Peajes. Las columnas de auditoría
# (created_user, last_edited_user) no entran a la lista blanca.
url: https://aniscopiosig-server.ani.gov.co/arcgisserver/rest/services/Hosted/ModosANI/FeatureServer
modo: en_vivo
frescura: {ttl_cache_s: 86400, sla_actualizacion: P6M}
cobertura:
  pais: CO
  excluye: []
datos_personales: ninguno
estado: publicada
campos:
  nombre: {nombre: peaje, tipo: str, desc: "nombre del peaje"}
  estado: {nombre: estado_peaje, tipo: str, desc: "estado del peaje (en funcionamiento…)"}
  proyecto: {nombre: proyecto_peaje, tipo: str, desc: "proyecto de concesión al que pertenece el peaje"}
  codvia: {nombre: codigo_via, tipo: str, desc: "código de la vía"}
  municipio: {nombre: municipio, tipo: str, desc: "municipio del peaje"}
  departamento: {nombre: departamento, tipo: str, desc: "departamento del peaje"}
comportamiento: {max_por_pagina: 2000, orden_coordenadas: lon_lat}
capas_servicio: [5]
dcat: {publisher: ANI, theme: transporte}
# Spec 07: medido en la fuente, no en Terrnova.
perfil:
  medido: 2026-10-28
  fila: "un peaje de una concesión de la ANI; 150 en el país, 5 al norte de Bogotá"
  clave: {columna: objectid, unica: true}
  operaciones: {filtrar: 0.4, contar: 0.3}
  hallazgos:
  - "solo peajes de concesiones de la ANI: los del INVÍAS van en otra fuente"
  decision: "en vivo por zona (bbox)"
