  - "el último mes publicado es mayo de 2026 (128 peajes); hay peajes que dejaron de reportar en 2015"
  - "los nombres coinciden con los de la capa de peajes de la ANI (FUSCA, ANDES, LA CABAÑA, SOPÓ); los peajes del INVÍAS no están"
  decision: "en vivo por nombre del peaje y año, agregado por mes"
