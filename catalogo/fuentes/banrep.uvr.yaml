id: banrep.uvr
titulo: "Unidad de valor real (UVR) (Banco de la República, SDMX)"
entidad: Banco de la República
competencia: autoridad monetaria (Constitución, art. 371; Ley 31 de 1992)
acto: null
# Aviso legal del BanRep (última modificación: 3 de junio de 2026), §2: la información estadística,
# incluida la expuesta por SDMX, se puede reproducir libremente sin alterarla, indicando la fuente y la
# fecha de consulta (la procedencia lleva `consultado_en`). No cubre datos de terceros (Bloomberg,
# Refinitiv): estas series son del Banco. Confirmado por el dueño en el navegador el 2026-10-22.
licencia:
  spdx: LicenseRef-banrep-aviso-legal
  url: https://www.banrep.gov.co/es/aviso-legal
  verificada: 2026-10-22
  evidencia: https://www.banrep.gov.co/es/aviso-legal
  cita: "puede ser reproducida o divulgada libremente por cualquier persona, siempre que no se altere o modifique su contenido, se indique su fuente y se mencione la fecha en que se consultó el portal"
uso_comercial: si
clase_acceso: api
atribucion: "Fuente: Banco de la República, Unidad de valor real (UVR)"
protocolo: api_propia
conector: web-mcp
# SDMX-ML 2.1 del servicio oficial del BanRep. Las fechas vienen como AAAAMMDD y el servicio no filtra
# por rango: se piden las últimas N observaciones.
url: https://totoro.banrep.gov.co/nsi-jax-ws/rest/data/ESTAT,DF_UVR_DAILY_HIST,1.0/all
modo: en_vivo
frescura: {ttl_cache_s: 3600, sla_actualizacion: P1D}
cobertura: {pais: CO}
datos_personales: ninguno
estado: publicada
campos:
  TIME_PERIOD: {nombre: fecha, tipo: str, desc: "fecha de la observación, AAAAMMDD"}
  OBS_VALUE: {nombre: valor, tipo: float, desc: "valor (dos series: el valor y su variación (SUBJECT y UNIT_MEASURE lo dicen))"}
  SUBJECT: {nombre: serie, tipo: str, desc: "código de la serie en el BanRep"}
  UNIT_MEASURE: {nombre: unidad, tipo: str, desc: "unidad (COP pesos, PA porcentaje anual, …)"}
  FREQ: {nombre: frecuencia, tipo: str, desc: "frecuencia (D diaria)"}
comportamiento: {orden_coordenadas: lon_lat}
dcat: {publisher: Banco de la República, theme: economia, accrualPeriodicity: daily}
# Spec 07: medido en la fuente, no en Terrnova.
perfil:
  medido: '2026-10-22'
  fila: una fecha de la UVR en dos series (valor y variación); últimas 40 de cada una en 8 s
  clave:
    columna: TIME_PERIOD + UNIT_MEASURE
    unica: true
  operaciones:
    filtrar: 8.3
  hallazgos:
  - 'el servicio no filtra por fechas: se piden las últimas N (lastNObservations)'
  - 'se calcula por adelantado hasta el 15 del mes siguiente (última medida: 2026-11-15)'
  - «la UVR de hoy» no es la última fila
  decision: en vivo, últimas N; la descripción dice que hay fechas futuras
