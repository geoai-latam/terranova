# Spec 07: medido en la fuente, no en Terrnova.
perfil:
  medido: '2026-10-22'
  fila: un CDP por cada proyecto BPIN que financia, y cada par dos veces; 4 filas, 2 distintas, en CO1.PCCNTR.5588480
  clave:
    columna: id_siif + bpin_codigo
    unica: false
  operaciones:
    filtrar: 0.8
    contar: 0.3
    ordenar: 0.3
    agrupar: 0.2
  hallazgos:
  - copias exactas del par CDP–BPIN
  - fecha_consulta_siif viene vacía
  decision: '`distinct` con el BPIN en la lista blanca'
