id: cce.secop2.compromisos
titulo: "SECOP II, compromisos presupuestales"
entidad: Agencia Nacional de Contratación Pública, Colombia Compra Eficiente (ANCP-CCE)
competencia: administra el Sistema Electrónico de Contratación Pública (Decreto 4170 de 2011)
acto: null
licencia:
  spdx: CC-BY-SA-4.0
  url: https://creativecommons.org/licenses/by-sa/4.0/
  verificada: 2026-10-22
  evidencia: https://www.datos.gov.co/api/views/skc9-met7.json
  cita: "Creative Commons Attribution | Share Alike 4.0 International"
uso_comercial: si
clase_acceso: api
atribucion: "Fuente: Colombia Compra Eficiente, SECOP II, compromisos presupuestales. Fuente: Portal de Datos Abiertos www.datos.gov.co"
protocolo: socrata
conector: datos-abiertos-mcp
url: https://www.datos.gov.co/resource/skc9-met7.json
modo: en_vivo
frescura: {ttl_cache_s: 3600, sla_actualizacion: P1D}
cobertura:
  pais: CO
  aviso_vacio: >
    SECOP II solo publica los compromisos presupuestales de las entidades que registran su presupuesto en la plataforma, y no todas lo hacen (aparecen Funza y las subredes de salud de Bogotá; el PAE de Chía no; medido el 2026-11-02). Sin resultado aquí no quiere decir que el contrato no tenga compromiso: el CDP puede estar en secop_cdp_contrato.
datos_personales: ninguno
estado: publicada
campos:
  id_contrato: {nombre: id_contrato, tipo: str, desc: "identificador del contrato"}
  identificador_nico: {nombre: id_compromiso, tipo: str, desc: "identificador del compromiso"}
  tipo_de_compromiso:
    nombre: tipo
    tipo: str
    desc: "tipo de compromiso: 0 o 1, con su significado en `tipo_significado`"
    codigos: {"0": "ingresos", "1": "vigencias futuras"}
    codigos_norma: "diccionario del conjunto skc9-met7 en datos.gov.co: «ID del tipo de compromiso, donde el valor 0 es de ingresos, el valor 1 corresponde a vigencias futuras» (https://www.datos.gov.co/api/views/skc9-met7.json)"
  c_digo_item: {nombre: codigo_item, tipo: str, desc: "código del ítem en la solicitud al SIIF (interno de la integración; la fuente no publica su tabla)"}
  valor_item: {nombre: valor_item, tipo: float, desc: "saldo total comprometido, en pesos (la fuente: suma de los ítems del proceso)"}
  fecha_registro_item: {nombre: fecha_registro, tipo: date, desc: "fecha de registro del ítem"}
  estado_integraci_n: {nombre: estado_integracion, tipo: str, desc: "resultado de la última consulta al SIIF: Exito, Fallido, Error, Generated o No Definido"}
  estado_integraci_n_item: {nombre: estado_compromiso, tipo: str, desc: "estado del compromiso: No Iniciado, Generado, Con Obligación, Cancelado o No definido"}
  balance_compromiso: {nombre: balance, tipo: float, desc: "saldo comprometido en el CDP, en pesos (así lo nombra la fuente: «Saldo de compromisos CDP»)"}
  balance_vigencia_futura: {nombre: balance_vigencias_futuras, tipo: float, desc: "saldo, a la fecha, de las vigencias futuras, en pesos"}
  valor_a_liberar: {nombre: valor_a_liberar, tipo: float, desc: "valor a liberar, en pesos"}
comportamiento: {max_por_pagina: 50000}
dcat: {publisher: Colombia Compra Eficiente, theme: contratacion, accrualPeriodicity: daily}
# Spec 07: medido en la fuente, no en Terrnova.
perfil:
  medido: '2026-10-22'
  fila: un compromiso presupuestal de un contrato; 1 para CO1.PCCNTR.100201
  clave:
    columna: identificador_nico
    unica: true
  operaciones:
    filtrar: 0.8
    contar: 0.2
    ordenar: 0.4
    agrupar: 0.3
  hallazgos: []
  decision: en vivo, como está
