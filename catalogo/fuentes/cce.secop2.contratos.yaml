# ADR-0014 y ADR-0025: el contratista está en divulgación obligatoria; su nombre, el tipo y el
# número de documento salen como los publica Colombia Compra (la cédula, si es persona natural).
# Quedan fuera `codigo_proveedor`, los datos del representante legal (nombre, documento, género,
# domicilio y nacionalidad), los nombres y documentos del ordenador del gasto, del supervisor y del
# ordenador de pago, y el banco, el tipo y el número de cuenta.
datos_personales: filtrados
estado: publicada
campos:
  id_contrato: {nombre: id_contrato, tipo: str, desc: "identificador del contrato en SECOP II (CO1.PCCNTR.…)"}
  referencia_del_contrato: {nombre: referencia, tipo: str, desc: "referencia que le da la entidad"}
  proceso_de_compra: {nombre: id_proceso, tipo: str, desc: "identificador del proceso de compra (CO1.BDOS.…)"}
  nombre_entidad: {nombre: entidad, tipo: str, desc: "entidad estatal contratante"}
  nit_entidad: {nombre: nit_entidad, tipo: int, desc: "NIT de la entidad contratante"}
  departamento: {nombre: departamento, tipo: str, desc: "departamento de la entidad contratante"}
  ciudad: {nombre: municipio, tipo: str, desc: "municipio de la entidad contratante (no el de ejecución)"}
  tipodocproveedor: {nombre: tipo_documento_contratista, tipo: str, desc: "NIT, Cédula de Ciudadanía, etc."}
  documento_proveedor: {nombre: documento_contratista, tipo: str, desc: "número de documento del contratista, como lo publica la fuente (ADR-0025)"}
  proveedor_adjudicado: {nombre: contratista, tipo: str, desc: "nombre o razón social del contratista (divulgación obligatoria)"}
  objeto_del_contrato: {nombre: objeto, tipo: str, desc: "objeto del contrato"}
  tipo_de_contrato: {nombre: tipo_contrato, tipo: str, desc: "tipo de contrato"}
  modalidad_de_contratacion: {nombre: modalidad, tipo: str, desc: "modalidad de contratación"}
  estado_contrato: {nombre: estado, tipo: str, desc: "estado del contrato en SECOP II"}
  valor_del_contrato: {nombre: valor, tipo: float, desc: "valor del contrato, en pesos colombianos"}
  valor_pagado: {nombre: valor_pagado, tipo: float, desc: "valor pagado que reporta la entidad, en pesos"}
  fecha_de_firma: {nombre: fecha_firma, tipo: date, desc: "fecha de firma"}
  fecha_de_inicio_del_contrato: {nombre: fecha_inicio, tipo: date, desc: "fecha de inicio"}
  fecha_de_fin_del_contrato: {nombre: fecha_fin, tipo: date, desc: "fecha de terminación"}
  ultima_actualizacion: {nombre: fecha_actualizacion, tipo: date, desc: "última actualización del registro en SECOP II"}
  urlproceso: {nombre: url_proceso, tipo: str, desc: "enlace público al proceso en SECOP II (la fuente lo da como {url: …})"}
comportamiento: {p95_ms_medido: 2800, max_por_pagina: 50000}
dcat: {publisher: Colombia Compra Eficiente, theme: contratacion, accrualPeriodicity: daily}
# Spec 07: medido en la fuente, no en Terranova.
perfil:
  medido: '2026-10-22'
  fila: un contrato electrónico; 1 para CO1.PCCNTR.5141215
  clave:
    columna: id_contrato
    unica: true
  operaciones:
    filtrar: 0.5
    contar: 0.2
    ordenar: 0.2
    agrupar: 0.2
  hallazgos:
  - en toda la tabla, 3 id_contrato repetidos entre 334 431 (medido en la ola 1)
  - 'ultima_actualizacion viene nula en el 98 %: no sirve para frescura'
  - 'documento_proveedor trae cédulas de personas naturales (ADR-0025: se muestra, no se busca)'
  decision: en vivo por id, entidad o municipio; buscar en el texto, por la copia
