# Spec 07: medido en la fuente, no en Terrnova.
perfil:
  medido: 2026-10-22
  fila: "un ítem del plan por cada categoría UNSPSC; Pitalito 2025: 754 filas para 582 ítems del municipio"
  clave: {columna: id, unica: false}
  operaciones: {filtrar: 0.6, contar: 0.6, agrupar: 14.7}
  hallazgos:
  - "un ítem se repite una vez por categoría UNSPSC, con el mismo valor (hasta 12 veces)"
  - "sumar filas infla: el plan 2025 del municipio de Pitalito suma $91 410 millones por filas y $54 008 millones por ítem"
  - "un NIT no es una entidad: el de Pitalito cubre al municipio, al concejo y a la personería, cada una con su código y su plan"
  - "la fuente guarda solo la última versión de cada plan"
  - "Pitalito no tiene plan de 2020"
  - "listar con distinct y orden por id no responde en 300 s; sin orden responde en 6 s"
  decision: "por NIT, un resumen por entidad con valor deduplicado por ítem (etapa previa); por código de entidad, los ítems con distinct y sin orden"
