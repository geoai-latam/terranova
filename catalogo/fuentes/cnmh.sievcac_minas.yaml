# Spec 07: medido en la fuente, no en Terrnova.
perfil:
  medido: 2026-10-23
  fila: "una víctima en un caso; 10 654 filas, hasta 2026"
  operaciones: {filtrar: 0.2, agrupar: 0.2}
  hallazgos:
  - "el año 0 es «sin información»"
  - "unas pocas víctimas se repiten en dos filas: se cuentan personas distintas (id_persona)"
  - "fuerza_o_grupo_armado no es el responsable: es la fuerza o el grupo de la víctima cuando era combatiente (vacío en las civiles), así que no se sirve"
  - "el CNMH revisa casos viejos con cada corte: las cifras pasadas pueden cambiar"
  decision: "en vivo por municipio, víctimas y casos por año"
