# Spec 07: medido en la fuente, no en Terrnova.
perfil:
  medido: 2026-10-22
  fila: "un fragmento del texto de una sentencia; T-760/08 tiene 1,4 M caracteres y 32 apariciones de «derecho fundamental a la salud»"
  operaciones: {filtrar: 2.0}
  hallazgos:
  - "el texto está en HTML estático (relatoria/<año>/<T-760-08>.htm); robots.txt permite /relatoria/"
  - "declara windows-1252 solo en el <meta>"
  - "la búsqueda JSON del sitio es un backend interno (Elasticsearch) sin documentar: no se usa sin permiso (ADR-0018)"
  - "el título de la página es «***», «VI» o «Sentencia No»: no se usa; el número sale del texto"
  - "las de unificación están como SU214-16.htm; SU-214-16.htm responde 200 con una página vacía de 8 607 bytes (medido 2026-11-03)"
  - "la parte resolutiva empieza en la primera línea que es solo «RESUELVE» (con dos puntos o sin ellos): 9 de 9 sentencias de 1992 a 2021 (medido 2026-11-03)"
  - "la Corte reemplaza con datos ficticios los nombres en algunas tutelas (nota de relatoría)"
  decision: "fragmentos alrededor de lo buscado y el comienzo del texto; el índice sale de corte_constitucional_sentencia"
