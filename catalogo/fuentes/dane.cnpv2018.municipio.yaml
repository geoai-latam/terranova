id: dane.cnpv2018.municipio
titulo: Censo Nacional de Población y Vivienda 2018, totales por municipio
entidad: Departamento Administrativo Nacional de Estadística (DANE)
competencia: autoridad estadística nacional; el CNPV 2018 es el último censo de población
acto: null
# Términos del DANE: autorizan uso, aprovechamiento, transformación y análisis citando «Fuente: DANE»,
# sin mencionar la redistribución. Agregados municipales, sin persona ni reserva → dato público
# reutilizable (ADR-0019 enmienda: ámbar, sirve con aviso). Si el DANE confirma por escrito la
# redistribución, sube a verde (F0.8).
licencia:
  spdx: LicenseRef-dane-terminos
  url: https://www.dane.gov.co/index.php/terminos-y-condiciones
  verificada: null
  evidencia: https://www.dane.gov.co/index.php/terminos-y-condiciones
  cita: "Se autoriza el uso, aprovechamiento, transformación y análisis de la información contenida en esta portal, siempre y cuando se haga la siguiente cita textual"
uso_comercial: si
clase_acceso: api
atribucion: "Fuente: DANE, Censo Nacional de Población y Vivienda 2018"
protocolo: arcgis_rest
# Copia (ADR-0024, arcgis sin geometría): el geoportal del DANE no responde a la IP del datacenter
# (medido el 29-10-2026: sin conexión desde la VPS, 0,3 s desde Colombia), así que la copia se baja
# desde Colombia. Son cifras cerradas del censo 2018: una sola ingesta vale por años.
conector: copia
# Capa 800 (municipio) del CNPV integrado al MGN. Los conteos llevan prefijo S o T (STP27_PERS
# personas, STVIVIENDA viviendas, TSP16_HOG hogares).
url: https://geoportal.dane.gov.co/mparcgis/rest/services/MARCO_INTEGRADO/Serv_DatosCNPV2018_Integrados_MGN2018/MapServer
modo: copia
copia:
  origen: arcgis
  capa: 800
  geometria: false
  tabla: dane_cnpv2018_municipio
  clave: OBJECTID
  por_pagina: 2000
  indices: [MPIO_CDPMP]
# Cifras cerradas del censo 2018: no cambian hasta el próximo censo.
frescura: {ttl_cache_s: 2592000, sla_actualizacion: P10Y}
cobertura: {pais: CO, periodo: "2018 (Censo Nacional de Población y Vivienda)"}
# dane-mcp consulta la capa 800 (municipios) del servicio del censo.
capas_servicio: [800]
datos_personales: ninguno  # solo agregados municipales (reserva estadística)
estado: publicada
clasificacion_licencia: ambar
campos:
  MPIO_CDPMP: {nombre: municipio_divipola, tipo: str, desc: "código DIVIPOLA del municipio, 5 dígitos"}
  MPIO_CNMBR: {nombre: municipio, tipo: str, desc: "nombre del municipio"}
  DPTO_CCDGO: {nombre: departamento_divipola, tipo: str, desc: "código DIVIPOLA del departamento, 2 dígitos"}
  STP27_PERS: {nombre: poblacion_censada, tipo: int, desc: "personas censadas en 2018; no es una proyección"}
  STVIVIENDA: {nombre: viviendas, tipo: int, desc: "viviendas censadas en 2018"}
  TSP16_HOG: {nombre: hogares, tipo: int, desc: "hogares censados en 2018"}
  OBJECTID: {nombre: id_elemento, tipo: int, desc: "identificador del municipio en la capa 800"}
comportamiento: {orden_coordenadas: lon_lat}
dcat: {publisher: DANE, theme: estadisticas, accrualPeriodicity: irregular}
# Spec 07: medido en la fuente, no en Terranova.
perfil:
  medido: '2026-10-22'
  fila: un municipio del censo 2018 con personas, viviendas y hogares; 1 122 municipios
  clave:
    columna: MPIO_CDPMP
    unica: true
  operaciones:
    contar: 0.2
  hallazgos:
  - 'es el censo 2018: no es la población de hoy'
  - 'el MapServer no cuenta valores distintos: la unicidad se midió agrupando'
  decision: "por copia de la capa 800 sin geometría (una ingesta; cifras cerradas)"
