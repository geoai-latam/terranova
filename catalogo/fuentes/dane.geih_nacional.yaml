id: dane.geih_nacional
titulo: "Mercado laboral, total nacional, serie mensual (anexo de la GEIH del DANE)"
entidad: Departamento Administrativo Nacional de Estadística (DANE)
competencia: produce las estadísticas oficiales (Decreto 262 de 2004)
acto: null
# Términos del DANE: uso libre citando «Fuente: DANE».
licencia:
  spdx: LicenseRef-dane-terminos
  url: https://www.dane.gov.co/index.php/terminos-y-condiciones
  verificada: null
  evidencia: https://www.dane.gov.co/index.php/terminos-y-condiciones
  cita: "Se autoriza el uso, aprovechamiento, transformación y análisis… siempre y cuando se haga la cita textual «Fuente: DANE»"
uso_comercial: si
clase_acceso: bulk
atribucion: "Fuente: Departamento Administrativo Nacional de Estadística"
protocolo: archivo
# Copia (ADR-0024, origen conector): el DANE responde 403 a la IP del datacenter, así que la
# tabla se baja entera desde Colombia con el mismo `web_tabla` que la servía en vivo.
conector: copia
url: https://www.dane.gov.co/index.php/estadisticas-por-tema/mercado-laboral/empleo-y-desempleo
modo: copia
copia:
  origen: conector
  conector: web-mcp
  tool: web_tabla
  argumentos:
    pagina: "{url_fuente}"
    enlace_con: 'anex-GEIH-[a-z]{3}[0-9]{4}\.xlsx'
    hoja: "Total nacional"
    fila_encabezado: 12
    filas_encabezado: 2
    largo_desde: 2
  tabla: dane_geih_nacional
  clave: _fila
  indices: [columna]
frescura: {ttl_cache_s: 86400, sla_actualizacion: P1M}
cobertura: {pais: CO, periodo: "enero de 2001 al último mes publicado"}
datos_personales: ninguno
estado: publicada
clasificacion_licencia: ambar
campos:
  Concepto: {nombre: indicador, tipo: str, desc: "indicador (TGP, TO, TD…) o población, en miles"}
  columna: {nombre: anio, tipo: str, desc: "año"}
  subcolumna: {nombre: mes, tipo: str, desc: "mes (Ene, Feb, …)"}
  valor: {nombre: valor, tipo: float, desc: "porcentaje para las tasas; miles de personas para las poblaciones"}
  _fila: {nombre: fila, tipo: int, desc: "orden de la fila en el anexo (la copia la numera)"}
dcat: {publisher: "Departamento Administrativo Nacional de Estadística (DANE)", accrualPeriodicity: irregular}
# Spec 07: medido en la fuente, no en Terranova.
perfil:
  medido: 2026-10-22
  fila: "un indicador en un mes; serie mensual desde enero de 2001"
  operaciones: {filtrar: 4.0}
  hallazgos:
  - "el archivo cambia de nombre cada mes (anex-GEIH-ago2026.xlsx): se descubre en la página"
  - "tabla ancha: el año combinado sobre 12 meses; se pasa a una fila por indicador y mes"
  - "algunos indicadores (TCDFTP) valen 0 en los primeros años: no se medían"
  - "los nombres de los indicadores traen espacios al final"
  decision: "por copia (el DANE bloquea al datacenter) del anexo del último mes, por año"
