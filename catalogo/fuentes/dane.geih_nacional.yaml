id: dane.geih_nacional
titulo: "Mercado laboral, total nacional, serie mensual (anexo de la GEIH del DANE)"
entidad: Departamento Administrativo Nacional de Estadística (DANE)
competencia: produce las estadísticas oficiales (Decreto 262 de 2004)
acto: null
# Términos de dane.gov.co (ADR-0039), cláusula 2: uso, aprovechamiento, transformación y análisis
# con la cita textual. La prohibición de comercializar (cláusula 1) recae sobre el DANE y sus
# servidores, no sobre el usuario; las cifras son hechos (Decisión Andina 351). Son anexos
# publicados, no microdatos.
licencia:
  spdx: LicenseRef-dane-terminos
  url: https://www.dane.gov.co/index.php/terminos-y-condiciones
  verificada: 2026-11-04
  evidencia: https://www.dane.gov.co/index.php/terminos-y-condiciones
  cita: "Se autoriza el uso, aprovechamiento, transformación y análisis de la información contenida en esta portal, siempre y cuando se haga la siguiente cita textual: “Fuente: Departamento Administrativo Nacional de Estadística: www.dane.gov.co”"
uso_comercial: si
clase_acceso: bulk
atribucion: "Fuente: Departamento Administrativo Nacional de Estadística: www.dane.gov.co. Gran Encuesta Integrada de Hogares (GEIH), mercado laboral"
protocolo: archivo
# Copia (ADR-0024, origen conector): el DANE responde 403 a la IP del datacenter, así que la
# tabla se baja entera desde Colombia con el mismo `web_tabla` que la servía en vivo.
conector: copia
url: https://www.dane.gov.co/index.php/estadisticas-por-tema/mercado-laboral/empleo-y-desempleo
modo: copia
copia:
  origen: conector
  conector: web-mcp
  tool: web_tabla
  argumentos:
    pagina: "{url_fuente}"
    enlace_con: 'anex-GEIH-[a-z]{3}[0-9]{4}\.xlsx'
    hoja: "Total nacional"
    fila_encabezado: 12
    filas_encabezado: 2
    largo_desde: 2
    # La hoja trae dos tablas apiladas: Total Nacional (filas 12 a 30) y Total Cabeceras (32 a
    # 52). Medido el 2026-11-02 en anex-GEIH-sep2026.xlsx: sin este corte, la copia mezclaba las
    # dos sin decir cuál es cuál (población de enero de 2026: 52 339 y 40 765 miles).
    hasta_fila: 30
  tabla: dane_geih_nacional
  clave: _fila
  indices: [columna]
frescura: {ttl_cache_s: 86400, sla_actualizacion: P1M}
cobertura: {pais: CO, periodo: "enero de 2001 al último mes publicado"}
datos_personales: ninguno
estado: publicada
clasificacion_licencia: verde
campos:
  Concepto: {nombre: indicador, tipo: str, desc: "indicador (TGP, TO, TD…) o población, en miles"}
  columna: {nombre: anio, tipo: str, desc: "año"}
  subcolumna: {nombre: mes, tipo: str, desc: "mes (Ene, Feb, …)"}
  # El anexo pone 0 donde el indicador no se medía: TCDFTP, MCSFT y la fuerza de trabajo potencial
  # de 2001 a 2020 (la serie empieza en 2021) y la subocupación de marzo a julio de 2020 (nota* del
  # anexo, por la pandemia). Ninguna tasa ni población nacional vale 0: el 0 sale vacío.
  valor: {nombre: valor, tipo: float, decimales: 1, vacios: ["0", "0.0"], desc: "porcentaje para las tasas; miles de personas para las poblaciones; con un decimal, como lo publica el DANE; vacío donde el DANE no lo midió"}
  _fila: {nombre: fila, tipo: int, desc: "orden de la fila en el anexo (la copia la numera)"}
dcat: {publisher: "Departamento Administrativo Nacional de Estadística (DANE)", accrualPeriodicity: irregular}
# Spec 07: medido en la fuente, no en Terrnova.
perfil:
  medido: 2026-10-22
  fila: "un indicador en un mes; serie mensual desde enero de 2001"
  operaciones: {filtrar: 4.0}
  hallazgos:
  - "el archivo cambia de nombre cada mes (anex-GEIH-ago2026.xlsx): se descubre en la página"
  - "tabla ancha: el año combinado sobre 12 meses; se pasa a una fila por indicador y mes"
  - "algunos indicadores (TCDFTP) valen 0 en los primeros años: no se medían"
  - "los nombres de los indicadores traen espacios al final"
  - "la hoja «Total nacional» apila Total Nacional y Total Cabeceras con los mismos indicadores: la copia corta en la fila 30 (medido el 2026-11-02)"
  decision: "por copia (el DANE bloquea al datacenter) del anexo del último mes, por año"
