id: dane.ipm_nacional
titulo: "Índice de pobreza multidimensional nacional por dominio (anexo del DANE)"
entidad: Departamento Administrativo Nacional de Estadística (DANE)
competencia: produce las estadísticas oficiales (Decreto 262 de 2004)
acto: null
# Términos del DANE: uso libre citando «Fuente: DANE».
licencia:
  spdx: LicenseRef-dane-terminos
  url: https://www.dane.gov.co/index.php/terminos-y-condiciones
  verificada: null
  evidencia: https://www.dane.gov.co/index.php/terminos-y-condiciones
  cita: "Se autoriza el uso, aprovechamiento, transformación y análisis… siempre y cuando se haga la cita textual «Fuente: DANE»"
uso_comercial: si
clase_acceso: bulk
atribucion: "Fuente: Departamento Administrativo Nacional de Estadística"
protocolo: archivo
# Copia (ADR-0024, origen conector): el DANE responde 403 a la IP del datacenter, así que la
# tabla se baja entera desde Colombia con el mismo `web_tabla` que la servía en vivo.
conector: copia
url: https://www.dane.gov.co/index.php/estadisticas-por-tema/pobreza-y-condiciones-de-vida/pobreza-multidimensional
modo: copia
copia:
  origen: conector
  conector: web-mcp
  tool: web_tabla
  argumentos:
    pagina: "{url_fuente}"
    enlace_con: 'anex-PMultidimensional-[0-9]{4}\.xlsx'
    hoja: IPM_Dominios
    fila_encabezado: 9
    rellenar: 1
    largo_desde: 2
  tabla: dane_ipm_nacional
  clave: _fila
  indices: [columna_1]
frescura: {ttl_cache_s: 86400, sla_actualizacion: P1M}
cobertura: {pais: CO, periodo: "2010 a 2025 (anexo 2025)"}
datos_personales: ninguno
estado: publicada
clasificacion_licencia: ambar
campos:
  columna_1: {nombre: dominio, tipo: str, desc: "Nacional, Cabecera, Centros poblados y rural disperso, regiones…"}
  columna: {nombre: anio, tipo: str, desc: "año (como lo escribe el DANE: «2020**» lleva nota)"}
  valor: {nombre: valor, tipo: float, desc: "porcentaje"}
  _fila: {nombre: fila, tipo: int, desc: "orden de la fila en el anexo (la copia la numera)"}
dcat: {publisher: "Departamento Administrativo Nacional de Estadística (DANE)", accrualPeriodicity: irregular}
# Spec 07: medido en la fuente, no en Terrnova.
perfil:
  medido: 2026-10-22
  fila: "un dominio y un año; 2010 a 2025"
  operaciones: {filtrar: 3.0}
  hallazgos:
  - "la columna del dominio no tiene encabezado en la fila de los años: sale como columna_1"
  decision: "por copia (el DANE bloquea al datacenter) del anexo vigente, por dominio"
