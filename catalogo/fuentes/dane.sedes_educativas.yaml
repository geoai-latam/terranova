# El servicio se editó por última vez el 2024-11-14 (integrado al MGN 2024).
frescura: {ttl_cache_s: 86400, sla_actualizacion: P365D}
cobertura: {pais: CO, excluye: ["matrícula y docentes (MEN)", "resultados de las pruebas (icfes_saber11)", "sedes cerradas: el servicio solo trae las activas"]}
# Teléfono y correo son los de contacto de la sede, como los publica el DANE (datos abiertos como
# los publica la fuente). No se busca por ellos: la búsqueda va por código, nombre y dirección.
datos_personales: ninguno
estado: publicada
campos:
  FID: {nombre: id_elemento, tipo: int, desc: "identificador de la fila en la capa del DANE (cambia si el DANE republica)"}
  COD_DANE: {nombre: codigo_dane, tipo: str, desc: "código DANE de la sede (12 dígitos): el mismo de las pruebas Saber 11 y de los registros del MEN"}
  NOMBRE_INS: {nombre: nombre, tipo: str, desc: "nombre de la sede"}
  SEDE_PRINC: {nombre: sede_principal, tipo: str, desc: "«S» si es la sede principal del establecimiento, «N» si no"}
  COD_SEDE_P: {nombre: codigo_sede_principal, tipo: str, desc: "código DANE de la sede principal del establecimiento al que pertenece"}
  ESTADO: {nombre: estado, tipo: str, desc: "estado de la sede (el servicio solo trae «ACTIVA»)"}
  DIRECCION: {nombre: direccion, tipo: str, desc: "dirección como la registra el DANE (en lo rural, la vereda)"}
  ID_DEPARTA: {nombre: departamento_divipola, tipo: str, desc: "código DIVIPOLA del departamento"}
  DEPARTAMEN: {nombre: departamento, tipo: str, desc: "departamento"}
  ID_MUNICIP: {nombre: municipio_divipola, tipo: str, desc: "código DIVIPOLA del municipio"}
  MUNICIPIO: {nombre: municipio, tipo: str, desc: "municipio"}
  CALENDARIO: {nombre: calendario, tipo: str, desc: "calendario académico («A», «B»…)"}
  NATURALEZA: {nombre: naturaleza, tipo: str, desc: "naturaleza jurídica de quien presta el servicio: «OFICIAL», «ORGANIZACIÓN CON FINES DE LUCRO», «ORGANIZACIÓN SOLIDARIA SIN FINES DE LUCRO», «PERSONA NATURAL», «COMUNIDAD RELIGIOSA» o «RÉGIMEN ESPECIAL»"}
  SECTOR: {nombre: sector, tipo: str, desc: "«OFICIAL» o «NO OFICIAL»"}
  ZONA: {nombre: zona, tipo: str, desc: "«URBANO» o «RURAL»"}
  JORNADA: {nombre: jornada, tipo: str, desc: "jornada (p. ej. «MAÑANA», «ÚNICA»)"}
  NIVEL: {nombre: nivel, tipo: str, desc: "nivel o niveles que registra el DANE para la sede (p. ej. «EDUCACIÓN BÁSICA PRIMARIA»; a veces varios separados por comas)"}
  TELEFONO: {nombre: telefono, tipo: str, desc: "teléfono de contacto de la sede, como lo publica el DANE"}
  TIPO_TELEF: {nombre: tipo_telefono, tipo: str, desc: "«FIJO» o «CELULAR»"}
  CORREO_INS: {nombre: correo, tipo: str, desc: "correo de la sede, como lo publica el DANE (casi siempre vacío)"}
  LONGITUD: {nombre: longitud, tipo: float, desc: "longitud que publica el DANE (la geometría usa la misma)"}
  LATITUD: {nombre: latitud, tipo: float, desc: "latitud que publica el DANE"}
comportamiento: {max_por_pagina: 2000, orden_coordenadas: lon_lat}
dcat: {publisher: DANE, theme: educacion}
# Spec 07: medido en la fuente, no en Terrnova.
perfil:
  medido: '2026-11-05'
  fila: "una sede educativa activa"
