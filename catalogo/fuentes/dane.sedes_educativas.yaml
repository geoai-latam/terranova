  - "rural 37 379, urbano 19 271; oficiales 44 360, no oficiales 12 290; Bogotá 2 595 sedes, Cali 1 046, Medellín 847"
  - "teléfono y correo: 6 514 sedes con correo y 6 112 con celular, como los publica el DANE"
  - "el MEN publica un corte más nuevo (DANE_SISE_Pt, 2025-12) sin licencia de reutilización: no se usa"
  decision: "copia espacial con búsqueda por código DANE, nombre, dirección, municipio y departamento"
