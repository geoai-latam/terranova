id: icfes.saber11
titulo: Resultados únicos de la prueba Saber 11 (ICFES)
entidad: Instituto Colombiano para la Evaluación de la Educación (ICFES)
competencia: aplica y publica los exámenes de Estado (Ley 1324 de 2009)
acto: null
licencia:
  spdx: CC-BY-SA-4.0
  url: https://creativecommons.org/licenses/by-sa/4.0/
  verificada: 2026-10-22
  evidencia: https://www.datos.gov.co/api/views/kgxf-xxbe.json
  cita: "Creative Commons Attribution | Share Alike 4.0 International"
uso_comercial: si
clase_acceso: api
atribucion: "Fuente: ICFES, Resultados únicos Saber 11. Fuente: Portal de Datos Abiertos www.datos.gov.co"
protocolo: socrata
conector: copia
# Microdatos por estudiante (7,1 M filas). Agregar en vivo en dos etapas pasaba de 90 s en un
# municipio grande, así que se copian ya agregados: la copia guarda grupos (periodo, municipio,
# sede y estrato) con cuántos estudiantes tienen y la suma de sus puntajes; nunca el seudónimo
# del estudiante ni una fila suya. Solo salen grupos de 10 o más (ADR-0014).
url: https://www.datos.gov.co/resource/kgxf-xxbe.json
modo: copia
copia:
  origen: socrata_agregado
  conjunto: kgxf-xxbe
  tabla: icfes_saber11
  clave: _fila
  preagregado:
    particion: periodo
    unico: estu_consecutivo
    grupo: [periodo, cole_cod_mcpio_ubicacion, cole_cod_dane_sede, fami_estratovivienda]
    medidas: [punt_global, punt_matematicas, punt_lectura_critica]
    nombre: cole_nombre_sede
    cuenta: estudiantes
  indices: [cole_cod_mcpio_ubicacion, cole_cod_dane_sede]
  orden_fisico: cole_cod_mcpio_ubicacion
# El ICFES publica una vez al año los resultados del año anterior.
frescura: {ttl_cache_s: 2592000, sla_actualizacion: P6M}
cobertura: {pais: CO, columna_tiempo: periodo}
datos_personales: filtrados
estado: publicada
campos:
  periodo: {nombre: periodo, tipo: str, desc: "periodo del examen, AAAAS: el año y luego 1 (primer semestre: pocos colegios, sobre todo de calendario B) o 2 y 4 (segundo semestre: calendario A, la mayoría); 20224 = 2022, segundo semestre"}
  cole_cod_mcpio_ubicacion: {nombre: municipio_divipola, tipo: str, desc: "municipio del colegio, DIVIPOLA"}
  cole_cod_dane_sede: {nombre: codigo_dane_sede, tipo: str, desc: "código DANE de la sede del colegio"}
  fami_estratovivienda: {nombre: estrato, tipo: str, desc: "estrato de la vivienda del estudiante (vacío si no lo declaró)"}
  cole_nombre_sede: {nombre: sede, tipo: str, desc: "nombre de la sede (cambia de escritura entre años: sale el mayor)"}
  estudiantes: {nombre: estudiantes, tipo: int, desc: "estudiantes del grupo, cada uno una vez aunque la fuente lo repita"}
  suma_punt_global: {nombre: suma_punt_global, tipo: float, desc: "suma del puntaje global (0–500) de los estudiantes con dato"}
  n_punt_global: {nombre: n_punt_global, tipo: int, desc: "estudiantes con puntaje global"}
  suma_punt_matematicas: {nombre: suma_punt_matematicas, tipo: float, desc: "suma del puntaje de matemáticas"}
  n_punt_matematicas: {nombre: n_punt_matematicas, tipo: int, desc: "estudiantes con puntaje de matemáticas"}
  suma_punt_lectura_critica: {nombre: suma_punt_lectura_critica, tipo: float, desc: "suma del puntaje de lectura crítica"}
  n_punt_lectura_critica: {nombre: n_punt_lectura_critica, tipo: int, desc: "estudiantes con puntaje de lectura crítica"}
  _fila: {nombre: fila, tipo: int, desc: "número del grupo en la copia (la copia lo numera)"}
comportamiento: {orden_coordenadas: lon_lat}
dcat: {publisher: Instituto Colombiano para la Evaluación de la Educación, theme: educacion, accrualPeriodicity: annual}
# Spec 07: medido en la fuente, no en Terrnova.
perfil:
  medido: '2026-10-22'
  fila: 'un estudiante en un periodo del examen; Chía: 26 929 filas para 23 014 estudiantes'
  clave:
    columna: periodo + estu_consecutivo
    unica: false
  operaciones:
    filtrar: 0.6
    contar: 64.5
    ordenar: 0.2
    agrupar: 0.2
  hallazgos:
  - en 20181, 20194 y 20224 la fuente repite estudiantes (hasta 3 veces), con los mismos puntajes
  - contar filas daba 3 372 estudiantes en Chía 20224 (son 1 686); en 20181, un promedio global de 317,0
    (es 306,2)
  - los periodos de 2010 no traen puntaje global ni de lectura crítica
  - contar todo un municipio tarda ~64 s
  - 'en frío, la consulta en dos etapas pasó una vez de 90 s; en caliente, de 3 a 11 s'
  decision: etapa previa por estudiante y luego agregado; nunca grupos de menos de 10 (ADR-0014)
