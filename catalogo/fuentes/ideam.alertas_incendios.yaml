id: ideam.alertas_incendios
titulo: "Alertas diarias por incendios de la cobertura vegetal por municipio (IDEAM, OSPA)"
entidad: Instituto de Hidrología, Meteorología y Estudios Ambientales (IDEAM)
competencia: emite las alertas hidrometeorológicas del país (Decreto 1277 de 1994; Ley 1523 de 2012, SNGRD)
acto: null
# La ficha de datos.gov.co (vnzc-4d6e) declara CC BY-SA 4.0 y enlaza al CSV del IDEAM.
licencia:
  spdx: CC-BY-SA-4.0
  url: https://creativecommons.org/licenses/by-sa/4.0/
  verificada: 2026-10-28
  evidencia: https://www.datos.gov.co/api/views/vnzc-4d6e.json
  cita: "Creative Commons Attribution | Share Alike 4.0 International"
uso_comercial: si
clase_acceso: bulk
atribucion: "Fuente: Instituto de Hidrología, Meteorología y Estudios Ambientales (IDEAM), Oficina del Servicio de Pronósticos y Alertas"
protocolo: archivo
# Copia (ADR-0024, origen csv): como las alertas por deslizamiento, un CSV del año que el IDEAM
# regenera cada noche, sin API; bart.ideam.gov.co no responde al datacenter.
conector: copia
url: https://bart.ideam.gov.co/ospa/DatosAbiertos/Alertas_Incendios/alertas_incendios.csv
modo: copia
copia:
  origen: csv
  descargas: [https://bart.ideam.gov.co/ospa/DatosAbiertos/Alertas_Incendios/alertas_incendios.csv]
  separador: ";"
  ceros: {COD_DANE: 5}
  tabla: ideam_alertas_incendios
  clave: _fila
  indices: [COD_DANE]
frescura: {ttl_cache_s: 3600, sla_actualizacion: P1D}
cobertura: {pais: CO, periodo: "el año en curso (el archivo acumula desde el 1 de enero)"}
datos_personales: ninguno
estado: publicada
campos:
  COD_DANE: {nombre: municipio_divipola, tipo: str, desc: "municipio, DIVIPOLA de 5 dígitos"}
  MUNICIPIO: {nombre: municipio, tipo: str, desc: "nombre del municipio"}
  DEPARTAMENTO: {nombre: departamento, tipo: str, desc: "nombre del departamento"}
  REGION: {nombre: region, tipo: str, desc: "región natural (ANDINA, CARIBE, PACÍFICO…)"}
  TEXTO_AMENAZA: {nombre: nivel_alerta, tipo: str, desc: "nivel de la alerta: ALTA (roja), MODERADA (naranja) o BAJA (amarilla)"}
  FECHA_EJECUCION: {nombre: fecha, tipo: date, desc: "día del boletín que emitió la alerta"}
  _fila: {nombre: fila, tipo: int, desc: "orden de la fila en el archivo (la copia la numera)"}
comportamiento: {orden_coordenadas: lon_lat}
dcat: {publisher: IDEAM, theme: ambiente, accrualPeriodicity: daily}
# Spec 07: medido en la fuente, no en Terrnova.
perfil:
  medido: 2026-10-28
  fila: "un municipio con alerta por incendio en el boletín de un día"
  clave: {columna: "COD_DANE + FECHA_EJECUCION", unica: true}
  operaciones: {filtrar: 3.0}
  hallazgos:
  - "43 898 filas del 01-01 al 27-10-2026 (300 boletines, de 1 a 663 municipios cada uno; el del 27-10 trae 47: 10 en alta, 16 en moderada y 21 en baja)"
  - "solo lista los municipios con alerta: un municipio que no sale en el boletín de un día no tenía alerta ese día"
  - "292 filas traen el DIVIPOLA sin el cero inicial, sobre todo en julio y septiembre (la copia lo rellena); 2 vienen con 6 dígitos y 1 sin código"
  decision: "por copia diaria del CSV del IDEAM, desde Colombia; se consulta por DIVIPOLA, lo más reciente primero"
