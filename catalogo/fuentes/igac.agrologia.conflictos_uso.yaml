id: igac.agrologia.conflictos_uso
titulo: Conflictos de uso de las tierras de Colombia, 2012 (escala 1:100.000)
entidad: Instituto Geográfico Agustín Codazzi (IGAC)
competencia: autoridad nacional de agrología (Subdirección de Agrología)
acto: Resolución 616 de 2020
# El ítem del servicio trae licenseInfo vacío; manda la Res. 616 (art. 3: agrología nacional; art. 7:
# CC BY 4.0). Ver catalogo/licencias/m1.yaml, entrada igac.res616.datos_abiertos.
licencia:
  spdx: CC-BY-4.0
  url: https://creativecommons.org/licenses/by/4.0/
  verificada: 2026-10-21
  evidencia: https://www.igac.gov.co/sites/default/files/transparencia/normograma/resolucion_616_de_2020.pdf
  cita: "ARTÍCULO 7º. LICENCIA CREATIVE COMMONS CC-BY 4.0. Se adopta la Licencia Creative Commons CC-BY 4.0"
uso_comercial: si
clase_acceso: api
atribucion: "Fuente: IGAC, Subdirección de Agrología"
protocolo: arcgis_rest
conector: copia
# Capa 0 Conflictos_2012. La capa 1 (conflictos_SAyP) tiene otro esquema y no se usa; la capa 0 no
# responde en San Andrés (-81.70, 12.55, medido el 2026-10-21). El campo area no declara unidad:
# queda fuera.
url: https://mapas.igac.gov.co/server/rest/services/agrologia/conflictos2012territorionacional/MapServer
modo: copia
# ADR-0024: copia en PostGIS. En vivo, un punto tardaba ~50 s desde el servidor (medido el
# 2026-10-27). Escala 1:100.000: simplificar a ~11 m al copiar no cambia el resultado.
copia:
  origen: arcgis
  capa: 0
  tabla: igac_conflictos_uso
  clave: OBJECTID_1
  por_pagina: 2000  # ~50 s por consulta sea cual sea el tamaño: páginas grandes (548 mil polígonos)
  tolerancia: 0.0001
frescura: {ttl_cache_s: 604800, sla_actualizacion: P1Y}
cobertura:
  periodo: "estudio de 2012"
  pais: CO
  excluye: ["88 San Andrés, Providencia y Santa Catalina (la capa 0 no lo cubre)"]
datos_personales: ninguno
estado: publicada
campos:
  OBJECTID_1: {nombre: id_poligono, tipo: int, desc: "identificador del polígono en el servicio (cambia si la fuente republica la capa)"}
  UCConfli: {nombre: unidad_conflicto, tipo: str, desc: "símbolo de la unidad de conflicto (p. ej. U2)"}
  T_Conflicto: {nombre: tipo_conflicto, tipo: str, desc: "tipo e intensidad del conflicto de uso (p. ej. subutilización moderada)"}
comportamiento: {max_por_pagina: 2000, orden_coordenadas: lon_lat}
capas_servicio: [0]  # la ficha técnica cosecha la capa aunque se sirva por copia
dcat: {publisher: IGAC, theme: agrologia, accrualPeriodicity: irregular}
# Spec 07: medido en la fuente, no en Terrnova.
perfil:
  medido: '2026-10-22'
  fila: un polígono de conflicto de uso (2012); 548 423 en el país
  operaciones:
    filtrar: 13.3
    contar: 44.5
    ordenar: 52.9
    agrupar: 46.7
  hallazgos:
  - es el estudio de 2012
  - el MapServer no cuenta valores distintos
  - contar, ordenar y agrupar el país tarda 45 a 53 s
  - el punto de prueba toca un solo elemento
  decision: copia (en vivo, ~50 s por punto); por punto
