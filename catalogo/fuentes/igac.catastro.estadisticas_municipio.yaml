id: igac.catastro.estadisticas_municipio
titulo: Estadísticas catastrales por municipio del IGAC (predios, áreas y avalúos por año y zona)
entidad: Instituto Geográfico Agustín Codazzi (IGAC)
competencia: gestor catastral de los municipios sin gestor propio (Ley 1955 de 2019, art. 79)
acto: null
# El ítem de ArcGIS Online no declara licencia (consultado el 2026-10-22). Son estadísticas
# catastrales agregadas por municipio (sin datos personales), de una entidad pública, sin reserva ni
# prohibición de uso: dato público reutilizable (ADR-0019 enmienda: ámbar, sirve con aviso). Si el
# IGAC confirma por escrito que aplica la Res. 616/2020 (CC BY 4.0), pasa a verde (F0.8).
licencia:
  spdx: null
  url: null
  verificada: null
  evidencia: https://www.arcgis.com/sharing/rest/content/items/61b10dc94329461094419a32e129415e?f=json
  cita: "licenseInfo vacío"
uso_comercial: si
clase_acceso: api
atribucion: "Fuente: IGAC, Estadísticas catastrales municipales"
protocolo: arcgis_rest
conector: arcgis-mcp
# Formato largo: una fila por año de reporte, indicador, zona y estado catastral. Un mismo año puede
# traer un bloque «Actualizado» y otro «Desactualizado» (Chía 2025): no se suman sin mirar el estado.
url: https://services2.arcgis.com/RVvWzU3lgJISqdke/arcgis/rest/services/Municipios_Estadisticas/FeatureServer
modo: en_vivo
frescura: {ttl_cache_s: 604800, sla_actualizacion: P1Y}
cobertura: {pais: CO, columna_tiempo: VIGENCIA_DE_INFORMACIÓN__AÑO_DE_REPORTE_}
datos_personales: ninguno  # agregados municipales
estado: publicada
clasificacion_licencia: ambar
campos:
  MpCodigo: {nombre: municipio_divipola, tipo: str, desc: "código DIVIPOLA del municipio"}
  MUNICIPIO: {nombre: municipio, tipo: str, desc: "nombre del municipio"}
  GESTOR_CATASTRAL: {nombre: gestor_catastral, tipo: str, desc: "gestor catastral que reporta"}
  VIGENCIA_DE_INFORMACIÓN__AÑO_DE_REPORTE_: {nombre: anio_reporte, tipo: int, desc: "año del reporte"}
  Indicador: {nombre: indicador, tipo: str, desc: "PREDIOS, ÁREA DE TERRENO (m2 o ha), ÁREA GEOGRÁFICA (ha), ÁREA CONSTRUIDA (m2) o AVALÚO ($)"}
  Zona: {nombre: zona, tipo: str, desc: "Rural o Urbano"}
  Valor: {nombre: valor, tipo: float, desc: "valor del indicador, en la unidad que dice el indicador"}
  ESTADO_CATASTRAL_RURAL: {nombre: estado_catastral_rural, tipo: str, desc: "estado de la formación o actualización rural"}
  ESTADO_CATASTRAL_URBANO: {nombre: estado_catastral_urbano, tipo: str, desc: "estado de la formación o actualización urbana"}
  VIGENCIA_DE_ACTUALIZACIÓN_RURAL: {nombre: vigencia_actualizacion_rural, tipo: int, desc: "año de la última actualización rural"}
  VIGENCIA_DE_ACTUALIZACIÓN_URBANA: {nombre: vigencia_actualizacion_urbana, tipo: int, desc: "año de la última actualización urbana"}
comportamiento: {max_por_pagina: 2000, orden_coordenadas: lon_lat}
dcat: {publisher: IGAC, theme: catastro, accrualPeriodicity: annual}
# Spec 07: medido en la fuente, no en Terrnova.
perfil:
  medido: '2026-10-22'
  fila: 'un indicador catastral de un municipio por zona y año de reporte; Chía: 120'
  clave:
    columna: Indicador + Zona + VIGENCIA_DE_INFORMACIÓN
    unica: true
  operaciones:
    filtrar: 2.4
    contar: 0.3
    ordenar: 5.0
    agrupar: 0.3
  hallazgos:
  - el mismo año trae un bloque «actualizado» y otro «desactualizado» (medido en la ola 1)
  decision: en vivo por municipio, con la zona y el estado del catastro en cada fila
