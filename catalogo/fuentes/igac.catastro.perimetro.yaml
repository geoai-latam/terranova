id: igac.catastro.perimetro
titulo: Perímetros urbanos de la base catastral pública del gestor IGAC
entidad: Instituto Geográfico Agustín Codazzi (IGAC)
competencia: gestor catastral de los municipios sin gestor propio (Ley 1955 de 2019, art. 79)
acto: null
licencia:
  spdx: CC-BY-SA-4.0
  url: https://creativecommons.org/licenses/by-sa/4.0/
  verificada: 2026-10-21
  evidencia: https://www.arcgis.com/sharing/rest/content/items/6ca71458728f45988e2cd7aa5305a663?f=json
  cita: "Este producto adopta la licencia pública internacional de Reconocimiento-CompartirIgual 4.0 de Creative Commons"
uso_comercial: si
clase_acceso: api
atribucion: "Fuente: IGAC, Base catastral pública del gestor"
protocolo: arcgis_rest
conector: arcgis-mcp
# El nombre del servicio cambia cada mes (Base_Catastral_Publica_del_Gestor_IGAC_<MM>_<AAAA>); el
# corte vigente lo descubre `scripts/corte_igac.py` (G2). Capa: 2 U_PERIMETRO.
url: https://services2.arcgis.com/RVvWzU3lgJISqdke/arcgis/rest/services/Base_Catastral_Publica_del_Gestor_IGAC_06_2026/FeatureServer
modo: en_vivo
frescura: {ttl_cache_s: 86400, sla_actualizacion: P1M}
cobertura:
  pais: CO
  excluye:
    - "11001 Bogotá (UAECD)"
    - "05001 Medellín (gestor propio)"
    - "76001 Cali (gestor propio)"
  indice: cobertura_catastral
datos_personales: ninguno
estado: publicada
campos:
  NOMBRE_GEOGRAFICO: {nombre: nombre_centro_poblado, tipo: str, desc: "nombre del casco urbano o centro poblado"}
  # La mayoría trae el tipo en texto («Cabecera Municipal»); algunos, el código del dominio de la
  # capa («8326», 14 perímetros; «8307», 30): el significado los traduce. Medido el 2026-11-03.
  CODIGO_NOMBRE:
    nombre: tipo_centro_poblado
    tipo: str
    desc: "tipo según el IGAC (cabecera, corregimiento…), en texto o como código del dominio de la capa"
    codigos: {"8301": "Área Metropolitana", "8302": "Área Natural Única", "8303": "Barrio", "8304": "Cabecera Municipal", "8305": "Caserío", "8306": "Tierras Colectivas de Comunidades Negras", "8307": "Corregimiento", "8308": "Corregimiento Departamental", "8309": "Departamento", "8310": "Distrito", "8311": "Localidad", "8312": "Municipio", "8313": "Parque Arqueológico", "8314": "Parque Nacional Natural", "8315": "Provincia", "8316": "Ranchería Indígena", "8317": "República", "8318": "Reserva Indígena", "8319": "Reserva Natural", "8320": "Resguardo Indígena", "8321": "Santuario de Flora y Fauna", "8322": "Vereda", "8323": "Inspección de Policía", "8324": "Capital", "8325": "Región", "8326": "Zona Urbana", "8327": "Sector", "8328": "Comuna"}
    codigos_norma: "dominio de CODIGO_NOMBRE en la capa U_PERIMETRO (2) del servicio Base_Catastral_Publica_del_Gestor_IGAC_06_2026"
  # Sin dominio publicado: «01» en 721 perímetros, «02» en 325… hasta «43», más códigos de 7
  # dígitos, vacíos y un «URBANO» (medido el 2026-11-03). No es «01 urbano».
  TIPO_AVALUO: {nombre: tipo_avaluo, tipo: str, desc: "código de avalúo que trae la capa, sin significado publicado (01, 02… y códigos de 7 dígitos)"}
  DEPARTAMENTO_CODIGO: {nombre: departamento_divipola, tipo: str, desc: "código DIVIPOLA del departamento, 2 dígitos"}
  MUNICIPIO_CODIGO: {nombre: municipio_codigo, tipo: str, desc: "código del municipio dentro del departamento, 3 dígitos (el DIVIPOLA es departamento + municipio)"}
# `codigo_municipio` de la fuente no se usa: para Chía dice 23175 (el DIVIPOLA es 25175), medido el 2026-10-22
comportamiento: {max_por_pagina: 2000, orden_coordenadas: lon_lat}
dcat: {publisher: IGAC, theme: catastro, accrualPeriodicity: monthly}
# Spec 07: medido en la fuente, no en Terrnova.
perfil:
  medido: '2026-10-22'
  fila: un perímetro urbano (cabecera o centro poblado); 2 403 en el país
  operaciones:
    filtrar: 0.6
    contar: 0.3
    ordenar: 0.2
    agrupar: 0.4
  hallazgos:
  - 'no tiene una clave fiable: CODIGO_NOMBRE solo tiene 76 valores distintos'
  - MUNICIPIO_CODIGO está errado (23175 para Chía, que es 25175)
  - el punto de prueba toca un solo elemento
  decision: en vivo por punto; el municipio no se toma de MUNICIPIO_CODIGO
