id: igac.catastro.registro2
titulo: Registro 2 (unidades de construcción y zonas homogéneas del predio) de la base catastral pública del gestor IGAC
entidad: Instituto Geográfico Agustín Codazzi (IGAC)
competencia: gestor catastral de los municipios sin gestor propio (Ley 1955 de 2019, art. 79)
acto: null
licencia:
  spdx: CC-BY-SA-4.0
  url: https://creativecommons.org/licenses/by-sa/4.0/
  verificada: 2026-10-21
  evidencia: https://www.arcgis.com/sharing/rest/content/items/6ca71458728f45988e2cd7aa5305a663?f=json
  cita: "Este producto adopta la licencia pública internacional de Reconocimiento-CompartirIgual 4.0 de Creative Commons"
uso_comercial: si
clase_acceso: api
atribucion: "Fuente: IGAC, Base catastral pública del gestor"
protocolo: arcgis_rest
conector: arcgis-mcp
# El nombre del servicio cambia cada mes (Base_Catastral_Publica_del_Gestor_IGAC_<MM>_<AAAA>); el
# corte vigente lo descubre `scripts/corte_igac.py` (G2). Tabla: 18 REGISTRO_2 (una fila por grupo de unidades).
url: https://services2.arcgis.com/RVvWzU3lgJISqdke/arcgis/rest/services/Base_Catastral_Publica_del_Gestor_IGAC_06_2026/FeatureServer
modo: en_vivo
frescura: {ttl_cache_s: 86400, sla_actualizacion: P1M}
cobertura:
  pais: CO
  excluye:
    - "11001 Bogotá (UAECD)"
    - "05001 Medellín (gestor propio)"
    - "76001 Cali (gestor propio)"
  indice: cobertura_catastral
datos_personales: ninguno
estado: publicada
campos:
  # Una línea del registro 2 trae hasta dos zonas homogéneas (_1, _2) y hasta tres unidades de
  # construcción (_1, _2, _3). Las áreas de las zonas suman el área de terreno del registro 1, y las
  # de las unidades, su área construida (predio 25175…050067: 56 069 m² y 6 572 m², 2026-11-05).
  NUMERO_PREDIAL: {nombre: codigo_predial, tipo: str, desc: "número predial nacional, 30 dígitos"}
  NUMERO_PREDIAL_ANTERIOR: {nombre: codigo_predial_anterior, tipo: str, desc: "número predial anterior"}
  ZONA_FISICA_1: {nombre: zona_fisica, tipo: str, desc: "código de la zona homogénea física 1 de la línea"}
  ZONA_ECONOMICA_1: {nombre: zona_economica, tipo: str, desc: "código de la zona homogénea geoeconómica 1 de la línea"}
  AREA_TERRENO_1: {nombre: area_terreno_m2, tipo: float, desc: "área de terreno en la zona 1, m²"}
  ZONA_FISICA_2: {nombre: zona_fisica_2, tipo: str, desc: "código de la zona homogénea física 2 de la línea"}
  ZONA_ECONOMICA_2: {nombre: zona_economica_2, tipo: str, desc: "código de la zona homogénea geoeconómica 2 de la línea"}
  AREA_TERRENO_2: {nombre: area_terreno_m2_2, tipo: float, desc: "área de terreno en la zona 2, m²"}
  AREA_CONSTRUIDA_1: {nombre: area_construida_m2, tipo: float, desc: "área construida de la unidad 1 de la línea, m²"}
  USO_1: {nombre: uso_construccion, tipo: int, codigos_lista: igac_uso_construccion, desc: "código de uso de la construcción 1 (IGAC)"}
  TIPIFICACION_1: {nombre: tipificacion, tipo: str, desc: "tipificación de la unidad 1, como la escribe la fuente (sin tabla publicada)"}
  PISOS_1: {nombre: pisos, tipo: int, desc: "número de pisos de la unidad 1"}
  HABITACIONES_1: {nombre: habitaciones, tipo: int, desc: "habitaciones de la unidad 1"}
  BANOS_1: {nombre: banos, tipo: int, desc: "baños de la unidad 1"}
  LOCALES_1: {nombre: locales, tipo: int, desc: "locales de la unidad 1"}
  PUNTAJE_1: {nombre: puntaje_calificacion, tipo: int, desc: "puntaje de calificación de la unidad 1"}
  AREA_CONSTRUIDA_2: {nombre: area_construida_m2_2, tipo: float, desc: "área construida de la unidad 2 de la línea, m²"}
  USO_2: {nombre: uso_construccion_2, tipo: int, codigos_lista: igac_uso_construccion, desc: "código de uso de la construcción 2 (IGAC)"}
  TIPIFICACION_2: {nombre: tipificacion_2, tipo: str, desc: "tipificación de la unidad 2, como la escribe la fuente (sin tabla publicada)"}
  PISOS_2: {nombre: pisos_2, tipo: int, desc: "número de pisos de la unidad 2"}
  HABITACIONES_2: {nombre: habitaciones_2, tipo: int, desc: "habitaciones de la unidad 2"}
  BANOS_2: {nombre: banos_2, tipo: int, desc: "baños de la unidad 2"}
  LOCALES_2: {nombre: locales_2, tipo: int, desc: "locales de la unidad 2"}
  PUNTAJE_2: {nombre: puntaje_calificacion_2, tipo: int, desc: "puntaje de calificación de la unidad 2"}
  AREA_CONSTRUIDA_3: {nombre: area_construida_m2_3, tipo: float, desc: "área construida de la unidad 3 de la línea, m²"}
  USO_3: {nombre: uso_construccion_3, tipo: int, codigos_lista: igac_uso_construccion, desc: "código de uso de la construcción 3 (IGAC)"}
  TIPIFICACION_3: {nombre: tipificacion_3, tipo: str, desc: "tipificación de la unidad 3, como la escribe la fuente (sin tabla publicada)"}
  PISOS_3: {nombre: pisos_3, tipo: int, desc: "número de pisos de la unidad 3"}
  HABITACIONES_3: {nombre: habitaciones_3, tipo: int, desc: "habitaciones de la unidad 3"}
  BANOS_3: {nombre: banos_3, tipo: int, desc: "baños de la unidad 3"}
  LOCALES_3: {nombre: locales_3, tipo: int, desc: "locales de la unidad 3"}
  PUNTAJE_3: {nombre: puntaje_calificacion_3, tipo: int, desc: "puntaje de calificación de la unidad 3"}
comportamiento: {max_por_pagina: 2000, orden_coordenadas: lon_lat}
dcat: {publisher: IGAC, theme: catastro, accrualPeriodicity: monthly}
# Spec 07: medido en la fuente, no en Terrnova.
perfil:
  medido: '2026-10-22'
  fila: 'una línea del registro 2 de un predio; Chía: 75 093 líneas para 66 936 predios'
  clave:
    columna: NUMERO_PREDIAL
    unica: false
  operaciones:
    filtrar: 6.5
    contar: 5.5
    ordenar: 0.8
    agrupar: 0.8
  hallazgos:
  - un predio puede tener varias líneas, cada una con su zona, uso y construcción
  decision: en vivo por número predial, todas las líneas
