dcat: {publisher: IGAC, theme: catastro, accrualPeriodicity: annual}
# Spec 07: medido en la fuente, no en Terrnova.
perfil:
  medido: '2026-10-22'
  fila: 'una zona homogénea física; Chía: 410 rurales y 428 urbanas'
  clave:
    columna: CODIGO + CODIGO_ZONA_FISICA
    unica: false
  operaciones:
    filtrar: 1.7
    contar: 0.2
    ordenar: 0.4
    agrupar: 0.2
  hallazgos:
  - CODIGO es el municipio (a veces con dos dígitos más, a veces vacío o solo la zona), no la zona
  - VIGENCIA vacía en 11 % de las rurales; va de 1990 a 2026, con años imposibles (205, 1899)
  - '1899-12-30 es la «fecha cero» de Excel y Access: una vigencia vacía disfrazada de fecha'
  - 173 municipios rurales tienen zonas de varias vigencias, que no se solapan (5 de 5 medidos)
  - el punto de prueba toca un solo elemento
  - 'códigos fuera del dominio publicado (medido el 2026-11-02): uso rural 0 y 17-20 en cerca de 1 de cada 8 zonas; uso urbano 0 y 6-21 en 1 de cada 10; agua 0 y 56 en 1 de cada 25'
  - 'la topografía urbana no sigue su dominio: PLANO, Inclinado, 1, PLANA, Plano 0-7%, Bajamar'
  decision: en vivo por punto; la descripción advierte la vigencia
