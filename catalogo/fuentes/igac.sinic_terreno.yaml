# Copia espacial (ADR-0024): el servicio del SINIC no responde a la IP del datacenter y desde Colombia
# sí. Copia los 333 municipios que la base pública del IGAC (igac.catastro.terreno) no cubre y el
# SINIC sí (catalogo/cobertura/cobertura_catastral.yaml cruzado con el conteo del SINIC por
# municipio): los gestores descentralizados (Bogotá, Medellín, Cali, Barranquilla, Bucaramanga,
# Catastro Antioquia, Cundinamarca, Valle del Cauca…) y 52 municipios del IGAC sin datos en su base.
# 6,13 M de terrenos simplificados a ~1 m. Etapa 1 (21 municipios) el 2026-10-28; etapa 2, el resto.
