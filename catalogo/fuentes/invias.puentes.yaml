uso_comercial: si
clase_acceso: api
atribucion: "Fuente: Instituto Nacional de Vías (INVÍAS). Fuente: Portal de Datos Abiertos www.datos.gov.co"
protocolo: socrata
conector: datos-abiertos-mcp
url: https://www.datos.gov.co/resource/nsdj-ep2p.json
modo: en_vivo
frescura: {ttl_cache_s: 86400, sla_actualizacion: P1Y}
