entidad: Instituto Nacional de Vías (INVÍAS)
competencia: administra la red vial nacional no concesionada y lleva el inventario de sus puentes (Decreto 2618 de 2013)
acto: null
licencia:
  spdx: CC-BY-SA-4.0
  url: https://creativecommons.org/licenses/by-sa/4.0/
