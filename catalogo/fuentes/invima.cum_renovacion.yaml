id: invima.cum_renovacion
titulo: "Código Único de Medicamentos (CUM) en trámite de renovación"
entidad: Instituto Nacional de Vigilancia de Medicamentos y Alimentos (INVIMA)
competencia: autoridad sanitaria de medicamentos (Ley 100 de 1993, art. 245; Decreto 2078 de 2012)
acto: null
licencia:
  spdx: CC-BY-SA-4.0
  url: https://creativecommons.org/licenses/by-sa/4.0/
  verificada: 2026-10-22
  evidencia: https://www.datos.gov.co/api/views/vgr4-gemg.json
  cita: "Creative Commons Attribution | Share Alike 4.0 International"
uso_comercial: si
clase_acceso: api
atribucion: "Fuente: INVIMA, Código Único de Medicamentos (CUM) en trámite de renovación. Fuente: Portal de Datos Abiertos www.datos.gov.co"
protocolo: socrata
conector: datos-abiertos-mcp
# El CUM vigente está en invima.cum_vigentes; este conjunto tiene los en trámite de renovación.
url: https://www.datos.gov.co/resource/vgr4-gemg.json
modo: en_vivo
frescura: {ttl_cache_s: 86400, sla_actualizacion: P1D}
cobertura: {pais: CO}
datos_personales: ninguno
estado: publicada
campos:
  expediente: {nombre: expediente, tipo: int, desc: "número de expediente del registro sanitario"}
  producto: {nombre: producto, tipo: str, desc: "nombre del producto"}
  titular: {nombre: titular, tipo: str, desc: "titular del registro sanitario"}
  registrosanitario: {nombre: registro_sanitario, tipo: str, desc: "número del registro sanitario"}
  estadoregistro: {nombre: estado_registro, tipo: str, desc: "estado del registro"}
  fechavencimiento: {nombre: fecha_vencimiento, tipo: date, orden_fecha: mda, anios_validos: [1950, 2049], desc: "vencimiento del registro; vacío si la fuente no da fecha o pone un año de relleno (1000, 1900, 2099, 3000, 9999)"}
  consecutivocum: {nombre: consecutivo_cum, tipo: int, desc: "consecutivo del CUM dentro del expediente"}
  descripcioncomercial: {nombre: presentacion, tipo: str, desc: "presentación comercial"}
  estadocum: {nombre: estado_cum, tipo: str, desc: "estado del CUM (Activo, Inactivo)"}
  fechainactivo: {nombre: fecha_inactivo, tipo: date, orden_fecha: mda, anios_validos: [1950, 2049], desc: "desde cuándo está inactivo el CUM; vacío si la fuente no da fecha o pone un año de relleno (1000, 1900, 2099, 3000, 9999)"}
  principioactivo: {nombre: principio_activo, tipo: str, desc: "principio activo (una fila por cada uno)"}
  concentracion: {nombre: concentracion, tipo: str, desc: "código de letra de la fuente (A-F y S, sin tabla publicada); no es la dosis, que sale en dosis"}
  unidadmedida: {nombre: unidad_medida, tipo: str, desc: "unidad de cantidad (g, mg, UI…)"}
  cantidad: {nombre: cantidad, tipo: float, desc: "cantidad del principio activo en la unidad de referencia: 2.5 en «2.5 g por AMPOLLA DE 5 ML» (la descripción de la fuente dice otra cosa; medido 2026-11-02)"}
  unidadreferencia: {nombre: unidad_referencia, tipo: str, desc: "a qué se refiere la cantidad (AMPOLLA DE 5 ML, TABLETA…)"}
  formafarmaceutica: {nombre: forma_farmaceutica, tipo: str, desc: "forma farmacéutica"}
  viaadministracion: {nombre: via_administracion, tipo: str, desc: "vía de administración"}
  atc: {nombre: atc, tipo: str, desc: "código ATC"}
comportamiento: {max_por_pagina: 50000}
dcat: {publisher: "Instituto Nacional de Vigilancia de Medicamentos y Alimentos", accrualPeriodicity: daily}
# Spec 07: medido en la fuente, no en Terrnova.
perfil:
  medido: 2026-10-22
  fila: "una presentación por cada principio activo y cada rol (fabricante, importador); 1 352 filas"
  clave: {columna: expediente + consecutivocum + principioactivo, unica: false}
  operaciones: {filtrar: 0.4, contar: 0.4}
  hallazgos:
  - "la fuente repite cada presentación por rol (nombrerol): se deduplica sin el rol"
  - "un medicamento combinado tiene una fila por principio activo: es información, no repetición"
  decision: "en vivo por expediente, con distinct"
