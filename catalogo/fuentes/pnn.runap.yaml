id: pnn.runap
titulo: Registro Único Nacional de Áreas Protegidas (RUNAP)
entidad: Parques Nacionales Naturales de Colombia (PNN)
competencia: administra el RUNAP (Decreto 1076 de 2015, que compila el Decreto 2372 de 2010)
acto: null
licencia:
  spdx: CC-BY-SA-4.0
  url: https://creativecommons.org/licenses/by-sa/4.0/
  verificada: 2026-10-21
  evidencia: https://www.arcgis.com/sharing/rest/content/items/4a673b3d51c146abab5fd462992dd2c0?f=json
  cita: "RUNAP © 2025 por Parques Nacionales Naturales licenciado bajo CC BY-SA 4.0"
uso_comercial: si
clase_acceso: api
atribucion: "Fuente: Parques Nacionales Naturales de Colombia, RUNAP"
protocolo: arcgis_rest
conector: copia
# MapServer del propio PNN (la url que da el ítem del dueño). Capa 0: polígonos del RUNAP, de todas
# las categorías (parques, reservas forestales protectoras, DMI, RNSC…).
url: https://mapas.parquesnacionales.gov.co/arcgis/rest/services/pnn/runap/MapServer
modo: copia
# ADR-0024: copia en PostGIS, ingerida desde Colombia. El servicio del PNN responde a la IP del
# datacenter con un reto antibots (403, medido el 2026-10-27): no se evade (ADR-0018). Polígonos
# completos (son límites legales); el servicio no acepta simplificarlos (~35 MB cada 200).
copia:
  origen: arcgis
  capa: 0
  tabla: runap
  clave: objectid
  por_pagina: 25
frescura: {ttl_cache_s: 86400, sla_actualizacion: P1M}
cobertura:
  columna_tiempo: fecha_inscrita
  pais: CO
  excluye: []
datos_personales: ninguno
estado: publicada
campos:
  objectid: {nombre: id_poligono, tipo: int, desc: "identificador del polígono en el servicio (cambia si la fuente republica la capa)"}
  ap_nombre: {nombre: nombre, tipo: str, desc: "nombre del área protegida"}
  ap_categoria: {nombre: categoria, tipo: str, desc: "categoría de manejo (p. ej. Parque Nacional Natural)"}
  organizacion: {nombre: autoridad_ambiental, tipo: str, desc: "autoridad ambiental que la administra"}
  area_ha_total_resolucion: {nombre: area_ha_resolucion, tipo: float, desc: "área total en hectáreas según el acto de declaratoria"}
  fecha_inscrita: {nombre: fecha_inscripcion, tipo: date, desc: "fecha de inscripción en el RUNAP"}
comportamiento: {max_por_pagina: 1000, orden_coordenadas: lon_lat}
capas_servicio: [0]  # la ficha técnica cosecha la capa aunque se sirva por copia
dcat: {publisher: PNN, theme: areas_protegidas}
# Spec 07: medido en la fuente, no en Terrnova.
perfil:
  medido: '2026-10-22'
  fila: un área protegida inscrita en el RUNAP; 1 936 en el país
  clave:
    columna: ap_nombre
    unica: true
  operaciones:
    filtrar: 0.6
    contar: 0.3
    ordenar: 0.3
    agrupar: 0.4
  hallazgos:
  - 'un punto puede caer en varias áreas inscritas: la herramienta trae hasta 20'
  - el punto de prueba toca un solo elemento
  decision: copia (el servicio bloquea la IP del datacenter); por punto y por zona
