  AREA_ZONIF: {nombre: area_zonificacion, tipo: str, desc: "ÁREA ZONIFICABLE o ÁREA NO ZONIFICABLE (allí el POT no zonifica la amenaza)"}
  CLASE_SUEL: {nombre: clase_suelo, tipo: str, desc: "clase de suelo: Urbano, Expansión o Rural"}
