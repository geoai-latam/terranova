dcat: {publisher: SDP Bogotá, theme: riesgo}
# Spec 07: medido en la fuente, no en Terrnova.
perfil:
  medido: 2026-10-28
  fila: "un polígono de amenaza por movimiento en masa; 5 658 (3 459 urbanos y de expansión, 2 199 rurales)"
  clave: {columna: _fila, unica: true}
  operaciones: {filtrar: 1.0, contar: 1.0}
  hallazgos:
  - "el CKAN no dice qué significa CATEGORIZA: cruzado con la capa rotulada del IDIGER (2016) en IDECA, 1 es baja (6 de 6 puntos), 2 media (6 de 6) y 3 alta (3 de 6; los otros 3 eran media en 2016)"
  - "47 polígonos son ÁREA NO ZONIFICABLE con CATEGORIZA 1: ahí la capa de 2016 no tiene amenaza; no se rotulan como baja"
  - "suelo rural: cruzado con la capa rural rotulada de IDECA, 1 es baja, 2 media y 3 alta (6 de 6 puntos en cada una); 9 polígonos rurales son ÁREA NO ZONIFICABLE"
  - "el archivo viene en la cartesiana de Bogotá (PCS_CarMAGBOG); se pasa a lon/lat sobre su mismo elipsoide"
  - "el servicio ArcGIS de la SDP para amenazas responde «not started»"
  decision: "por copia espacial de los dos GeoJSON, ingerida desde Colombia, por punto"
