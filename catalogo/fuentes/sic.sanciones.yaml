atribucion: "Fuente: SIC, Sanciones impuestas en firme. Fuente: Portal de Datos Abiertos www.datos.gov.co"
protocolo: socrata
conector: datos-abiertos-mcp
# Solo agregados por sector: `multado` puede ser una persona natural (ADR-0014).
url: https://www.datos.gov.co/resource/73dx-n59j.json
modo: en_vivo
frescura: {ttl_cache_s: 86400, sla_actualizacion: P1M}
cobertura: {pais: CO, columna_tiempo: fecha_emitida}
datos_personales: filtrados
estado: publicada
campos:
  fecha_emitida: {nombre: fecha, tipo: date, desc: "fecha de la resolución"}
  valor: {nombre: valor, tipo: float, desc: "valor de la sanción, en pesos"}
  sector: {nombre: sector, tipo: str, desc: "sector económico"}
comportamiento: {max_por_pagina: 50000}
dcat: {publisher: Superintendencia de Industria y Comercio, theme: comercio, accrualPeriodicity: monthly}
# Spec 07: medido en la fuente, no en Terranova.
perfil:
  medido: '2026-10-22'
  fila: 'un sancionado en una resolución; 2024: 327 filas para 312 resoluciones'
  clave:
    columna: radicado + multado
    unica: true
  operaciones:
    filtrar: 0.5
    contar: 0.2
    ordenar: 0.2
    agrupar: 0.1
  hallazgos:
  - una resolución puede sancionar a varios, cada uno con su valor
  - contar filas cuenta sancionados, no resoluciones
  - 'una resolución puede tener sancionados de dos sectores: por sector suman 313, en el año son 312'
  decision: agregado con resoluciones (distintas) y sanciones (sancionados) por separado
