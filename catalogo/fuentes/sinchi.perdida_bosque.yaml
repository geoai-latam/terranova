entidad: Instituto Amazónico de Investigaciones Científicas (SINCHI)
competencia: monitorea las coberturas y el bosque de la Amazonia colombiana (Ley 99 de 1993, art. 20; SIAT-AC)
acto: null
licencia:
  spdx: CC-BY-4.0
  url: https://creativecommons.org/licenses/by/4.0/
  verificada: 2026-10-28
  evidencia: https://datos.siatac.co/api/search/v1/collections/all/items/633aa22498b542ccbd666cfd9faa271c
