id: superfinanciera.vigiladas
titulo: "Entidades vigiladas por la Superintendencia Financiera"
entidad: Superintendencia Financiera de Colombia (SFC)
competencia: inspección, vigilancia y control del sistema financiero, asegurador y del mercado de valores (Decreto 2555 de 2010)
acto: null
licencia:
  spdx: CC-BY-SA-4.0
  url: https://creativecommons.org/licenses/by-sa/4.0/
  verificada: 2026-10-23
  evidencia: https://www.datos.gov.co/api/views/sr9n-792w.json
  cita: "Creative Commons Attribution | Share Alike 4.0 International"
uso_comercial: si
clase_acceso: api
atribucion: "Fuente: Superintendencia Financiera de Colombia, entidades vigiladas. Fuente: Portal de Datos Abiertos www.datos.gov.co"
protocolo: socrata
conector: datos-abiertos-mcp
# Fuera de la lista blanca: representante legal, cargo y correo (personas y contactos, ADR-0014); la
# pregunta es si la entidad está vigilada.
url: https://www.datos.gov.co/resource/sr9n-792w.json
modo: en_vivo
frescura: {ttl_cache_s: 86400, sla_actualizacion: P1D}
cobertura: {pais: CO}
datos_personales: filtrados
estado: publicada
campos:
  tipo_entidad:
    nombre: tipo_entidad
    tipo: int
    desc: "código de tipo de entidad de la SFC (el de Bancolombia es 1); su nombre sale al lado"
    # Los nombres los publica la SFC en otro conjunto, el CUIF (mxk5-ce6w, corte del 2026-08-31),
    # abreviados y a veces cortados («COMPANIAS DE FINANCIAMIENTO COMERCI»): aquí van completos.
    # Los tipos sin entidades en el CUIF (11, 20, 27, 93, 108, 111, 129, 142, 262, 507, 508, 510,
    # 600) no tienen nombre publicado y salen sin él: no se adivinan.
    codigos:
      "1": Establecimientos bancarios
      "2": Corporaciones financieras
      "4": Compañías de financiamiento
      "5": Sociedades fiduciarias
      "6": Almacenes generales de depósito
      "10": Sociedades de capitalización
      "13": Compañías de seguros generales
      "14": Compañías de seguros de vida
      "15": Sociedades cooperativas de seguros
      "22": Instituciones oficiales especiales
      "23": Administradoras de fondos de pensiones y cesantías
      "25": Administradoras del régimen solidario de prima media
      "32": Cooperativas de carácter financiero
      "81": Organismos de autorregulación
      "82": Bolsas de valores
      "83": Sociedades administradoras de depósitos centralizados de valores
      "84": Sociedades calificadoras de valores
      "85": Comisionistas de bolsa de valores
      "118": Sistemas de pago de bajo valor
      "128": Sociedades especializadas en depósitos y pagos electrónicos
      "400": Bolsas agropecuarias
      "401": Sociedades comisionistas de bolsas agropecuarias
      "501": Administradoras de sistemas de negociación y registro de divisas
      "502": Administradoras de sistemas de negociación y registro de valores
      "504": Cámaras de riesgo central de contraparte
      "509": Proveedores de precios para valoración
    codigos_norma: "SFC, conjunto CUIF de datos.gov.co (mxk5-ce6w), columna nombre_tipo_entidad, corte del 2026-08-31"
  cod_entidad: {nombre: codigo_entidad, tipo: int, desc: "código de la entidad dentro de su tipo"}
  razon_social: {nombre: razon_social, tipo: str, desc: "razón social (con las denominaciones que puede usar)"}
  ciudad: {nombre: ciudad, tipo: str, desc: "ciudad"}
  direccion: {nombre: direccion, tipo: str, vacios: ["Pendiente"], desc: "dirección de la entidad (vacía si la fuente dice «Pendiente»)"}
  numeroidentificacion: {nombre: nit_con_dv, tipo: str, vacios: ["0"], desc: "NIT con el dígito de verificación pegado al final (8909039388 = 890903938-8); vacío en las entidades del exterior, que la fuente trae con «0»"}
  uripaginaweb: {nombre: pagina_web, tipo: str, vacios: ["Pendiente"], desc: "página web (vacía si la fuente dice «Pendiente»)"}
comportamiento: {max_por_pagina: 50000}
dcat: {publisher: Superintendencia Financiera de Colombia, theme: economia, accrualPeriodicity: daily}
# Spec 07: medido en la fuente, no en Terrnova.
perfil:
  medido: 2026-10-23
  fila: "una entidad vigilada; 456 en total; Bancolombia es una"
  clave: {columna: tipo_entidad + cod_entidad, unica: true}
  operaciones: {filtrar: 0.3}
  hallazgos:
  - "el NIT trae el dígito de verificación pegado: se busca por el rango NIT×10 a NIT×10+9"
  - "hay NIT en 0 y direcciones «Pendiente»: entidades que no reportaron"
  - "el tipo de entidad es un código sin tabla publicada"
  - "las tildes vienen dañadas en algunos nombres y ciudades"
  decision: "en vivo por NIT de empresa y por nombre"
