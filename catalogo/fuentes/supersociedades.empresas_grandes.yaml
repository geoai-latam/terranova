datos_personales: ninguno
estado: publicada
campos:
  nit: {nombre: nit, tipo: str, desc: "NIT (la fuente lo publica con .00 al final)"}
  raz_n_social: {nombre: razon_social, tipo: str, desc: "razón social"}
  supervisor: {nombre: supervisor, tipo: str, desc: "superintendencia que la vigila"}
  departamento_domicilio: {nombre: departamento, tipo: str, desc: "departamento del domicilio"}
  ciudad_domicilio: {nombre: ciudad, tipo: str, desc: "ciudad del domicilio"}
  ciiu: {nombre: ciiu, tipo: str, desc: "CIIU"}
  macrosector: {nombre: macrosector, tipo: str, desc: "macrosector"}
  ingresos_operacionales: {nombre: ingresos_operacionales, tipo: str, desc: "ingresos operacionales, en billones de pesos, como texto de la fuente ($84.95)"}
  ganancia_p_rdida: {nombre: ganancia_perdida, tipo: str, desc: "ganancia o pérdida, en billones de pesos"}
  total_activos: {nombre: total_activos, tipo: str, desc: "total de activos, en billones de pesos"}
  total_pasivos: {nombre: total_pasivos, tipo: str, desc: "total de pasivos, en billones de pesos"}
  total_patrimonio: {nombre: total_patrimonio, tipo: str, desc: "patrimonio, en billones de pesos"}
  a_o_de_corte: {nombre: anio_corte, tipo: int, desc: "año de corte"}
comportamiento: {max_por_pagina: 50000}
dcat: {publisher: Superintendencia de Sociedades, theme: comercio, accrualPeriodicity: monthly}
# Spec 07: medido en la fuente, no en Terrnova.
perfil:
  medido: '2026-10-22'
  fila: una empresa en un año de corte; 5 años para el NIT 899999068
  clave:
    columna: a_o_de_corte
    unica: true
  operaciones:
    filtrar: 0.6
    contar: 0.3
    ordenar: 0.2
    agrupar: 0.2
  hallazgos:
  - las cifras vienen en billones y como texto («$84.95»)
  - el NIT trae «.00» al final
  decision: en vivo, con la unidad dicha en la ficha
