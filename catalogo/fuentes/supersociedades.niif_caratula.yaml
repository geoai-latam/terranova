id: supersociedades.niif_caratula
titulo: "Estados financieros NIIF: Carátula de los estados financieros"
entidad: Superintendencia de Sociedades
competencia: recibe los estados financieros de las sociedades que vigila (Decreto 1736 de 2020)
acto: null
licencia:
  spdx: CC-BY-SA-4.0
  url: https://creativecommons.org/licenses/by-sa/4.0/
  verificada: 2026-10-22
  evidencia: https://www.datos.gov.co/api/views/6hqw-m3dm.json
  cita: "Creative Commons Attribution | Share Alike 4.0 International"
uso_comercial: si
clase_acceso: api
atribucion: "Fuente: Supersociedades, Estados financieros NIIF: Carátula de los estados financieros. Fuente: Portal de Datos Abiertos www.datos.gov.co"
protocolo: socrata
conector: datos-abiertos-mcp
url: https://www.datos.gov.co/resource/6hqw-m3dm.json
modo: en_vivo
frescura: {ttl_cache_s: 3600, sla_actualizacion: P1D}
cobertura: {pais: CO, columna_tiempo: fecha_corte}
datos_personales: ninguno
estado: publicada
campos:
  nit: {nombre: nit, tipo: str, desc: "NIT de la sociedad"}
  fecha_corte: {nombre: fecha_corte, tipo: date, desc: "fecha de corte del reporte"}
  periodo: {nombre: periodo, tipo: str, desc: "periodo al que corresponde el valor (texto de la fuente)"}
  concepto: {nombre: concepto, tipo: str, desc: "concepto contable (taxonomía XBRL)"}
  valor: {nombre: valor, tipo: float, desc: "valor tal como lo reporta la sociedad; la unidad la fija la taxonomía del reporte"}
  punto_entrada: {nombre: punto_entrada, tipo: str, desc: "tipo de reporte (NIIF plenas, pymes, individuales…)"}
  taxonomia: {nombre: taxonomia, tipo: str, desc: "taxonomía del reporte"}
  numero_radicado: {nombre: radicado, tipo: str, desc: "número de radicado"}
comportamiento: {max_por_pagina: 50000}
dcat: {publisher: Supersociedades, theme: comercio, accrualPeriodicity: daily}
# Spec 07: medido en la fuente, no en Terranova.
perfil:
  medido: '2026-10-22'
  fila: un concepto de un estado financiero en un periodo de un reporte; 77 filas en 3 reportes del NIT
    830010665
  clave:
    columna: numero_radicado + punto_entrada + periodo + concepto
    unica: true
  operaciones:
    filtrar: 0.5
    contar: 0.5
    ordenar: 0.2
    agrupar: 0.2
  hallazgos:
  - 'cada reporte trae también el año anterior: un año sale en dos reportes'
  - '`periodo` cambia de formato: «Periodo Actual»/«Periodo Anterior» desde 2018; antes, fechas o años'
  - la unidad la fija la taxonomía de cada reporte
  - en el reporte de 2016 (2017-01-072472), `periodo` trae el NIT
  decision: en vivo por NIT, con el periodo como lo escribe la fuente
