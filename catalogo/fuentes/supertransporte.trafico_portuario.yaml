# ~9 700 filas desde 2018: una por zona portuaria, sociedad portuaria, tipo de servicio, tipo de carga
# y mes. La Supertransporte avisa que las cifras se corrigen cuando una sociedad retransmite y que
# son referenciales (solo ella las certifica).
