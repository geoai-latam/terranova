# Spec 07: medido en la fuente, no en Terrnova.
perfil:
  medido: 2026-10-23
  fila: "un cultivo (y su desagregación) en un municipio y un periodo; 166 732 filas de 2019 a 2025"
  operaciones: {filtrar: 0.2, agrupar: 0.2}
  hallazgos:
  - "los transitorios traen dos periodos al año (A y B): el año suma los dos semestres"
  - "un cultivo puede venir en varias desagregaciones (estado físico): se suman en el cultivo"
  - "el rendimiento no se suma: se calcula como producción sobre área cosechada"
  - "el código DIVIPOLA viene completo con sus 5 dígitos (texto)"
  decision: "en vivo por municipio y año, sumando por cultivo"
