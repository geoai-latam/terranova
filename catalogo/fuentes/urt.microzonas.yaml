  depto: {nombre: departamento, tipo: str, desc: "departamento"}
  mpio: {nombre: municipio, tipo: str, desc: "municipio"}
  n_res_m: {nombre: resolucion, tipo: str, desc: "resolución de microfocalización vigente"}
