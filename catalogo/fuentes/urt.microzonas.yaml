dcat: {publisher: URT, theme: tierras}
# Spec 07: medido en la fuente, no en Terranova.
perfil:
  medido: 2026-10-28
  fila: "una zona microfocalizada para la restitución de tierras; 1 314 en el país, 8 en El Carmen de Bolívar"
  clave: {columna: id_microzona, unica: true}
  operaciones: {filtrar: 0.5, contar: 0.2, ordenar: 0.3, agrupar: 0.2}
  hallazgos:
  - "el punto de prueba (El Carmen de Bolívar) toca una sola microzona"
  - "estar en una microzona no dice que un predio tenga solicitud: dice que la URT puede tramitarlas ahí"
  decision: "en vivo por punto; solo la zona, sin solicitudes ni sentencias por predio (ADR-0014)"
