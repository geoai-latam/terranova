# Ítem `Open_Data_Microzonas` del dueño `Open_Data_uaegrtd` (ArcGIS Online de la URT). Capa 3: los
# polígonos de las microzonas con su resolución y estado. Solo la zona, nunca las solicitudes ni las
# sentencias por predio (llevan a víctimas con nombre: ADR-0014).
url: https://services5.arcgis.com/omnq4yUY2D8TpiDa/arcgis/rest/services/Open_Data_Microzonas/FeatureServer
