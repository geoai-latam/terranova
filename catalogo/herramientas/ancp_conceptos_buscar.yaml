id: ancp_conceptos_buscar
version: 1
familia: contratacion
fuente: ancp.conceptos
pregunta: "¿Qué conceptos de Colombia Compra Eficiente hablan de esto?"
descripcion: >
  Busca en la relatoría de Colombia Compra Eficiente (conceptos) por palabras: los 20 más recientes con
  título, fecha y enlace al texto, y cuántos hay en total.
  (Fuente: Colombia Compra Eficiente; licencia: dato público reutilizable.)
entrada: {texto: nombre}
consulta:
  operacion: buscar
  tool: web_json
  argumentos:
    url: "{url_fuente}"
    params: {search: "{texto}", per_page: 20, orderby: date, order: desc, _fields: "id,date,title,link"}
  campos: [id, date, title.rendered, link]
salida: ConceptosBuscar
derivados:
  coincidencias: {de: completitud_total, tipo: int}
creditos: 2
canario:
  # Medido el 2026-10-22 en la API de la relatoría (search=garantias): 1207 conceptos (X-WP-Total).
  # Crece con cada publicación: es un mínimo.
  entrada: {texto: garantias}
  minimos: {coincidencias: 1207}
  campos: [coincidencias, fecha, id, titulo, url]
  latencia_max_ms: 10000
