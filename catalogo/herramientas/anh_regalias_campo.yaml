id: anh_regalias_campo
version: 1
familia: estadisticas
fuente: anh.regalias_liquidadas
pregunta: "¿Cuántas regalías generó este campo petrolero o de gas en un año, mes a mes?"
descripcion: >
  Regalías que la ANH liquidó por la producción de un campo de hidrocarburos (p. ej. Rubiales,
  Chuchupa) en un año, mes a mes, en pesos y en volumen de regalía (barriles o kpc), separadas por
  municipio productor y por hidrocarburo (petróleo o gas), con el total del año. Es lo que se causa
  por producir, no lo que recibe o gasta un municipio del Sistema General de Regalías: eso es
  minhacienda_regalias_municipio. El campo se compara sin tildes, mayúsculas ni espacios, pero
  completo. Datos de 2010 a marzo de 2026; las líneas que la fuente repite (todo febrero de 2026) se
  cuentan una vez.
  (Fuente: ANH; licencia: CC BY-SA 4.0.)
entrada: {campo: campo_hidrocarburos, anio: int}
consulta:
  operacion: por_codigo
  resultado: lista
  tool: datos_consultar
  argumentos:
    id: j7js-yk74
    portal: datos.gov.co
    # Spec 07: la fuente repite líneas de liquidación (febrero de 2026 entero, con y sin
    # coordenadas): primero un grupo por línea, luego la suma.
    previo_select: "departamento, municipio, a_o, mes, contrato, campo, tipoprod, tipohidrocarburo, porcregalia, regimenreg, prodgravableblskpc, volumenregaliablskpc, regaliascop"
    previo_group: "departamento, municipio, a_o, mes, contrato, campo, tipoprod, tipohidrocarburo, porcregalia, regimenreg, prodgravableblskpc, volumenregaliablskpc, regaliascop"
    select: "campo, departamento, municipio, tipohidrocarburo, a_o, mes, sum(replace(regaliascop, ',', '')::number) AS pesos, sum(replace(volumenregaliablskpc, ',', '')::number) AS volumen"
    where: "replace(replace(replace(replace(replace(replace(upper(campo), 'Á', 'A'), 'É', 'E'), 'Í', 'I'), 'Ó', 'O'), 'Ú', 'U'), ' ', '') = replace(replace(replace(replace(replace(replace(upper('{campo}'), 'Á', 'A'), 'É', 'E'), 'Í', 'I'), 'Ó', 'O'), 'Ú', 'U'), ' ', '') AND a_o = {anio}"
    group: "campo, departamento, municipio, tipohidrocarburo, a_o, mes"
    order: "campo, departamento, municipio, tipohidrocarburo, mes"
    max_filas: 500
  campos: [departamento, municipio, a_o, mes, contrato, campo, tipoprod, tipohidrocarburo, porcregalia, regimenreg, prodgravableblskpc, volumenregaliablskpc, regaliascop]
derivados:
  hidrocarburo: {de: codigo, campo: tipo_hidrocarburo_codigo, valores: {O: petróleo, G: gas}}
  regalias_pesos: {de: columna, campo: pesos, tipo: float}
  volumen_regalia: {de: columna, campo: volumen, tipo: float}
  regalias_total_pesos: {de: suma, campo: regalias_pesos, tipo: float}
  numero_registros: {de: conteo, tipo: int}
salida: RegaliasCampo
cobro: agregado
canario:
  # Medido el 2026-10-28 en j7js-yk74: Rubiales 2024, Puerto Gaitán (Meta), petróleo, 12 meses;
  # enero $84 065 575 789; el año, $1 071 373 844 725.
  entrada: {campo: "Rubiales", anio: 2024}
  verdad: {campo: RUBIALES, municipio: PUERTO GAITAN, hidrocarburo: petróleo, mes: 1, regalias_pesos: 84065575789.0, regalias_total_pesos: 1071373844725.0}
  minimos: {numero_registros: 12}
  campos: [anio, campo, departamento, hidrocarburo, mes, municipio, numero_registros, regalias_pesos, regalias_total_pesos, tipo_hidrocarburo_codigo, volumen_regalia]
  latencia_max_ms: 20000
