id: ani_concesiones_viales_en_zona
version: 1
familia: territorio
fuente: ani.concesiones_viales
pregunta: "¿Qué concesiones viales de la ANI pasan por esta zona?"
descripcion: >
  Concesiones viales nacionales de la ANI cuyo corredor cruza un rectángulo: proyecto, generación
  (1G a 5G), etapa, empresa concesionaria, longitud concesionada, avance de obra y valor del
  contrato. Solo las vías concesionadas por la ANI; la red vial a cargo del INVÍAS no está aquí.
  Para los peajes, ani_peajes_en_zona.
  (Fuente: ANI; licencia: CC BY-SA 4.0.)
entrada: {bbox: bbox}
consulta:
  operacion: en_zona
  tool: arcgis_query_features
  capas: [3]
  argumentos:
    url: "{url_capa}"
    bbox: "{bbox}"
    geometria: ninguna
    out_fields: [nombrepr, generacion, etp, concesionario, lngcnc, prcavn, vlrcnt]
    max_features: 100
  campos: [nombrepr, generacion, etp, concesionario, lngcnc, prcavn, vlrcnt]
derivados:
  numero_registros: {de: conteo, tipo: int}
salida: ConcesionesVialesEnZona
cobro: zona
canario:
  # Norte de Bogotá; medido el 2026-10-28 en la capa 3: 4 concesiones (Accesos Norte a Bogotá,
  # Accesos Norte Fase II, Perimetral de Oriente y Briceño-Tunja-Sogamoso).
  entrada: {bbox: [-74.10, 4.80, -73.90, 5.05]}
  minimos: {numero_registros: 4}
  campos: [avance_obra, concesionario, etapa, generacion, longitud_concesionada_m, numero_registros, proyecto, valor_contrato]
  latencia_max_ms: 8000
