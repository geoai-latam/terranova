id: ant_consejos_comunitarios_en_punto
version: 3
familia: ambiente
fuente: ant.consejos_comunitarios
pregunta: "¿En qué territorio colectivo de comunidades negras (consejo comunitario titulado) cae este punto?"
descripcion: >
  Consejo comunitario titulado por la ANT (territorio colectivo de comunidades negras, Ley 70 de
  1993) que contiene un punto: nombre, departamento y municipio (código DIVIPOLA y su nombre en
  `*_significado`; la ANT anota un solo municipio aunque el territorio cruce varios), último acto
  administrativo y área. Solo títulos formalizados; las solicitudes en trámite no están. Para
  resguardos indígenas, ant_resguardos_en_punto.
  Para un lote, ant_consejos_comunitarios_en_poligono. Con `geometria` sale el polígono completo. Sale de la copia de Terrnova: la
  procedencia dice de cuándo es.
  (Fuente: ANT; licencia: CC BY-SA 4.0.)
entrada: {lon: float, lat: float}
consulta:
  operacion: en_punto
  tool: consultar_copia
  argumentos:
    tabla: ant_consejos_comunitarios
    punto: ["{lon}", "{lat}"]
    select: [NOMBRE, DEPARTAMENTO, MUNICIPIO, ULTIMO_TIPO_ACTO_ADMIN, ULTIMO_NUMERO_ACTO_ADMIN, ULTIMA_FECHA_ACTO_ADMIN, AREA_TOTAL_ACTOS_ADMIN]
    geometria: simplificada
    order: [NOMBRE]
    limite: 5
  campos: [NOMBRE, DEPARTAMENTO, MUNICIPIO, ULTIMO_TIPO_ACTO_ADMIN, ULTIMO_NUMERO_ACTO_ADMIN, ULTIMA_FECHA_ACTO_ADMIN, AREA_TOTAL_ACTOS_ADMIN]
salida: ConsejoComunitarioEnPunto
avisos:
- cuando: vacio
  texto: >
    El punto no cae en ninguno de los consejos comunitarios titulados que publica la ANT. La capa
    solo trae títulos colectivos formalizados: las solicitudes en trámite no están, así que esto no
    descarta un territorio de comunidades negras.
cobro: punto
canario:
  # Medio Atrato (Chocó); medido el 2026-10-28 en la capa 0: Consejo Comunitario Mayor del Medio
  # Atrato (ACIA), municipio 27001, Resolución 4566.
  entrada: {lon: -76.70, lat: 6.20}
  verdad: {nombre: "Consejo Comunitario Mayor del Medio Atrato - ACIA", municipio_divipola: "27001", numero_acto: "4566"}
  campos: [area_ha_actos, departamento_divipola, departamento_divipola_significado, fecha_acto, id_poligono, municipio_divipola, municipio_divipola_significado, nombre, numero_acto, tipo_acto]
  latencia_max_ms: 5000
