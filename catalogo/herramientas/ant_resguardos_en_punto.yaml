id: ant_resguardos_en_punto
version: 4
familia: ambiente
fuente: ant.resguardos_indigenas
pregunta: "¿En qué resguardo indígena formalizado cae este punto?"
descripcion: >
  Resguardo indígena formalizado por la ANT que contiene un punto: nombre, pueblo, departamento y
  municipio (código DIVIPOLA y su nombre en `*_significado`), último acto administrativo y área.
  Cubre todo el país, pero solo los 989 resguardos que la ANT publica: faltan algunos
  formalizados, como los de origen colonial de Toribío (Cauca), y las solicitudes en trámite y
  otros territorios étnicos. Un «no encontrado» no descarta un territorio indígena. Un resguardo
  grande da un solo municipio aunque cruce varios, y en 46 de los 989 la ANT escribe el nombre del
  municipio en vez del código DIVIPOLA (entonces no sale nombre al lado).
  Para un lote, ant_resguardos_en_poligono. Con `geometria` sale el polígono completo. Sale de la copia de Terrnova: la
  procedencia dice de cuándo es.
  (Fuente: ANT; licencia: CC BY-SA 4.0.)
entrada: {lon: float, lat: float}
consulta:
  operacion: en_punto
  tool: consultar_copia
  argumentos:
    tabla: ant_resguardos_indigenas
    punto: ["{lon}", "{lat}"]
    select: [NOMBRE, PUEBLO, DEPARTAMENTO, MUNICIPIO, ULTIMO_TIPO_ACTO_ADMIN, ULTIMO_NUMERO_ACTO_ADMIN, ULTIMA_FECHA_ACTO_ADMIN, AREA_TOTAL_ACTOS_ADMIN]
    geometria: simplificada
    order: [NOMBRE]
    limite: 5
  campos: [NOMBRE, PUEBLO, DEPARTAMENTO, MUNICIPIO, ULTIMO_TIPO_ACTO_ADMIN, ULTIMO_NUMERO_ACTO_ADMIN, ULTIMA_FECHA_ACTO_ADMIN, AREA_TOTAL_ACTOS_ADMIN]
salida: ResguardoEnPunto
avisos:
- cuando: vacio
  texto: >
    La capa de la ANT no tiene un resguardo en este punto, pero no publica todos: faltan, por
    ejemplo, Toribío, Tacueyó y San Francisco, los resguardos nasa de origen colonial de Toribío
    (Cauca). Tampoco trae solicitudes en trámite ni otros territorios étnicos. Esto no descarta un
    territorio indígena: para una consulta previa, confirme con el Ministerio del Interior.
cobro: punto
canario:
  # Gran resguardo del Vaupés, Mitú; medido el 2026-10-21 en la capa 0 (punto), 1,0 s.
  entrada: {lon: -70.5, lat: 0.8}
  verdad: {nombre: "Resguardo Indígena Vaupes", municipio_divipola: "97001", numero_acto: "378"}
  campos: [area_ha_actos, departamento_divipola, departamento_divipola_significado, fecha_acto, id_poligono, municipio_divipola, municipio_divipola_significado, nombre, numero_acto, pueblo, tipo_acto]
  latencia_max_ms: 5000
