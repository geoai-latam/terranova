id: ant_resguardos_municipio
version: 1
familia: ambiente
fuente: ant.resguardos_indigenas
pregunta: "¿Qué resguardos indígenas formalizados anota la ANT en este municipio?"
descripcion: >
  Resguardos indígenas formalizados que la ANT anota en un municipio (código DIVIPOLA de 5
  dígitos): nombre, pueblo, último acto administrativo y área según los actos. Arriba, el total,
  cuántos hay de cada pueblo y la suma de sus áreas. La ANT anota un solo municipio por resguardo:
  uno que cruza varios sale solo en el anotado, y 46 de los 989 traen el nombre del municipio en
  vez del código, así que no salen aquí. Para todo lo que toca el municipio, use
  ant_resguardos_en_zona o ant_resguardos_en_poligono. Con `geometria`, los polígonos salen
  simplificados a unos 55 m (enteros, por punto o por polígono).
  Sale de la copia de Terrnova: la procedencia dice de cuándo es.
  (Fuente: ANT; licencia: CC BY-SA 4.0.)
entrada: {municipio_divipola: divipola}
consulta:
  operacion: por_codigo
  resultado: lista
  tool: consultar_copia
  argumentos:
    tabla: ant_resguardos_indigenas
    filtros: {MUNICIPIO: "{municipio_divipola}"}
    select: [NOMBRE, PUEBLO, DEPARTAMENTO, MUNICIPIO, ULTIMO_TIPO_ACTO_ADMIN, ULTIMO_NUMERO_ACTO_ADMIN, ULTIMA_FECHA_ACTO_ADMIN, AREA_TOTAL_ACTOS_ADMIN]
    geometria: simplificada
    order: ["-AREA_TOTAL_ACTOS_ADMIN", NOMBRE]
    limite: 1000
  campos: [NOMBRE, PUEBLO, DEPARTAMENTO, MUNICIPIO, ULTIMO_TIPO_ACTO_ADMIN, ULTIMO_NUMERO_ACTO_ADMIN, ULTIMA_FECHA_ACTO_ADMIN, AREA_TOTAL_ACTOS_ADMIN]
salida: ResguardosMunicipio
derivados:
  total: {de: completitud_total, tipo: int}
  por_pueblo: {de: conteo_por, campo: pueblo}
  area_ha_actos_total: {de: suma, campo: area_ha_actos, tipo: float, decimales: 2}
avisos:
- cuando: vacio
  texto: >
    La ANT no anota ningún resguardo con ese código de municipio. No quiere decir que no haya: anota
    un solo municipio por resguardo, en 46 escribe el nombre del municipio en vez del código, y no
    publica todos (faltan los de origen colonial de Toribío, Cauca). Para ver lo que toca el
    municipio, use ant_resguardos_en_zona con su rectángulo.
- cuando: encontrado
  texto: >
    Son los resguardos que la ANT anota en este municipio, uno por resguardo: los que lo cruzan pero
    están anotados en otro, o con el nombre en vez del código, no salen. La suma de áreas es la de
    los actos de cada resguardo, aunque una parte quede en otro municipio.
cobro: agregado
canario:
  # Coyaima (Tolima); medido el 2026-11-05 en la capa 0 (MUNICIPIO = 73217, returnCountOnly): 34
  # resguardos, el más grande según los actos Pijao El Tambo. Otros 4 anotan «COYAIMA».
  entrada: {municipio_divipola: "73217"}
  verdad: {total: 34, nombre: "Resguardo Indígena Pijao El Tambo"}
  campos: [area_ha_actos, area_ha_actos_total, departamento_divipola, departamento_divipola_significado, fecha_acto, id_poligono, municipio_divipola, municipio_divipola_significado, nombre, numero_acto, por_pueblo, pueblo, tipo_acto, total]
  latencia_max_ms: 8000
