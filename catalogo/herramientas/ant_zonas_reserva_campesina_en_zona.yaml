id: ant_zonas_reserva_campesina_en_zona
version: 1
familia: ambiente
fuente: ant.zonas_reserva_campesina
pregunta: "¿Qué zonas de reserva campesina constituidas hay en esta zona?"
descripcion: >
  Zonas de reserva campesina constituidas que se cruzan con un rectángulo (bbox en EPSG:4326):
  nombre, departamento, municipios, acto y fecha de constitución y área. Van de la más grande a la
  más pequeña; arriba, el total. Sirve para pintar la capa (son 30 en el país): con `geometria` salen
  simplificados a unos 55 m (enteros, por punto o por polígono). Para un lote, mejor
  ant_zonas_reserva_campesina_en_poligono. Las zonas en trámite no están.
  Sale de la copia de Terrnova: la procedencia dice de cuándo es.
  (Fuente: ANT; licencia: CC BY-SA 4.0.)
entrada: {bbox: bbox}
consulta:
  operacion: en_zona
  tool: consultar_copia
  argumentos:
    tabla: ant_zonas_reserva_campesina
    bbox: "{bbox}"
    select: [NOMBRE_ZON, DEPARTAMENTO, MUNICIPIOS, ACTO_ADMIN, FECHA_CONSTITUCION, Area_HA]
    geometria: simplificada
    order: ["-Area_HA", NOMBRE_ZON]
    limite: 1000
  campos: [NOMBRE_ZON, DEPARTAMENTO, MUNICIPIOS, ACTO_ADMIN, FECHA_CONSTITUCION, Area_HA]
salida: ZonasReservaCampesinaEnZona
derivados:
  total: {de: completitud_total, tipo: int}
  fecha_modificacion:
    de: columna
    campo: FECHA_CONSTITUCION
    patron: 'modificaci[oó]n:\s*(\d{1,2}/\d{1,2}/\d{4})'
    orden_fecha: dma
    tipo: date
avisos:
- cuando: vacio
  texto: >
    El rectángulo no toca ninguna de las zonas de reserva campesina constituidas que publica la
    ANT. Las zonas en trámite no están en esta fuente, así que esto no descarta que se esté
    constituyendo una.
cobro: zona
canario:
  # Medido el 2026-11-05 en la capa 0 (envelope, intersects, returnCountOnly): 4 zonas; la de más
  # área es Cabrera.
  entrada: {bbox: [-75, 3, -73, 5]}
  verdad: {total: 4, nombre: Cabrera}
  campos: [acto_administrativo, area_ha, departamento, fecha_constitucion, fecha_modificacion, id_poligono, municipios, nombre, total]
  latencia_max_ms: 8000
