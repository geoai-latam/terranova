id: banrep_ibr_recientes
version: 2
familia: estadisticas
fuente: banrep.ibr
pregunta: "¿Cómo va el IBR en sus distintos plazos?"
descripcion: >
  Indicador bancario de referencia (IBR) del Banco de la República: las últimas observaciones (`ultimas` por serie; hasta 5000 filas), una fila por
  fecha y serie, con la unidad (tasa; cada plazo y modalidad es una serie (SUBJECT)). Solo días hábiles. Sale del servicio SDMX oficial; se cita con la fecha de
  consulta, como pide el aviso legal del Banco.
  (Fuente: Banco de la República; licencia: aviso legal del BanRep.)
entrada: {ultimas: int}
consulta:
  operacion: serie
  tool: web_sdmx
  argumentos:
    url: "{url_fuente}"
    params: {lastNObservations: "{ultimas}"}
  campos: [TIME_PERIOD, OBS_VALUE, SUBJECT, UNIT_MEASURE, FREQ]
salida: IbrRecientes
derivados:
  numero_registros: {de: conteo, tipo: int}
avisos:
- cuando: encontrado
  texto: >
    Cada fecha trae ocho filas: cuatro series (IRIBRM00, IRIBRM01, IRIBRM03 e IRIBRM06) por dos
    unidades (ER y NR), y `ultimas` cuenta por cada una, así que 3 da 24 filas. El BanRep publica
    la IBR a los plazos overnight, 1, 3 y 6 meses, en tasa nominal y efectiva (ficha metodológica
    de la IBR). La tabla oficial de códigos no se pudo leer en el servicio SDMX: el mismo día, ER
    sale más alta que NR (12,252 frente a 11,401 en IRIBRM00 el 2026-11-04), como una tasa efectiva
    frente a una nominal.
cobro: registro
canario:
  # Medido el 2026-10-22 en DF_IBR_DAILY_HIST con lastNObservations: 8 serie(s), unidad y frecuencia como
  # dice la ficha. Los valores cambian a diario: el canario mira la forma y cuántas filas llegan.
  entrada: {ultimas: 5}
  minimos: {numero_registros: 40}
  campos: [fecha, frecuencia, numero_registros, serie, unidad, valor]
  latencia_max_ms: 20000  # SDMX del BanRep: de 7 a 11 s medidos
