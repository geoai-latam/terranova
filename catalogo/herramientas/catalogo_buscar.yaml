id: catalogo_buscar
version: 2
familia: meta
fuente: descubrimiento.catalogo_dcat
pregunta: "¿Qué fuente oficial responde esta pregunta sobre un lugar, y con qué licencia?"
descripcion: >
  Busca en el catálogo de fuentes oficiales (datos.gov.co y el Hub de la ICDE) por el significado y
  las palabras de la pregunta. Primero van las herramientas de Terrnova que casan con ella
  (`protocolo: terrnova`, licencia verificada, sin `parecido`): si hay una, úsela antes que un
  dataset crudo. Después, los datasets o capas candidatos con su entidad, licencia, vigencia,
  protocolo y enlace, para consultarlos con el conector genérico. Su orden junta el parecido de
  significado (`parecido`, de 0 a 1) con la coincidencia de palabras: uno con menos parecido puede
  ir antes si nombra lo que se busca. No filtra por lugar: mire `titulo` y `entidad`. Una licencia
  «no declarada» se trata como CC BY-SA 4.0. La puerta no inventa la respuesta: solo recupera
  candidatos y su procedencia.
  (Fuente: catálogo DCAT de datos.gov.co y de la ICDE; licencia: términos de uso de datos.gov.co.)
entrada: {consulta: nombre}
consulta:
  operacion: buscar
  tool: buscar_catalogo
  argumentos: {consulta: "{consulta}", limite: 20}
  campos: [id, titulo, entidad, licencia, actualizado_en, protocolo, url, parecido]
salida: CandidatosCatalogo
derivados:
  coincidencias: {de: completitud_total, tipo: int}
cobro: codigo
canario:
  # La verdad se mide en el almacén desplegado (pgvector con los dos catálogos ingeridos): una
  # consulta semántica trae al menos un candidato competente. El mínimo es 1 (crece con el catálogo).
  # Medido el 2026-11-03 en producción: la primera es la herramienta del RUNAP, antes que los 35
  # datasets (el primero, un censo de Restrepo).
  entrada: {consulta: "áreas protegidas de un predio"}
  verdad: {id: pnn_areas_protegidas_en_punto, protocolo: terrnova}
  minimos: {coincidencias: 1}
  campos: [actualizado_en, coincidencias, entidad, id, licencia, parecido, protocolo, titulo, url]
  latencia_max_ms: 10000
