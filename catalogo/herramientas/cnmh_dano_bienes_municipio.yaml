id: cnmh_dano_bienes_municipio
version: 2
familia: justicia
fuente: cnmh.sievcac_dano_bienes
pregunta: "¿Cuántas víctimas dejaron los ataques a bienes civiles en este municipio?"
descripcion: >
  Víctimas de daño a bienes civiles del conflicto armado en un municipio (DIVIPOLA), según el Observatorio de Memoria y
  Conflicto del CNMH: personas y casos por año.
  El año 0 es «sin información». Las modalidades son excluyentes: un hecho cuenta en una sola herramienta cnmh_*.
  Solo conteos, nunca el registro de una persona.
  (Fuente: Centro Nacional de Memoria Histórica; licencia: CC BY-SA 4.0.)
entrada: {municipio_divipola: divipola}
consulta:
  operacion: por_codigo
  resultado: lista
  tool: datos_consultar
  argumentos:
    id: a2ga-ur2i
    portal: datos.gov.co
    select: "a_o, count(distinct id_persona) AS victimas, count(distinct id_caso) AS casos"
    where: "c_digo_dane_de_municipio = '{municipio_divipola}'"
    group: "a_o"
    order: "a_o"
    max_filas: 1000
  campos: [c_digo_dane_de_municipio, a_o, id_caso, id_persona]
salida: CnmhDanoBienesMunicipio
derivados:
  victimas: {de: columna, campo: victimas, tipo: int}
  casos: {de: columna, campo: casos, tipo: int}
  total_victimas: {de: suma, campo: victimas, tipo: int}
avisos:
- cuando: encontrado
  texto: >
    Las modalidades del CNMH son excluyentes: cada víctima cuenta en una sola, y un mismo hecho puede estar en otra herramienta cnmh_*_municipio. Por ejemplo, las 81 víctimas civiles de Bojayá del 2 de mayo de 2002 están en acciones bélicas, no en masacres. Para el total del municipio en una sola respuesta, cnmh_conflicto_municipio.
- cuando: encontrado
  texto: >
    El conjunto de daño a bienes civiles trae una fila por víctima: en todo el país son 466 víctimas en 224 casos (medido el 2026-11-03). Un daño a bienes sin víctimas no está aquí, así que estos casos no son todos los daños a bienes del municipio.
cobro: agregado
canario:
  # Medido el 2026-10-23 en a2ga-ur2i: GRANADA (05313), 2 víctimas en todos los años.
  # El CNMH revisa casos con cada corte: el total es un mínimo.
  entrada: {municipio_divipola: "05313"}
  verdad: {anio: 2003, victimas: 2, casos: 1}
  minimos: {total_victimas: 2}
  campos: [anio, casos, total_victimas, victimas]
  latencia_max_ms: 10000
