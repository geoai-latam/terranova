id: cnmh_reclutamiento_municipio
version: 2
familia: justicia
fuente: cnmh.sievcac_reclutamiento
pregunta: "¿Cuántos niños, niñas y adolescentes fueron reclutados por grupos armados en este municipio?"
descripcion: >
  Víctimas de reclutamiento y utilización de menores del conflicto armado en un municipio (DIVIPOLA), según el Observatorio de Memoria y
  Conflicto del CNMH: personas y casos por año.
  El año 0 es «sin información». Las modalidades son excluyentes: un hecho cuenta en una sola herramienta cnmh_*.
  Solo conteos, nunca el registro de una persona.
  (Fuente: Centro Nacional de Memoria Histórica; licencia: CC BY-SA 4.0.)
entrada: {municipio_divipola: divipola}
consulta:
  operacion: por_codigo
  resultado: lista
  tool: datos_consultar
  argumentos:
    id: fc55-h9nc
    portal: datos.gov.co
    select: "a_o, count(distinct id_persona) AS victimas, count(distinct id_caso) AS casos"
    where: "c_digo_dane_de_municipio = '{municipio_divipola}'"
    group: "a_o"
    order: "a_o"
    max_filas: 1000
  campos: [c_digo_dane_de_municipio, a_o, id_caso, id_persona]
salida: CnmhReclutamientoMunicipio
derivados:
  victimas: {de: columna, campo: victimas, tipo: int}
  casos: {de: columna, campo: casos, tipo: int}
  total_victimas: {de: suma, campo: victimas, tipo: int}
  victimas_sin_anio: {de: suma, campo: victimas, tipo: int, solo_si: {campo: anio, valores: ["0"]}}
avisos:
- cuando: encontrado
  texto: >
    Las modalidades del CNMH son excluyentes: cada víctima cuenta en una sola, y un mismo hecho puede estar en otra herramienta cnmh_*_municipio. Por ejemplo, las 81 víctimas civiles de Bojayá del 2 de mayo de 2002 están en acciones bélicas, no en masacres. Para el total del municipio hay que sumar las modalidades.
- cuando: encontrado
  texto: >
    La mayoría de las víctimas de reclutamiento no tiene año (año 0, «sin información»): en todo el país son 11 484 sin año frente a 6 903 con año (medido el 2026-11-02). La serie por año se queda corta; victimas_sin_anio dice cuántas faltan en este municipio.
cobro: agregado
canario:
  # Medido el 2026-10-23 en fc55-h9nc: GRANADA (05313), 43 víctimas en todos los años.
  # El CNMH revisa casos con cada corte: el total es un mínimo.
  entrada: {municipio_divipola: "05313"}
  verdad: {anio: 0, victimas: 29, casos: 29}
  minimos: {total_victimas: 43, victimas_sin_anio: 29}
  campos: [anio, casos, total_victimas, victimas, victimas_sin_anio]
  latencia_max_ms: 10000
