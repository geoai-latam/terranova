id: dane_ipm_municipio
version: 1
familia: estadisticas
fuente: dane.ipm_municipal_2018
pregunta: "¿Qué porcentaje de la población de este municipio está en pobreza multidimensional?"
descripcion: >
  Incidencia de la pobreza multidimensional de un municipio (DIVIPOLA) según la medida censal 2018
  del DANE: total, cabeceras y centros poblados y rural disperso, en %. Es una aproximación con el
  censo: el DANE advierte que no es comparable con el IPM oficial (dane_ipm_departamento).
  Sale de la copia de Terrnova del anexo censal del DANE.
  (Fuente: DANE; licencia: términos de uso del DANE.)
entrada: {municipio_divipola: divipola}
consulta:
  operacion: por_codigo
  resultado: lista
  tool: consultar_copia
  argumentos:
    tabla: dane_ipm_municipal
    filtros: {ID: "{municipio_divipola}"}
    select: [ID, Municipio, IPM, Cabeceras, IPM Centros poblados y rural disperso]
    order: [_fila]
    limite: 5
  campos: [ID, Municipio, IPM, Cabeceras, IPM Centros poblados y rural disperso]
salida: IpmMunicipio
derivados:
  numero_registros: {de: conteo, tipo: int}
cobro: registro
canario:
  # Medido el 2026-10-22 en el anexo censal 2018: Chía (25175) → 6,7 % total, 6,3 % cabeceras, 8,6 % rural.
  entrada: {municipio_divipola: "25175"}
  verdad: {municipio_divipola: "25175", ipm_total: 6.7, ipm_cabeceras: 6.3, ipm_rural: 8.6}
  campos: [ipm_cabeceras, ipm_rural, ipm_total, municipio, municipio_divipola, numero_registros]
  latencia_max_ms: 5000
