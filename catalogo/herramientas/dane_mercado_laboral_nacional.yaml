id: dane_mercado_laboral_nacional
version: 2
familia: estadisticas
fuente: dane.geih_nacional
pregunta: "¿Cómo estuvo el desempleo y el empleo en Colombia en este año?"
descripcion: >
  Mercado laboral del total nacional según la GEIH del DANE, mes a mes en un año (desde 2001): tasa
  global de participación, de ocupación, de desocupación (desempleo), de subocupación y las
  poblaciones (en miles), con un decimal. Arriba, el último mes del año y sus tasas de desempleo,
  ocupación y participación. Solo el total nacional, sin las cabeceras. Sale de la copia de Terrnova
  del anexo del último mes publicado.
  (Fuente: DANE; licencia: términos de uso del DANE.)
entrada: {anio: int}
consulta:
  operacion: por_codigo
  resultado: lista
  tool: consultar_copia
  argumentos:
    tabla: dane_geih_nacional
    filtros: {columna: "{anio}"}
    select: [Concepto, columna, subcolumna, valor]
    order: [_fila]
    limite: 1000
  campos: [Concepto, columna, subcolumna, valor]
salida: MercadoLaboralNacional
derivados:
  # El resumen que pide la pregunta: el último mes del año y sus tres tasas.
  ultimo_mes: {de: ultimo, campo: mes, solo_si: {campo: indicador, valores: ["Tasa de Desocupación (TD)"]}}
  tasa_desempleo_ultimo_mes: {de: ultimo, campo: valor, tipo: float, solo_si: {campo: indicador, valores: ["Tasa de Desocupación (TD)"]}}
  tasa_ocupacion_ultimo_mes: {de: ultimo, campo: valor, tipo: float, solo_si: {campo: indicador, valores: ["Tasa de Ocupación (TO)"]}}
  tasa_participacion_ultimo_mes: {de: ultimo, campo: valor, tipo: float, solo_si: {campo: indicador, valores: ["Tasa Global de Participación (TGP)"]}}
  numero_registros: {de: conteo, tipo: int}
cobro: registro
canario:
  # Medido el 2026-11-02 en anex-GEIH-sep2026.xlsx, solo el Total Nacional: en 2001, 16 indicadores
  # por 12 meses; el primero (% de población en edad de trabajar) de enero vale 68,4, y la tasa de
  # desempleo de diciembre, 13,6 (la de las cabeceras, 15,6, ya no sale).
  entrada: {anio: 2001}
  verdad: {anio: "2001", mes: Ene, valor: 68.4, ultimo_mes: Dic, tasa_desempleo_ultimo_mes: 13.6, tasa_ocupacion_ultimo_mes: 59.4, tasa_participacion_ultimo_mes: 68.8, numero_registros: 192}
  campos: [anio, indicador, mes, numero_registros, tasa_desempleo_ultimo_mes, tasa_ocupacion_ultimo_mes, tasa_participacion_ultimo_mes, ultimo_mes, valor]
  latencia_max_ms: 5000
