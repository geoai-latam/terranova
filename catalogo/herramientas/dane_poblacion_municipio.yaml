id: dane_poblacion_municipio
version: 1
familia: estadisticas
fuente: dane.cnpv2018.municipio
pregunta: "¿Cuánta gente vive en este municipio según el censo 2018?"
descripcion: >
  Totales oficiales del Censo Nacional de Población y Vivienda 2018 de un municipio, por su código
  DIVIPOLA de 5 dígitos: personas, viviendas y hogares censados. Es población censada en 2018, no
  una proyección a hoy.
  (Fuente: DANE; licencia: términos de uso del DANE.)
entrada: {municipio_divipola: divipola}
consulta:
  operacion: por_codigo
  tool: consultar_copia
  argumentos:
    tabla: dane_cnpv2018_municipio
    filtros: {MPIO_CDPMP: "{municipio_divipola}"}
    select: [MPIO_CDPMP, MPIO_CNMBR, DPTO_CCDGO, STP27_PERS, STVIVIENDA, TSP16_HOG]
    limite: 5
  campos: [MPIO_CDPMP, MPIO_CNMBR, DPTO_CCDGO, STP27_PERS, STVIVIENDA, TSP16_HOG]
# el nombre oficial del departamento por su código (DIVIPOLA, datos.gov.co gdxc-w37w): la capa
# del censo solo trae el código, y su capa de departamentos tenía las tildes dañadas
derivados:
  departamento: {de: codigo, campo: departamento_divipola, valores: {"05": "ANTIOQUIA", "08": "ATLÁNTICO", "11": "BOGOTÁ, D.C.", "13": "BOLÍVAR", "15": "BOYACÁ", "17": "CALDAS", "18": "CAQUETÁ", "19": "CAUCA", "20": "CESAR", "23": "CÓRDOBA", "25": "CUNDINAMARCA", "27": "CHOCÓ", "41": "HUILA", "44": "LA GUAJIRA", "47": "MAGDALENA", "50": "META", "52": "NARIÑO", "54": "NORTE DE SANTANDER", "63": "QUINDÍO", "66": "RISARALDA", "68": "SANTANDER", "70": "SUCRE", "73": "TOLIMA", "76": "VALLE DEL CAUCA", "81": "ARAUCA", "85": "CASANARE", "86": "PUTUMAYO", "88": "ARCHIPIÉLAGO DE SAN ANDRÉS, PROVIDENCIA Y SANTA CATALINA", "91": "AMAZONAS", "94": "GUAINÍA", "95": "GUAVIARE", "97": "VAUPÉS", "99": "VICHADA"}}
salida: PoblacionMunicipio
cobro: registro
# Medido el 2026-10-22 (UTC) en la capa 800 del servicio, where MPIO_CDPMP='11001'.
canario:
  entrada: {municipio_divipola: "11001"}
  verdad: {municipio_divipola: "11001", poblacion_censada: 7181469, viviendas: 2523519, hogares: 2514482}
  campos: [departamento, departamento_divipola, hogares, municipio, municipio_divipola, poblacion_censada, viviendas]
