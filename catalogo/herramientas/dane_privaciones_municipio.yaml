id: dane_privaciones_municipio
version: 2
familia: estadisticas
fuente: dane.ipm_municipal_2018_privaciones
pregunta: "¿En qué privaciones (educación, salud, vivienda, trabajo) está más mal este municipio?"
descripcion: >
  Las 15 privaciones de la medida de pobreza multidimensional censal 2018 del DANE en un municipio
  (DIVIPOLA): porcentaje de hogares con analfabetismo, bajo logro educativo, sin aseguramiento en
  salud, hacinamiento crítico, trabajo informal, etc. Una fila por privación. Sale de la copia de
  Terrnova del anexo censal del DANE. Van de la peor a la mejor (el porcentaje más alto primero),
  y son de 2018 (`anio`): el DANE no ha publicado otra medida municipal.
  (Fuente: DANE; licencia: términos de uso del DANE.)
entrada: {municipio_divipola: divipola}
consulta:
  operacion: por_codigo
  resultado: lista
  tool: consultar_copia
  argumentos:
    tabla: dane_privaciones_municipal
    filtros: {ID: "{municipio_divipola}"}
    select: [ID, Municipio, columna, valor]
    order: ["-valor", _fila]
    limite: 20
  campos: [ID, Municipio, columna, valor]
salida: PrivacionesMunicipio
derivados:
  anio: {de: fijo, valor: 2018, tipo: int}
  peor_privacion: {de: primero, campo: privacion}
  porcentaje_peor_privacion: {de: primero, campo: porcentaje, tipo: float}
  numero_registros: {de: conteo, tipo: int}
avisos:
# La respuesta no decía el año de la medida; solo la descripción (revisión de valor, 2026-11-04).
- cuando: encontrado
  texto: >
    Son porcentajes de hogares del censo de 2018, la única medida municipal del DANE: dicen dónde
    estaba peor el municipio entonces, no cómo está hoy ni si mejoró.
cobro: registro
canario:
  # Medido el 2026-10-22: Chía (25175) tiene 15 privaciones; la peor, trabajo informal, 69,6 %.
  entrada: {municipio_divipola: "25175"}
  verdad: {anio: 2018, peor_privacion: Trabajo informal, porcentaje_peor_privacion: 69.6}
  minimos: {numero_registros: 15}
  campos: [anio, municipio, municipio_divipola, numero_registros, peor_privacion, porcentaje, porcentaje_peor_privacion, privacion]
  latencia_max_ms: 5000
