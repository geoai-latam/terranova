id: funcionpublica_norma_buscar
version: 1
familia: normativa
fuente: funcionpublica.gestor_normativo
pregunta: "¿Qué dice esta norma sobre este tema?"
descripcion: >
  Busca dentro de una norma del Gestor Normativo de Función Pública por su número (el i= de su
  enlace, p. ej. 56882 para la Ley 1712 de 2014) y devuelve hasta 20 fragmentos alrededor de cada
  aparición, con cuántas hay. Los textos traen las notas de vigencia de Función Pública.
  (Fuente: Función Pública; licencia: Ley 23 de 1982, art. 41.)
entrada: {norma: int, buscar: str}
consulta:
  operacion: buscar
  tool: web_html
  argumentos:
    url: "https://www.funcionpublica.gov.co/eva/gestornormativo/norma.php?i={norma}"
    buscar: "{buscar}"
  campos: [n, posicion, texto, titulo, caracteres, apariciones]
salida: NormaFuncionPublicaBuscar
derivados:
  numero_registros: {de: conteo, tipo: int}
creditos: 2
canario:
  # Medido el 2026-10-22: la Ley 1712 de 2014 (56882) tiene 2 apariciones de «ARTÍCULO 5».
  entrada: {norma: 56882, buscar: ARTÍCULO 5}
  verdad: {apariciones: 2, titulo: "Ley 1712 de 2014 - Gestor Normativo - Función Pública"}
  minimos: {numero_registros: 2}
  campos: [apariciones, caracteres, n, numero_registros, posicion, texto, titulo]
  latencia_max_ms: 30000
