id: icfes_saber11_municipio
version: 2
familia: estadisticas
fuente: icfes.saber11
pregunta: "¿Cuántos estudiantes presentaron el Saber 11 en este municipio y qué puntaje promedio sacaron?"
descripcion: >
  Prueba Saber 11 (ICFES) en los colegios de un municipio (código DANE / DIVIPOLA), por periodo del
  examen, de 2010 a 2022: número de estudiantes y promedio del puntaje global (0–500), de
  matemáticas y de lectura crítica. El periodo es AAAAS: el año y luego 1 (primer semestre, pocos
  colegios, sobre todo de calendario B) o 2 y 4 (segundo semestre, la mayoría); la fuente no trae
  el segundo semestre de 2018, 2020 ni 2021. Hasta 20141 no traen puntaje global ni de lectura crítica.
  Solo agregados: un periodo con menos de 10 estudiantes no sale. Cada estudiante cuenta una vez,
  aunque la fuente lo repita (lo hace en 20181, 20194 y 20224). Para el detalle por estrato,
  icfes_saber11_estrato_municipio; para un colegio, icfes_saber11_colegio.
  (Fuente: ICFES; licencia: CC BY-SA 4.0.)
entrada: {municipio_divipola: divipola}
consulta:
  operacion: por_codigo
  resultado: lista
  tool: consultar_copia
  argumentos:
    tabla: icfes_saber11
    filtros: {cole_cod_mcpio_ubicacion: "{municipio_divipola}"}
    select: [periodo]
    group: [periodo]
    agregados:
      estudiantes: "sum:estudiantes"
      promedio_global: "cociente:suma_punt_global/n_punt_global"
      promedio_matematicas: "cociente:suma_punt_matematicas/n_punt_matematicas"
      promedio_lectura_critica: "cociente:suma_punt_lectura_critica/n_punt_lectura_critica"
    minimo: {"sum:estudiantes": 10}  # ADR-0014: sin grupos chicos de personas
    order: [periodo]
    limite: 50
  campos: [periodo, cole_cod_mcpio_ubicacion, estudiantes, suma_punt_global, n_punt_global, suma_punt_matematicas, n_punt_matematicas, suma_punt_lectura_critica, n_punt_lectura_critica]
salida: Saber11Municipio
derivados:
  estudiantes: {de: columna, campo: estudiantes, tipo: int}
  promedio_global: {de: columna, campo: promedio_global, tipo: float, decimales: 2}
  promedio_matematicas: {de: columna, campo: promedio_matematicas, tipo: float, decimales: 2}
  promedio_lectura_critica: {de: columna, campo: promedio_lectura_critica, tipo: float, decimales: 2}
avisos:
- cuando: vacio
  texto: >
    No hay resultados del Saber 11 para ese municipio: o no tiene colegios que presentaran el
    examen, o en ningún periodo llegaron a 10 estudiantes (por debajo de eso no se publican). Revise
    que el código DIVIPOLA sea el del municipio (5 dígitos).
cobro: agregado
canario:
  # Medido el 2026-10-22 en kgxf-xxbe (group periodo, having n ≥ 10, orden por periodo): el primer
  # grupo de Chía es 20101 con 464 estudiantes.
  entrada: {municipio_divipola: "25175"}
  verdad: {periodo: "20101", estudiantes: 464}
  campos: [estudiantes, periodo, promedio_global, promedio_lectura_critica, promedio_matematicas]
  latencia_max_ms: 30000
