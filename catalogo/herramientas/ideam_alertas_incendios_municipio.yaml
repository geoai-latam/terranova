id: ideam_alertas_incendios_municipio
version: 3
familia: ambiente
fuente: ideam.alertas_incendios
pregunta: "¿Hay alerta por incendio forestal en este municipio? ¿Cuáles fueron sus alertas recientes?"
descripcion: >
  Las alertas más recientes por incendios de la cobertura vegetal (forestales) de un municipio
  (DIVIPOLA), según los boletines diarios del IDEAM: fecha y nivel (ALTA = roja, MODERADA = naranja,
  BAJA = amarilla). Primero la más reciente; hasta 15. El IDEAM publica cada noche (~23:30) solo los
  municipios con alerta ese día: alerta_vigente dice si la última alerta del municipio
  (ultima_alerta) es la del último boletín (ultimo_boletin): si no, no tiene alerta vigente; «no
  encontrado» = ninguna alerta en el año. Sale de la copia de Terrnova: el último boletín es el de
  la copia, no siempre el de hoy.
  (Fuente: IDEAM; licencia: CC BY-SA 4.0.)
entrada: {municipio_divipola: divipola}
consulta:
  operacion: por_codigo
  resultado: lista
  tool: consultar_copia
  argumentos:
    tabla: ideam_alertas_incendios
    filtros: {COD_DANE: "{municipio_divipola}"}
    select: [COD_DANE, MUNICIPIO, DEPARTAMENTO, REGION, TEXTO_AMENAZA, FECHA_EJECUCION]
    order: [-FECHA_EJECUCION]
    limite: 15
  complemento:
    fuente: ideam.alertas_incendios
    tool: consultar_copia
    argumentos:
      tabla: ideam_alertas_incendios
      agregados: {ultimo: "max:FECHA_EJECUCION"}
    hechos:
      ultimo: {nombre: ultimo_boletin, tipo: date, desc: "fecha del último boletín del IDEAM en la copia de Terrnova (de cualquier municipio)"}
    que_dice: "la fecha del último boletín, para saber si la alerta sigue vigente"
  campos: [COD_DANE, MUNICIPIO, DEPARTAMENTO, REGION, TEXTO_AMENAZA, FECHA_EJECUCION]
salida: AlertasIncendiosMunicipio
derivados:
  numero_registros: {de: conteo, tipo: int}
  ultima_alerta: {de: primero, campo: fecha, tipo: date}
  alerta_vigente: {de: igual, campo: ultima_alerta, igual_a: ultimo_boletin}
avisos:
- cuando: vacio
  texto: >
    Este municipio no tuvo ninguna alerta por incendio de la cobertura vegetal en lo que va del
    año, hasta el último boletín de la copia. El IDEAM solo publica los municipios con alerta
    cada día. Que no haya alertas no quiere decir que no haya habido incendios.
cobro: registro
canario:
  # Medido el 2026-10-28 en alertas_incendios.csv: Bogotá (11001) tuvo alerta en 82 de los 300
  # boletines del año (la del 27-10, baja). La alerta del día cambia, así que el canario pide las 15
  # más recientes. Ojo: el archivo se reinicia cada 1 de enero.
  entrada: {municipio_divipola: "11001"}
  minimos: {numero_registros: 15}
  campos: [alerta_vigente, departamento, fecha, municipio, municipio_divipola, nivel_alerta, numero_registros, region, ultima_alerta, ultimo_boletin]
  latencia_max_ms: 5000
