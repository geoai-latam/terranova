id: ideam_lluvia_diaria_estacion
version: 2
familia: ambiente
fuente: ideam.precipitacion
pregunta: "¿Cuánto llovió cada día en esta estación del IDEAM?"
descripcion: >
  Lluvia acumulada por día (mm) en una estación del IDEAM entre dos fechas, separada por sensor: una
  estación puede tener dos sensores de lluvia que miden distinto, y no se suman. Trae el número de
  observaciones de cada día (un día con pocas tuvo huecos). mm_por_sensor da el total del rango de
  cada sensor. El código de la estación tiene 10 dígitos con ceros a la izquierda
  (ideam_estaciones_en_zona lo da). Solo estaciones automáticas. Rangos cortos: hasta unos 60 días.
  (Fuente: IDEAM; licencia: CC BY-SA 4.0.)
entrada: {codigo_estacion: codigo_estacion_ideam, desde: fecha, hasta: fecha}
consulta:
  operacion: serie
  resultado: lista
  tool: datos_consultar
  argumentos:
    id: s54a-sgyg
    portal: datos.gov.co
    select: "codigoestacion, nombreestacion, municipio, departamento, codigosensor, descripcionsensor, date_trunc_ymd(fechaobservacion) AS dia, sum(valorobservado) AS mm, count(*) AS observaciones"
    where: "codigoestacion = '{codigo_estacion}' AND fechaobservacion between '{desde}T00:00:00' and '{hasta}T23:59:59'"
    group: "codigoestacion, nombreestacion, municipio, departamento, codigosensor, descripcionsensor, dia"
    order: "dia, codigosensor"
    max_filas: 500
  campos: [codigoestacion, nombreestacion, municipio, departamento, codigosensor, descripcionsensor]
derivados:
  dia: {de: columna, campo: dia, tipo: date}
  mm: {de: columna, campo: mm, tipo: float, decimales: 2}
  observaciones: {de: columna, campo: observaciones, tipo: int}
  mm_por_sensor: {de: suma_por, campo: codigo_sensor, sumar: mm, decimales: 2}
  sensores: {de: distintos, campo: codigo_sensor, tipo: int}
  dias_con_datos: {de: distintos, campo: dia, tipo: int}
  ultimo_dia: {de: ultimo, campo: dia, tipo: date}
avisos:
- cuando: encontrado
  si: {campo: sensores, valores: ["2", "3", "4"]}
  texto: >
    La estación tiene más de un sensor de lluvia y no miden lo mismo: cada día sale una vez por
    sensor y mm_por_sensor da el total de cada uno. No se suman. Si uno marca 0,0 varios días
    seguidos mientras el otro mide lluvia, el de 0,0 es el que falla: en Valledupar, del 18 al 26 de
    octubre de 2026, el GPRS (0257) dio 0,0 casi todos los días y el 0240 midió lluvia.
- cuando: vacio
  texto: >
    La estación no tiene observaciones de lluvia en esas fechas. Este conjunto solo trae las
    estaciones automáticas del IDEAM: si la estación es convencional, o está suspendida, no aparece
    aunque exista. ideam_estaciones_en_zona dice su tecnología, si está activa y desde cuándo está
    suspendida. Las observaciones llegan con un día de retraso.
salida: LluviaDiariaEstacion
cobro: agregado
canario:
  # Medido el 2026-10-28 en s54a-sgyg: aeropuerto Alfonso López (Valledupar), 17-10-2026: sensor
  # 0240 (cada 10 min) 9,16 mm en 144 observaciones; sensor 0257 (GPRS, cada 2 min) 4,1 mm en 720.
  entrada: {codigo_estacion: "0028025502", desde: "2026-10-17", hasta: "2026-10-17"}
  verdad: {codigo_sensor: "0240", mm: 9.16, observaciones: 144, sensores: 2, dias_con_datos: 1, ultimo_dia: "2026-10-17"}
  campos: [codigo_estacion, codigo_sensor, departamento, dia, dias_con_datos, estacion, mm, mm_por_sensor, municipio, observaciones, sensor, sensores, ultimo_dia]
  latencia_max_ms: 15000
