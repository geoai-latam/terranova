id: igac_capacidad_uso_en_punto
version: 3
familia: territorio
fuente: igac.agrologia.capacidad_uso
pregunta: "¿Cuál es la capacidad de uso de la tierra en este punto?"
descripcion: >
  Capacidad de uso de las tierras (IGAC, escala 1:100.000) en un punto: clase y subclase de
  capacidad y su descripción. En suelo urbano y en el agua la capa no da clase agrológica: trae
  ZU o CA, y `nota_capacidad` y `unidad_capacidad_significado` lo explican. Cobertura nacional; a esa escala no sirve para un predio.
  Sale de la copia de Terrnova de la capa del IGAC.
  (Fuente: IGAC; licencia: CC BY 4.0.)
entrada: {lon: float, lat: float}
consulta:
  operacion: en_punto
  tool: consultar_copia
  argumentos:
    tabla: igac_capacidad_uso
    punto: ["{lon}", "{lat}"]
    select: [UCCapacida, Descripcio]
    geometria: simplificada
    order: [OBJECTID]
    limite: 5
  campos: [UCCapacida, Descripcio]
salida: CapacidadUsoEnPunto
derivados:
  # visto en Cali: unidad y descripción dicen solo «ZU», que también usan vocación y conflictos
  nota_capacidad:
    de: codigo
    campo: unidad_capacidad
    valores:
      ZU: "Zona urbana: esta capa no le da clase agrológica"
      CA: "Cuerpo de agua: esta capa no le da clase agrológica"
cobro: punto
canario:
  entrada: {lon: -74.0262, lat: 4.8619}
  verdad: {unidad_capacidad: "2c", descripcion_capacidad: "Capacidad alta para agricultura"}
  campos: [descripcion_capacidad, unidad_capacidad]
  latencia_max_ms: 5000
