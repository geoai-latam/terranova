id: igac_capacidad_uso_en_punto
version: 1
familia: territorio
fuente: igac.agrologia.capacidad_uso
pregunta: "¿Cuál es la capacidad de uso de la tierra en este punto?"
descripcion: >
  Capacidad de uso de las tierras (IGAC, escala 1:100.000) en un punto: clase y subclase de
  capacidad y su descripción. Cobertura nacional; a esa escala no sirve para un predio.
  Sale de la copia de Terranova de la capa del IGAC.
  (Fuente: IGAC; licencia: CC BY 4.0.)
entrada: {lon: float, lat: float}
consulta:
  operacion: en_punto
  tool: consultar_copia
  argumentos:
    tabla: igac_capacidad_uso
    punto: ["{lon}", "{lat}"]
    select: [UCCapacida, Descripcio]
    geometria: simplificada
    order: [OBJECTID]
    limite: 5
  campos: [UCCapacida, Descripcio]
salida: CapacidadUsoEnPunto
creditos: 10
canario:
  entrada: {lon: -74.0262, lat: 4.8619}
  verdad: {unidad_capacidad: "2c", descripcion_capacidad: "Capacidad alta para agricultura"}
  campos: [descripcion_capacidad, unidad_capacidad]
  latencia_max_ms: 5000
