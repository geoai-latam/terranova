id: igac_predio_en_punto
version: 1
familia: territorio
fuente: igac.catastro.terreno
pregunta: "¿Qué predio del catastro IGAC hay en este punto?"
descripcion: >
  Predio catastral (IGAC) que contiene un punto: número predial nacional, número anterior, zona
  (rural o urbana) y municipio. Cubre los municipios con gestión catastral del IGAC; Bogotá,
  Medellín, Cali y otros gestores no están en esta fuente (para esos, sinic_predio_en_punto; si no sabe cuál, predio_en_punto). Los
  polígonos sin predio asignado (número todo en ceros tras el municipio) no salen: ahí no hay predio
  identificado.
  (Fuente: IGAC; licencia: CC BY-SA 4.0.)
entrada: {lon: float, lat: float}
consulta:
  operacion: en_punto
  tool: arcgis_query_features
  capas: [14, 7]  # R_TERRENO, U_TERRENO: la zona sale de la capa que responde
  argumentos:
    url: "{url_capa}"
    bbox: ["{lon}", "{lat}", "{lon}", "{lat}"]
    # Spec 07: 265 polígonos en el país (11 en Chía) traen el número 25175 + 25 ceros: no son predios.
    where: "SUBSTRING(CODIGO, 6, 25) <> '0000000000000000000000000'"
    out_fields: [CODIGO, CODIGO_ANTERIOR]
    max_features: 5
  campos: [CODIGO, CODIGO_ANTERIOR]
salida: PredioEnPunto
# `zona` sale de la capa que respondió; `municipio_divipola`, de los 5 primeros dígitos del código
# (el `codigo_municipio` de la fuente viene errado: Chía sale 23175).
derivados:
  zona: {de: capa, valores: {"14": rural, "7": urbano}}
  municipio_divipola: {de: prefijo, campo: codigo_predial, n: 5}
cobro: punto
canario:
  entrada: {lon: -74.0262, lat: 4.8619}
  verdad: {codigo_predial: "251750000000000050067000000000", zona: rural, municipio_divipola: "25175"}
  campos: [codigo_predial, codigo_predial_anterior, municipio_divipola, zona]
  latencia_max_ms: 5000
