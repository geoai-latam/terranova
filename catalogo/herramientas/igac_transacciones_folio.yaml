id: igac_transacciones_folio
version: 2
familia: territorio
fuente: igac.transacciones_inmobiliarias
pregunta: "¿Qué actos se han registrado sobre este inmueble (por su folio de matrícula)?"
descripcion: >
  Historia registral de un inmueble por su folio de matrícula inmobiliaria (p. ej. 50N-20849403),
  2015 a 2023: cada anotación con su fecha, la naturaleza jurídica del acto (compraventa, hipoteca,
  patrimonio de familia…), el valor si lo trae, el estado del folio, cuántos intervinientes hay de
  cada lado (sin nombres), el municipio, la zona (urbano o rural) y la fecha de apertura del folio.
  (Fuente: IGAC; licencia: CC BY-SA 4.0.)
entrada: {matricula: matricula_inmobiliaria}
consulta:
  operacion: por_codigo
  resultado: lista
  tool: datos_consultar
  argumentos:
    id: 7y2j-43cv
    portal: datos.gov.co
    select: "matricula, num_anotacion, fecha_radica_texto, year_radica, nombre_natujur, cod_natujur, valor, estado_folio, numero_catastral, count_a, count_de, divipola, municipio, departamento, orip, tipo_predio_zona, fecha_apertura_texto"
    where: "matricula = '{matricula}'"
    order: "num_anotacion"
    max_filas: 500
  campos: [matricula, num_anotacion, fecha_radica_texto, year_radica, nombre_natujur, cod_natujur, valor, estado_folio, numero_catastral, count_a, count_de, divipola, municipio, departamento, orip, tipo_predio_zona, fecha_apertura_texto]
salida: TransaccionesFolio
derivados:
  numero_registros: {de: conteo, tipo: int}
avisos:
- cuando: vacio
  texto: >
    El registro de transacciones del IGAC (anotaciones radicadas de 2015 a 2023) no tiene ese folio.
    Puede estar mal escrito (oficina y número, como 50N-20849403), no haber tenido actos
    registrados en esos años o ser de un folio abierto después de 2023.
- cuando: encontrado
  texto: >
    Solo están las anotaciones radicadas de 2015 a 2023: las de antes o después no salen, y puede
    faltar alguna (el folio 50N-20849403, abierto en 2019, empieza en la anotación 2; medido el
    2026-11-05). No es el certificado de tradición.
cobro: registro
canario:
  # Medido el 2026-10-22 en 7y2j-43cv: el folio 50N-20849403 (Chía) tiene 8 anotaciones en 2020; la
  # primera (2) es una compraventa.
  entrada: {matricula: 50N-20849403}
  verdad: {matricula_inmobiliaria: 50N-20849403, anotacion: 2, naturaleza_juridica: COMPRAVENTA}
  minimos: {numero_registros: 8}
  campos: [anio, anotacion, codigo_naturaleza_juridica, departamento, fecha_apertura_folio, fecha_radicacion, matricula_inmobiliaria, municipio, municipio_divipola, naturaleza_juridica, numero_registros, oficina_registro, personas_a, personas_de, zona]
  latencia_max_ms: 15000
