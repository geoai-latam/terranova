id: igac_zona_fisica_en_punto
version: 3
familia: territorio
fuente: igac.catastro.zona_fisica
pregunta: "¿Qué características físicas tiene la zona homogénea del IGAC en este punto?"
descripcion: >
  Zona homogénea física (IGAC) que contiene un punto: su código, área homogénea de tierra,
  disponibilidad de agua, influencia vial, uso actual del suelo, norma de uso (POT) y vigencia (en
  lo urbano, topografía, servicios públicos y tipificación de la construcción). Cada código del
  IGAC llega con su significado al lado (`*_significado`), según el dominio que publica la capa:
  rural y urbana dan otro sentido al mismo número. Un código que el IGAC no define (0, o usos de 17
  en adelante, cerca de 1 de cada 8 zonas rurales) llega con significado vacío. La topografía urbana
  es texto sin uniformar. La vigencia (año del estudio de valores) viene vacía en cerca de 1 de cada 8 zonas rurales (todas las
  rurales de Chía) y va de 1990 a 2026, con fechas imposibles (1899, 4670): un valor de una vigencia
  vieja no es el de hoy. Cubre los municipios con gestión catastral del IGAC; Bogotá,
  Medellín, Cali y otros gestores no están en esta fuente.
  (Fuente: IGAC; licencia: CC BY-SA 4.0.)
entrada: {lon: float, lat: float}
consulta:
  operacion: en_punto
  tool: arcgis_query_features
  capas: [15, 16]  # rural, urbana
  argumentos:
    url: "{url_capa}"
    bbox: ["{lon}", "{lat}", "{lon}", "{lat}"]
    geometria: ninguna
    max_features: 5
  campos: [CODIGO, CODIGO_ZONA_FISICA, AREA_HOMOGENEA_TIERRA, DISPONIBILIDAD_AGUA, TOPOGRAFIA, SERVICIO_PUBLICO, INFLUENCIA_VIAL, USO_ACTUAL_SUELO, NORMA_USO_SUELO, TIPIFICACION_CONSTRUCCION, VIGENCIA]
salida: ZonaFisicaEnPunto
derivados:
  zona: {de: capa, valores: {"15": rural, "16": urbano}}
  municipio_divipola: {de: prefijo, campo: codigo_municipio_zona, n: 5}
  # el nombre, de la tabla DIVIPOLA del DANE: «25175» solo no dice que es Chía
  municipio: {de: codigo, campo: municipio_divipola, valores_lista: divipola_municipios}
cobro: punto
canario:
  entrada: {lon: -74.0262, lat: 4.8619}  # predio rural de Chía; su REGISTRO_2 dice zona física 035
  verdad:
    codigo_zona_fisica: "035"
    area_homogenea_tierra: FH67c
    norma_uso_suelo: "ZJM- Zona Jardín de Uso Múltiple"
    disponibilidad_agua_significado: Suficientes
    influencia_vial_significado: "Buenas 1 - Pavimentada, dos o más vías"
    uso_actual_suelo_significado: Tierras de labor no irrigadas
    zona: rural
    municipio_divipola: "25175"
  campos: [area_homogenea_tierra, codigo_municipio_zona, codigo_zona_fisica, disponibilidad_agua, disponibilidad_agua_significado, influencia_vial, influencia_vial_significado, municipio, municipio_divipola, norma_uso_suelo, uso_actual_suelo, uso_actual_suelo_significado, vigencia, zona]
  latencia_max_ms: 5000
