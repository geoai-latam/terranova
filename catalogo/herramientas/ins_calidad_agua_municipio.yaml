id: ins_calidad_agua_municipio
version: 1
familia: estadisticas
fuente: ins.calidad_agua_irca
pregunta: "¿Es potable el agua en este municipio? (IRCA del INS, año por año)"
descripcion: >
  Índice de riesgo de la calidad del agua para consumo humano (IRCA) de un municipio (DIVIPOLA), año
  por año desde 2007: el índice total (0 a 100, menos es mejor), su nivel de riesgo (sin riesgo, bajo,
  medio, alto o inviable sanitariamente) y el detalle urbano y rural. Es el indicador oficial de
  vigilancia del INS (SIVICAP); «ND» indica que no hubo dato.
  (Fuente: INS; licencia: CC BY-SA 4.0.)
entrada: {municipio_divipola: divipola}
consulta:
  operacion: por_codigo
  resultado: lista
  tool: datos_consultar
  argumentos:
    id: nxt2-39c3
    portal: datos.gov.co
    select: "municipiocodigo, municipio, departamento, a_o, irca, nivel_de_riesgo, ircaurbano, nivel_de_riesgo_urbano, ircarural, nivel_de_riesgo_rural"
    where: "municipiocodigo = '{municipio_divipola}'"
    order: "a_o"
    max_filas: 100
  campos: [municipiocodigo, municipio, departamento, a_o, irca, nivel_de_riesgo, ircaurbano, nivel_de_riesgo_urbano, ircarural, nivel_de_riesgo_rural]
derivados:
  numero_registros: {de: conteo, tipo: int}
salida: CalidadAguaMunicipio
cobro: codigo
canario:
  # Medido el 2026-10-28 en nxt2-39c3: Chía tiene 18 años (2007 a 2024); el primero, 2007, IRCA 6,4
  # «Riesgo bajo».
  entrada: {municipio_divipola: "25175"}
  verdad: {municipio_divipola: "25175", anio: 2007, irca: 6.4, nivel_riesgo: "Riesgo bajo"}
  minimos: {numero_registros: 18}
  campos: [anio, departamento, irca, irca_rural, irca_urbano, municipio, municipio_divipola, nivel_riesgo, nivel_riesgo_rural, nivel_riesgo_urbano, numero_registros]
  latencia_max_ms: 8000
