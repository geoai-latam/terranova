id: invima_medicamento_otros_estados_por_expediente
version: 4
familia: empresas
fuente: invima.cum_otros_estados
pregunta: "¿En qué estado está este medicamento en el INVIMA, si no está vigente?"
descripcion: >
  Presentaciones (CUM) en otros estados (cancelados, suspendidos, negados…) de un medicamento por su expediente en el INVIMA: producto,
  titular, registro sanitario y su estado, consecutivo y estado del CUM, principio activo (una fila por
  cada uno), dosis (p. ej. «2.5 g por AMPOLLA DE 5 ML»), forma farmacéutica, vías (una lista: la fuente repite la presentación por cada vía) y ATC. Las vigentes salen en
  invima_medicamento_por_expediente.
  (Fuente: INVIMA; licencia: CC BY-SA 4.0.)
entrada: {expediente: int}
consulta:
  operacion: por_codigo
  resultado: lista
  tool: datos_consultar
  argumentos:
    portal: datos.gov.co
    id: spzp-dfuc
    select: "distinct expediente, producto, titular, registrosanitario, estadoregistro, fechavencimiento, consecutivocum, descripcioncomercial, estadocum, fechainactivo, principioactivo, concentracion, unidadmedida, cantidad, unidadreferencia, cantidad || ' ' || unidadmedida || ' por ' || unidadreferencia AS dosis, formafarmaceutica, viaadministracion, atc"
    where: "expediente = '{expediente}'"
    order: "consecutivocum, estadocum, principioactivo"
    max_filas: 500
  campos: [expediente, producto, titular, registrosanitario, estadoregistro, fechavencimiento, consecutivocum, descripcioncomercial, estadocum, fechainactivo, principioactivo, concentracion, unidadmedida, cantidad, unidadreferencia, formafarmaceutica, viaadministracion, atc]
  # La fuente repite la presentación por vía (Buscapina: 28 filas para 14 presentaciones).
  juntar: via_administracion
salida: InvimaMedicamentoOtrosEstadosPorExpediente
derivados:
  dosis: {de: columna, campo: dosis, tipo: str}
  numero_registros: {de: conteo, tipo: int}
avisos:
- cuando: vacio
  texto: >
    El expediente no tiene presentaciones en otros estados en el INVIMA. No quiere decir que no exista: el
    INVIMA publica cada estado en un conjunto aparte, y
    invima_medicamento_estado_por_expediente dice en cuál está.
# Fuera del MCP: invima_medicamento_estado_por_expediente mira los cuatro conjuntos y el agente
# no sabía en cuál buscar (revisión de valor). Sigue en REST.
en_mcp: false
cobro: registro
canario:
  # Medido el 2026-10-22 en spzp-dfuc: el expediente 3277 tiene 8 filas distintas; la primera
  # (consecutivo 1) es HIDERAX S® 50 MG.
  entrada: {expediente: 3277}
  verdad: {expediente: 3277, consecutivo_cum: 1, titular: "LABORATORIO FRANCO COLOMBIANO - LAFRANCOL S.A.S.", registro_sanitario: "INVIMA 2016M-001830-R2"}
  minimos: {numero_registros: 8}
  campos: [atc, cantidad, concentracion, consecutivo_cum, dosis, estado_cum, estado_registro, expediente, fecha_inactivo, fecha_vencimiento, forma_farmaceutica, numero_registros, presentacion, principio_activo, producto, registro_sanitario, titular, unidad_medida, unidad_referencia, via_administracion]
  latencia_max_ms: 10000
