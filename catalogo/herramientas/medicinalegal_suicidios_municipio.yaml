id: medicinalegal_suicidios_municipio
version: 1
familia: justicia
fuente: medicinalegal.suicidios
pregunta: "¿Cuántos suicidios hubo en este municipio en el año, según Medicina Legal?"
descripcion: >
  Presuntos suicidios en un municipio (DIVIPOLA) y un año, de 2015 a 2024, según las
  necropsias de Medicina Legal: víctimas por sexo y mecanismo causal. Solo conteos, nunca el
  registro de una persona. Son cifras forenses, distintas de las denuncias de la Policía.
  (Fuente: Medicina Legal; licencia: CC BY-SA 4.0.)
entrada: {municipio_divipola: divipola, anio: int}
consulta:
  operacion: por_codigo
  resultado: lista
  tool: datos_consultar
  argumentos:
    id: f75u-mirk
    portal: datos.gov.co
    select: "sexo_de_la_victima, mecanismo_causal_de_la_lesion_fatal, count(*) AS casos"
    where: "codigo_dane_municipio::number = {municipio_divipola} AND a_o_del_hecho = '{anio}'"
    group: "sexo_de_la_victima, mecanismo_causal_de_la_lesion_fatal"
    order: "sexo_de_la_victima, mecanismo_causal_de_la_lesion_fatal"
    max_filas: 200
  campos: [codigo_dane_municipio, a_o_del_hecho, sexo_de_la_victima, mecanismo_causal_de_la_lesion_fatal]
salida: MedicinalegalSuicidiosMunicipio
derivados:
  casos: {de: columna, campo: casos, tipo: int}
  total_casos: {de: suma, campo: casos, tipo: int}
cobro: agregado
canario:
  # Medido el 2026-10-23 en f75u-mirk: Chía 2024, 15 víctimas; el primer grupo tiene 9.
  entrada: {municipio_divipola: "25175", anio: 2024}
  verdad: {sexo: "Hombre", mecanismo: "Generadores de asfixia", casos: 9}
  minimos: {total_casos: 15}
  campos: [casos, mecanismo, sexo, total_casos]
  latencia_max_ms: 10000
