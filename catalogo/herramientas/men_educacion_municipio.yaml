id: men_educacion_municipio
version: 2
familia: estadisticas
fuente: men.educacion_municipio
pregunta: "¿Cómo va la educación básica y media en este municipio: cobertura, deserción, aprobación?"
descripcion: >
  Indicadores de educación preescolar, básica y media (MinEducación) de un municipio, año por año desde
  2011: población de 5 a 16 años, tasa de matriculación, cobertura neta y bruta, deserción,
  aprobación, reprobación y repitencia (en %).
  El año más reciente va primero, y arriba su cobertura neta y su deserción.
  (Fuente: MinEducación; licencia: CC BY-SA 4.0.)
entrada: {municipio_divipola: divipola}
consulta:
  operacion: por_codigo
  resultado: lista
  tool: datos_consultar
  argumentos:
    id: nudc-7mev
    portal: datos.gov.co
    select: "a_o, c_digo_municipio, municipio, poblaci_n_5_16, tasa_matriculaci_n_5_16, cobertura_neta, cobertura_bruta, deserci_n, aprobaci_n, reprobaci_n, repitencia"
    where: "c_digo_municipio = '{municipio_divipola}'"
    order: "a_o DESC"
    max_filas: 100
  campos: [a_o, c_digo_municipio, municipio, poblaci_n_5_16, tasa_matriculaci_n_5_16, cobertura_neta, cobertura_bruta, deserci_n, aprobaci_n, reprobaci_n, repitencia]
salida: EducacionPorMunicipio
derivados:
  ultimo_anio: {de: primero, campo: anio, tipo: int}
  cobertura_neta_ultimo_anio: {de: primero, campo: cobertura_neta, tipo: float}
  desercion_ultimo_anio: {de: primero, campo: desercion, tipo: float}
  numero_registros: {de: conteo, tipo: int}
avisos:
- cuando: encontrado
  texto: >
    Una cobertura de más de 100 % es posible y no es un error: el denominador es la población de 5
    a 16 años que proyecta el DANE, y en el lugar estudian niños que viven en otro, o la proyección
    quedó corta. La bruta cuenta además a quienes están en un grado que no es el de su edad. En 2024,
    94 de 1 122 municipios pasan de 100 % en la neta y 281 en la bruta.
cobro: registro
canario:
  # Medido el 2026-11-02 en nudc-7mev: Chía 2024, cobertura neta 107,03 %, deserción 3,36 %.
  entrada: {municipio_divipola: "25175"}
  verdad: {anio: 2024, municipio: Chía, cobertura_neta: 107.03, desercion: 3.36, ultimo_anio: 2024, cobertura_neta_ultimo_anio: 107.03, desercion_ultimo_anio: 3.36}
  campos: [anio, aprobacion, cobertura_bruta, cobertura_neta, cobertura_neta_ultimo_anio, desercion, desercion_ultimo_anio, municipio, municipio_divipola, numero_registros, poblacion_5_16, repitencia, reprobacion, tasa_matriculacion_5_16, ultimo_anio]
  latencia_max_ms: 10000
