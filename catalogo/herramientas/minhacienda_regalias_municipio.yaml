id: minhacienda_regalias_municipio
version: 1
familia: estadisticas
fuente: minhacienda.regalias_ejecucion
pregunta: "¿Cuánta plata de regalías tiene presupuestada este municipio y cuánta ha aprobado en proyectos?"
descripcion: >
  Presupuesto de inversión del Sistema General de Regalías de un municipio (DIVIPOLA) en el bienio
  vigente, por fondo o asignación: presupuesto, proyectos aprobados y recursos aprobados en pesos.
  Solo el bienio en curso: el anterior no se publica aquí. Es la plata que el municipio tiene para
  invertir; las regalías que se causan por producir petróleo y gas (liquidación de la ANH) están en
  anh_regalias_municipio y anh_regalias_campo.
  (Fuente: MinHacienda; licencia: CC BY-SA 4.0.)
entrada: {municipio_divipola: divipola}
consulta:
  operacion: por_codigo
  resultado: lista
  tool: datos_consultar
  argumentos:
    id: g4qj-2p2e
    portal: datos.gov.co
    select: "vigencia, nombrefondo, presupuestosgrinversion AS presupuesto, numeroproyectosaprobados AS proyectos_aprobados, recursosaprobadosasignadosspgr AS recursos_aprobados"
    where: "codigodaneentidad = '{municipio_divipola}'"
    order: "vigencia, nombrefondo"
    max_filas: 100
  campos: [vigencia, nombrefondo, codigodaneentidad, presupuestosgrinversion, numeroproyectosaprobados, recursosaprobadosasignadosspgr]
salida: RegaliasMunicipio
derivados:
  presupuesto: {de: columna, campo: presupuesto, tipo: float}
  proyectos_aprobados: {de: columna, campo: proyectos_aprobados, tipo: int}
  recursos_aprobados: {de: columna, campo: recursos_aprobados, tipo: float}
  presupuesto_total: {de: suma, campo: presupuesto, tipo: float}
  recursos_aprobados_total: {de: suma, campo: recursos_aprobados, tipo: float}
  proyectos_aprobados_total: {de: suma, campo: proyectos_aprobados, tipo: int}
avisos:
- cuando: vacio
  texto: >
    MinHacienda no publica presupuesto de inversión del Sistema General de Regalías para ese código
    DIVIPOLA en el bienio en curso. Revise que sea el del municipio (5 dígitos). Solo sale el bienio
    vigente: el anterior no está en este conjunto.
- cuando: encontrado
  texto: >
    Es el bienio en curso, con lo aprobado hasta la última actualización del conjunto: los recursos
    aprobados suben a medida que se aprueban proyectos. recursos_aprobados_total y
    proyectos_aprobados_total suman todos los fondos. Un fondo puede tener presupuesto 0 y recursos
    aprobados, como ASIGNACIONES PARA LA PAZ en Tauramena.
cobro: registro
canario:
  # Medido el 2026-10-23 en g4qj-2p2e: Chía, Vigencia 2025 - 2026, ASIGNACIONES DIRECTAS: $106027949.00.
  # Cambia con el bienio (2027): entonces se vuelve a medir.
  entrada: {municipio_divipola: "25175"}
  verdad: {vigencia: "Vigencia 2025 - 2026", fondo: "ASIGNACIONES DIRECTAS"}
  minimos: {presupuesto_total: 1}
  campos: [fondo, presupuesto, presupuesto_total, proyectos_aprobados, proyectos_aprobados_total, recursos_aprobados, recursos_aprobados_total, vigencia]
  latencia_max_ms: 10000
