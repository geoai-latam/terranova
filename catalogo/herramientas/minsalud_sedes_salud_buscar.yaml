id: minsalud_sedes_salud_buscar
version: 1
familia: territorio
fuente: minsalud.sedes_prestadores
pregunta: "¿Dónde queda este hospital o esta IPS?"
descripcion: >
  Busca sedes de prestadores de salud por código de habilitación, nombre del prestador o de la
  sede, dirección, municipio o departamento, y devuelve cada una con su punto, naturaleza
  jurídica, si es ESE (hospital público), nivel de atención, zona, fecha del corte y cómo se
  ubicó el punto. Para las sedes de un lugar, minsalud_sedes_salud_en_zona. Sale de la copia de
  Terrnova del SISPRO (corte del REPS de 2023). (Fuente: Ministerio de Salud y Protección
  Social, SISPRO; licencia: dato público reutilizable.)
entrada: {texto: str}  # va como parámetro de plainto_tsquery, nunca dentro del SQL
consulta:
  operacion: buscar
  tool: consultar_copia
  argumentos:
    tabla: minsalud_sedes_prestadores
    texto: "{texto}"
    select: [OBJECTID, CodigoHabilitacion, CodigoPrestador, NombrePrestador, Nombre, TipoSede, ClaseDePrestador, NaturalezaJuridica, TipoPersona, Ese, NivelAtencion, CaracterTerritorial, TipoZona, Direccion, CentroPoblado, CodigoDepartamento, NOM_DPTO, CodigoMunicipio, NOM_MPIO, URL, FechaREPS, MetodoUbicacion]
    geometria: completa
    order: [CodigoHabilitacion]
    limite: 100
  campos: [OBJECTID, CodigoHabilitacion, CodigoPrestador, NombrePrestador, Nombre, TipoSede, ClaseDePrestador, NaturalezaJuridica, TipoPersona, Ese, NivelAtencion, CaracterTerritorial, TipoZona, Direccion, CentroPoblado, CodigoDepartamento, NOM_DPTO, CodigoMunicipio, NOM_MPIO, URL, FechaREPS, MetodoUbicacion]
salida: MinsaludSedesSaludBuscar
derivados:
  total: {de: completitud_total, tipo: int}
avisos:
- cuando: vacio
  texto: >
    El REPS georreferenciado del SISPRO (corte de 2023) no trae sedes de prestadores de salud
    para esa consulta. Pruebe con un rectángulo más grande, otro código DIVIPOLA o una parte del
    nombre.
- cuando: encontrado
  texto: >
    Es el REPS georreferenciado del SISPRO con corte de 2023 (fecha_reps): sedes abiertas o
    cerradas después no se reflejan. Mire metodo_ubicacion: 620 sedes están en el centroide del
    municipio, no donde queda la sede. El servicio no declara licencia: es dato público del
    Ministerio de Salud, que se usa con la atribución.
cobro: agregado
canario:
  # Medido el 2026-11-05 en la copia: «Hospital San Vicente» da 68 sedes.
  entrada: {texto: "Hospital San Vicente"}
  minimos: {total: 68}
  campos: [caracter_territorial, caracter_territorial_significado, centro_poblado, clase_prestador, clase_prestador_significado, codigo_habilitacion, codigo_prestador, contacto, departamento, departamento_divipola, direccion, es_ese, es_ese_significado, fecha_reps, id_elemento, metodo_ubicacion, metodo_ubicacion_significado, municipio, municipio_divipola, naturaleza_juridica, naturaleza_juridica_significado, nivel_atencion, nivel_atencion_significado, prestador, sede, tipo_persona, tipo_persona_significado, tipo_sede, tipo_sede_significado, total, zona, zona_significado]
  latencia_max_ms: 8000
