id: pnn_areas_protegidas_en_punto
version: 1
familia: ambiente
fuente: pnn.runap
pregunta: "¿Qué áreas protegidas del RUNAP contienen este punto?"
descripcion: >
  Áreas protegidas inscritas en el RUNAP que contienen un punto: nombre, categoría de manejo,
  autoridad ambiental, área según el acto y fecha de inscripción. Cubre todo el país y todas las
  categorías del SINAP (nacionales, regionales y reservas de la sociedad civil inscritas); un área
  declarada que aún no esté inscrita no aparece. Puede devolver varias si se traslapan.
  Sale de la copia de Terranova (se rehace cada dos semanas): la procedencia dice de cuándo es.
  (Fuente: PNN; licencia: CC BY-SA 4.0.)
entrada: {lon: float, lat: float}
consulta:
  operacion: en_punto
  tool: consultar_copia
  argumentos:
    tabla: runap
    punto: ["{lon}", "{lat}"]
    select: [ap_nombre, ap_categoria, organizacion, area_ha_total_resolucion, fecha_inscrita]
    geometria: simplificada
    order: [ap_nombre]
    limite: 20
  campos: [ap_nombre, ap_categoria, organizacion, area_ha_total_resolucion, fecha_inscrita]
salida: AreasProtegidasEnPunto
creditos: 10
canario:
  # PNN Chingaza; medido el 2026-10-21 en la capa 0 (punto, esriSpatialRelIntersects), 0,6 s.
  entrada: {lon: -73.75, lat: 4.55}
  verdad: {nombre: Chingaza, categoria: Parque Nacional Natural}
  campos: [area_ha_resolucion, autoridad_ambiental, categoria, fecha_inscripcion, nombre]
  latencia_max_ms: 5000
