id: policia_abigeato_pirateria_municipio
version: 1
familia: justicia
fuente: policia.abigeato_pirateria
pregunta: "¿Cuántos robos de ganado o de carga hubo en este municipio en el año?"
descripcion: >
  Casos de abigeato y piratería terrestre reportados por la Policía Nacional en un municipio (DIVIPOLA) y un año: casos
  por tipo y género de la víctima. Son denuncias: no todos los delitos se denuncian, y el año en
  curso está incompleto.
  (Fuente: Policía Nacional; licencia: CC BY-SA 4.0.)
entrada: {municipio_divipola: divipola, anio: int}
consulta:
  operacion: por_codigo
  resultado: lista
  tool: datos_consultar
  argumentos:
    id: d4fr-sbn2
    portal: datos.gov.co
    select: "tipo_de_hurto, genero, sum(cantidad::number) AS casos"
    where: "codigo_dane = '{municipio_divipola}000' AND fecha_hecho like '%/{anio}'"
    group: "tipo_de_hurto, genero"
    order: "tipo_de_hurto, genero"
    max_filas: 200
  campos: [codigo_dane, fecha_hecho, tipo_de_hurto, genero, cantidad]
salida: PoliciaAbigeatoPirateriaMunicipio
derivados:
  casos: {de: columna, campo: casos, tipo: int}
  total_casos: {de: suma, campo: casos, tipo: int}
creditos: 2
canario:
  # Medido el 2026-10-23 en d4fr-sbn2: Chía 2024 suma 3 casos; el primer grupo tiene 3.
  entrada: {municipio_divipola: "25175", anio: 2024}
  verdad: {genero: "MASCULINO", casos: 3, tipo: "HURTO ABIGEATO"}
  minimos: {total_casos: 3}
  campos: [casos, genero, tipo, total_casos]
  latencia_max_ms: 10000
