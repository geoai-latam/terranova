id: policia_delitos_sexuales_municipio
version: 1
familia: justicia
fuente: policia.delitos_sexuales
pregunta: "¿Cuántos delitos sexuales se denunciaron en este municipio en el año?"
descripcion: >
  Delitos sexuales reportados por la Policía Nacional en un municipio (DIVIPOLA) y un año: casos
  por tipo y género de la víctima. Son denuncias: no todos los delitos se denuncian, y el año en
  curso está incompleto.
  (Fuente: Policía Nacional; licencia: CC BY-SA 4.0.)
entrada: {municipio_divipola: divipola, anio: int}
consulta:
  operacion: por_codigo
  resultado: lista
  tool: datos_consultar
  argumentos:
    id: fpe5-yrmw
    portal: datos.gov.co
    select: "delito, genero, sum(cantidad::number) AS casos"
    where: "codigo_dane = '{municipio_divipola}000' AND fecha_hecho like '%/{anio}'"
    group: "delito, genero"
    order: "delito, genero"
    max_filas: 200
  campos: [codigo_dane, fecha_hecho, delito, genero, cantidad]
salida: PoliciaDelitosSexualesMunicipio
derivados:
  casos: {de: columna, campo: casos, tipo: int}
  total_casos: {de: suma, campo: casos, tipo: int}
cobro: agregado
canario:
  # Medido el 2026-10-23 en fpe5-yrmw: Chía 2024 suma 63 casos; el primer grupo tiene 8.
  entrada: {municipio_divipola: "25175", anio: 2024}
  verdad: {genero: "FEMENINO", casos: 8, tipo: "ARTÍCULO 205. ACCESO CARNAL VIOLENTO"}
  minimos: {total_casos: 63}
  campos: [casos, genero, tipo, total_casos]
  latencia_max_ms: 10000
