id: presidencia_victimas_minas_municipio
version: 2
familia: justicia
fuente: presidencia.victimas_minas
pregunta: "¿Cuántas víctimas de minas antipersonal ha tenido este municipio, y cuántas murieron?"
descripcion: >
  Víctimas de minas antipersonal y munición sin explosionar en un municipio (DIVIPOLA), de 1990 a
  2023, según Descontamina Colombia: por año (del más reciente al más viejo), condición (civil o
  fuerza pública) y resultado (herido o muerto), con el total, los muertos, los civiles y el último
  año con víctimas. Solo conteos. El CNMH cuenta lo mismo con su propia tipología
  (cnmh_minas_municipio) y las cifras no cuadran (Granada: 78 aquí, 66 allá): son registros
  distintos; cite la fuente que use.
  (Fuente: Presidencia de la República, Descontamina Colombia; licencia: CC BY-SA 4.0.)
entrada: {municipio_divipola: divipola}
consulta:
  operacion: por_codigo
  resultado: lista
  tool: datos_consultar
  argumentos:
    id: yhxn-eqqw
    portal: datos.gov.co
    select: "ano, condicion, genero, count(*) AS victimas"
    where: "codigodanemunicipio = {municipio_divipola}"
    group: "ano, condicion, genero"
    order: "ano DESC, condicion, genero"
    max_filas: 500
  campos: [codigodanemunicipio, ano, condicion, genero]
salida: VictimasMinasMunicipio
derivados:
  victimas: {de: columna, campo: victimas, tipo: int}
  total_victimas: {de: suma, campo: victimas, tipo: int}
  total_muertos: {de: suma, campo: victimas, tipo: int, solo_si: {campo: resultado, valores: [Muerto]}}
  total_civiles: {de: suma, campo: victimas, tipo: int, solo_si: {campo: condicion, valores: [Civil]}}
  ultimo_anio: {de: primero, campo: anio, tipo: int}
avisos:
- cuando: vacio
  texto: >
    Descontamina Colombia no registra víctimas de minas antipersonal ni de munición sin explosionar
    en ese municipio entre 1990 y 2023. Es la falta de registro en esta fuente, no la prueba de que
    no hubo minas: el CNMH lleva su propio registro (cnmh_minas_municipio) y la fuente no trae nada
    posterior a 2023.
cobro: agregado
canario:
  # Medido el 2026-11-03 en yhxn-eqqw (no cambia desde 2024-01-19): Granada, Antioquia (05313; prueba
  # el cero inicial), 78 víctimas, 20 muertas, 42 civiles; la última, en 2011.
  entrada: {municipio_divipola: "05313"}
  verdad: {anio: 2011, condicion: "Civil", resultado: "Herido", victimas: 1, total_muertos: 20, total_civiles: 42, ultimo_anio: 2011}
  minimos: {total_victimas: 78}
  campos: [anio, condicion, resultado, total_civiles, total_muertos, total_victimas, ultimo_anio, victimas]
  latencia_max_ms: 10000
