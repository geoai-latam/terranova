id: rues_empresa_por_nit
version: 1
familia: empresas
fuente: confecamaras.rues
pregunta: "¿Qué dice el RUES de la empresa con este NIT?"
descripcion: >
  Matrícula mercantil en el RUES de una persona jurídica o entidad sin ánimo de lucro por su NIT
  (sin dígito de verificación): razón social, cámara, matrícula, organización jurídica, estado,
  fechas, último año renovado y CIIU. Las personas naturales no se consultan.
  Si no tiene el NIT, búsquelo por el nombre con rues_empresas_buscar; no lo suponga. (Fuente: Confecámaras; licencia: CC BY-SA 4.0.)
entrada: {nit: int}
consulta:
  operacion: por_codigo
  resultado: lista
  tool: datos_consultar
  argumentos:
    id: c82u-588k
    portal: datos.gov.co
    select: "nit, digito_verificacion, razon_social, sigla, camara_comercio, matricula, organizacion_juridica, tipo_sociedad, categoria_matricula, estado_matricula, fecha_matricula, ultimo_ano_renovado, fecha_cancelacion, cod_ciiu_act_econ_pri, cod_ciiu_act_econ_sec"
    where: "nit = '{nit}' AND organizacion_juridica != 'PERSONA NATURAL'"
    order: "camara_comercio, matricula"
    max_filas: 200
  campos: [nit, digito_verificacion, razon_social, sigla, camara_comercio, matricula, organizacion_juridica, tipo_sociedad, categoria_matricula, estado_matricula, fecha_matricula, ultimo_ano_renovado, fecha_cancelacion, cod_ciiu_act_econ_pri, cod_ciiu_act_econ_sec]
salida: EmpresaPorNit
creditos: 5
canario:
  # Medido el 2026-10-22 en c82u-588k: Ecopetrol, matrícula 1291197 de Bogotá.
  entrada: {nit: 899999068}
  verdad: {razon_social: "ECOPETROL S A", matricula: "1291197", organizacion_juridica: SOCIEDAD ANONIMA, estado_matricula: ACTIVA}
  campos: [camara_comercio, categoria_matricula, ciiu_principal, ciiu_secundaria, digito_verificacion, estado_matricula, fecha_matricula, matricula, nit, organizacion_juridica, razon_social, tipo_sociedad, ultimo_ano_renovado]
  latencia_max_ms: 15000
