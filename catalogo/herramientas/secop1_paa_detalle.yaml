id: secop1_paa_detalle
version: 1
familia: contratacion
fuente: cce.secop1.paa_detalle
pregunta: "¿Qué piensa comprar esta entidad según su plan anual de adquisiciones en SECOP I?"
descripcion: >
  Ítems de un plan anual de adquisiciones de SECOP I por su identificador (id_paa, que da
  secop1_paa_entidad): código UNSPSC, descripción, fecha de inicio, duración, modalidad, fuente de
  los recursos y valor estimado.
  (Fuente: Colombia Compra Eficiente; licencia: CC BY-SA 4.0.)
entrada: {id_paa: int}
consulta:
  operacion: por_codigo
  resultado: lista
  tool: datos_consultar
  argumentos:
    id: azeg-sgqg
    portal: datos.gov.co
    select: "idpaa, id, codigo_unspsc, descripcio_item, fecha_inicio, duracion_estimada, modalidad, fuente_de_recursos, valor_estimado, valor_estimado_vig_actual, requiere_vigencias_futuras"
    where: "idpaa = {id_paa}"
    order: "id"
    max_filas: 1000
  campos: [idpaa, id, codigo_unspsc, descripcio_item, fecha_inicio, duracion_estimada, modalidad, fuente_de_recursos, valor_estimado, valor_estimado_vig_actual, requiere_vigencias_futuras]
salida: Secop1PaaDetalle
derivados:
  numero_registros: {de: conteo, tipo: int}
cobro: registro
canario:
  # Medido el 2026-11-02 directamente en azeg-sgqg (idpaa = 352782): 260 registros; el primero con
  # el orden de la ficha da la verdad. El plan del canario anterior (372838, medido el 2026-10-22)
  # desapareció cuando la fuente se republicó el 2026-11-02: un plan puede salir del conjunto.
  entrada: {id_paa: 352782}
  verdad: {id_paa: "352782", id_item: "41236380"}
  minimos: {numero_registros: 260}
  campos: [codigo_unspsc, descripcion, duracion, fecha_inicio, fuente_recursos, id_item, id_paa, modalidad, numero_registros, valor_estimado, valor_vigencia_actual, vigencias_futuras]
  latencia_max_ms: 10000
