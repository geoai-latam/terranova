id: secop_adiciones_contrato
version: 1
familia: contratacion
fuente: cce.secop2.adiciones
pregunta: "¿Qué adiciones tuvo este contrato de SECOP II?"
descripcion: >
  Adiciones (cambios registrados) de un contrato de SECOP II por su identificador (CO1.PCCNTR.…), uno por elemento.
  (Fuente: Colombia Compra Eficiente; licencia: CC BY-SA 4.0.)
entrada: {id_contrato: id_secop}
consulta:
  operacion: por_codigo
  resultado: lista
  tool: datos_consultar
  argumentos:
    portal: datos.gov.co
    id: cb9c-h8sn
    select: "id_contrato, identificador, tipo, descripcion, fecharegistro"
    where: "id_contrato = '{id_contrato}'"
    order: "fecharegistro, identificador"
    max_filas: 1000
  campos: [id_contrato, identificador, tipo, descripcion, fecharegistro]
salida: SecopAdicionesContrato
derivados:
  numero_registros: {de: conteo, tipo: int}
creditos: 5
canario:
  # Medido el 2026-10-22: contrato de Pitalito terminado en 2023; los registros solo crecen.
  entrada: {id_contrato: CO1.PCCNTR.3712964}
  verdad: {id_contrato: CO1.PCCNTR.3712964}
  minimos: {numero_registros: 16}
  campos: [descripcion, fecha_registro, id_adicion, id_contrato, numero_registros, tipo]
  latencia_max_ms: 10000
