id: secop_contrato_por_id
version: 2
familia: contratacion
fuente: cce.secop2.contratos
pregunta: "¿Qué dice este contrato de SECOP II?"
descripcion: >
  Un contrato de SECOP II por su identificador (CO1.PCCNTR.…): quién lo firmó y con quién (entidad
  contratante y contratista), por cuánto (valor, facturado, pagado y pendiente de pago), con qué
  dinero (PGN, SGP, regalías, recursos propios o crédito) y si es inversión o funcionamiento, objeto, tipo y modalidad, fechas de
  firma, inicio y fin, estado y enlace al proceso. Es la ficha del contrato; sus pagos,
  modificaciones o adiciones tienen herramientas aparte. Del contratista salen el nombre, el tipo y el número de documento como los publica la
  fuente (ADR-0025); nunca sus datos de contacto.
  (Fuente: Colombia Compra Eficiente; licencia: CC BY-SA 4.0.)
entrada: {id_contrato: id_secop}
consulta:
  operacion: por_codigo
  tool: datos_consultar
  argumentos:
    id: jbjy-vk9h
    portal: datos.gov.co
    select: "id_contrato, referencia_del_contrato, proceso_de_compra, nombre_entidad, nit_entidad, departamento, ciudad, tipodocproveedor, documento_proveedor, proveedor_adjudicado, objeto_del_contrato, tipo_de_contrato, modalidad_de_contratacion, estado_contrato, valor_del_contrato, valor_pagado, valor_facturado, valor_pendiente_de_pago, valor_pendiente_de_ejecucion, valor_de_pago_adelantado, dias_adicionados, duraci_n_del_contrato, destino_gasto, origen_de_los_recursos, sector, orden, codigo_de_categoria_principal, presupuesto_general_de_la_nacion_pgn, sistema_general_de_participaciones, sistema_general_de_regal_as, recursos_propios_alcald_as_gobernaciones_y_resguardos_ind_genas_, recursos_de_credito, recursos_propios, fecha_de_firma, fecha_de_inicio_del_contrato, fecha_de_fin_del_contrato, ultima_actualizacion, urlproceso"
    where: "id_contrato = '{id_contrato}'"
    max_filas: 2  # si vinieran dos, la puerta lo dice: el id debería ser único
  campos: [id_contrato, referencia_del_contrato, proceso_de_compra, nombre_entidad, nit_entidad, departamento, ciudad, tipodocproveedor, documento_proveedor, proveedor_adjudicado, objeto_del_contrato, tipo_de_contrato, modalidad_de_contratacion, estado_contrato, valor_del_contrato, valor_pagado, valor_facturado, valor_pendiente_de_pago, valor_pendiente_de_ejecucion, valor_de_pago_adelantado, dias_adicionados, duraci_n_del_contrato, destino_gasto, origen_de_los_recursos, sector, orden, codigo_de_categoria_principal, presupuesto_general_de_la_nacion_pgn, sistema_general_de_participaciones, sistema_general_de_regal_as, recursos_propios_alcald_as_gobernaciones_y_resguardos_ind_genas_, recursos_de_credito, recursos_propios, fecha_de_firma, fecha_de_inicio_del_contrato, fecha_de_fin_del_contrato, ultima_actualizacion, urlproceso]
salida: ContratoSecop
cobro: registro
