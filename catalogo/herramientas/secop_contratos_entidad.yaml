id: secop_contratos_entidad
version: 3
familia: contratacion
fuente: cce.secop2.contratos
pregunta: "¿Cuántos contratos firmó esta entidad estatal en SECOP II cada año y por cuánto?"
descripcion: >
  Contratos de SECOP II de una entidad estatal por su NIT (sin dígito de verificación), por año de
  firma y entidad: número de contratos, valor total en pesos y la fecha de la última firma, del año
  más reciente al más viejo. Un NIT puede cubrir varias entidades (la alcaldía, la personería y el
  concejo de un municipio suelen compartirlo): cada fila dice de cuál es, y no se deben sumar como
  si fueran una. El año en curso va hasta `ultima_firma`. Una fila sin `anio` son los contratos sin
  fecha de firma en la fuente. Solo SECOP II; para SECOP I junto, usa
  secop_integrado_contratos_entidad.
  Si no tiene el NIT de la entidad, búsquelo con secop_entidades_municipio; no lo suponga.
  Los contratos de 20 billones o más no suman: son errores de digitación de la fuente (uno de
  Medellín dice 440 000 billones) y `contratos_valor_atipico` dice cuántos hubo.
  (Fuente: Colombia Compra Eficiente; licencia: CC BY-SA 4.0.)
entrada: {nit_entidad: int}
consulta:
  operacion: por_codigo
  resultado: lista
  tool: datos_consultar
  argumentos:
    portal: datos.gov.co
    id: jbjy-vk9h
    # un NIT cubre varias entidades (Chía: alcaldía y personería; Pitalito: también el concejo). Con
    # max(nombre_entidad) la personería, que gana en orden alfabético, se llevaba los contratos de la
    # alcaldía: se agrupa por nombre.
    select: "date_extract_y(fecha_de_firma) AS anio, nombre_entidad AS entidad, max(fecha_de_firma) AS ultima_firma, count(*) AS contratos, sum(case(valor_del_contrato < 20000000000000, valor_del_contrato, true, 0)) AS valor_total, sum(case(valor_del_contrato >= 20000000000000, 1, true, 0)) AS contratos_valor_atipico"
    where: "nit_entidad = '{nit_entidad}'"
    group: "anio, nombre_entidad"
    order: "anio DESC NULL LAST, contratos DESC"
    max_filas: 100
  campos: [nit_entidad, nombre_entidad, fecha_de_firma, valor_del_contrato]
salida: ContratosEntidad
derivados:
  entidad: {de: columna, campo: entidad, tipo: str}
  anio: {de: columna, campo: anio, tipo: int}
  ultima_firma: {de: columna, campo: ultima_firma, tipo: date}
  contratos: {de: columna, campo: contratos, tipo: int}
  valor_total: {de: columna, campo: valor_total, tipo: float}
  contratos_valor_atipico: {de: columna, campo: contratos_valor_atipico, tipo: int}
cobro: agregado
canario:
  # Medido el 2026-11-02 en jbjy-vk9h: el NIT 891180077 cubre el Municipio, la Personería y el Concejo
  # de Pitalito. La primera fila es el año en curso del Municipio (2026: 777 contratos, Concejo 12,
  # Personería 7). Antes de agruparse por nombre, 2021-2026 salían a nombre de la Personería: la
  # verdad vigila eso. 2018 (cerrado) es solo del Municipio: 14 contratos, $2 654 592 160.
  entrada: {nit_entidad: 891180077}
  verdad: {entidad: "MUNICIPIO DE PITALITO"}
  minimos: {anio: 2026}
  campos: [anio, contratos, contratos_valor_atipico, entidad, ultima_firma, valor_total]
  latencia_max_ms: 10000
