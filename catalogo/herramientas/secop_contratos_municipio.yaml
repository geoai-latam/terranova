id: secop_contratos_municipio
version: 3
familia: contratacion
fuente: cce.secop2.contratos
pregunta: "¿Cuántos contratos ha firmado el Estado en este municipio y por cuánto?"
descripcion: >
  CUÁNTOS contratos de SECOP II y por CUÁNTO (valor total en pesos) en un municipio: el conteo y la
  suma de las entidades estatales con sede en ese municipio (nombre del municipio y del departamento,
  como los escribe SECOP, con tildes). Cuenta todos los años y estados; no incluye SECOP I. El
  municipio es el de la entidad contratante, no el de ejecución. Es un conteo por municipio, NO una
  búsqueda de texto; para buscar contratos por palabras de su objeto usa secop_contratos_buscar.
  Los contratos de 20 billones o más no suman: son errores de digitación de la fuente (uno de
  Medellín dice 440 000 billones) y `contratos_valor_atipico` dice cuántos hubo.
  (Fuente: Colombia Compra Eficiente; licencia: CC BY-SA 4.0.)
entrada: {municipio: nombre, departamento: nombre}
consulta:
  operacion: buscar
  resultado: uno
  tool: datos_consultar
  argumentos:
    id: jbjy-vk9h
    portal: datos.gov.co
    # agregado sin $group (el conector no lo acepta): una sola fila con los dos alias
    select: "count(*) as contratos, sum(case(valor_del_contrato < 20000000000000, valor_del_contrato, true, 0)) as valor_total, sum(case(valor_del_contrato >= 20000000000000, 1, true, 0)) as contratos_valor_atipico"
    # sin distinguir mayúsculas: el agente copia «CHÍA» de DIVIPOLA y SECOP escribe «Chía»
    where: "upper(ciudad) = upper('{municipio}') AND upper(departamento) = upper('{departamento}')"
    # 2 y no 1: con 1, la única fila llegaba al tope y todo salía con «no se sabe si vino todo»
    max_filas: 2
  campos: [ciudad, departamento, valor_del_contrato]
salida: ContratosMunicipio
# Los dos alias del `select`: la puerta los pasa tal cual (no son columnas de la fuente).
derivados:
  contratos: {de: columna, campo: contratos, tipo: int}
  valor_total: {de: columna, campo: valor_total, tipo: float}
  contratos_valor_atipico: {de: columna, campo: contratos_valor_atipico, tipo: int}
avisos:
  - cuando: encontrado
    si: {campo: contratos, valores: ["0"]}
    texto: >-
      Cero contratos con ese municipio y departamento. SECOP los escribe con tildes, como DIVIPOLA
      («Chía», «Cundinamarca»; Bogotá va con «Distrito Capital de Bogotá»): «Chia» sin tilde da
      cero aunque Chía tenga más de 12 000. Antes de decir que no hubo contratos, confirme el
      nombre con secop_entidades_municipio.
cobro: agregado
canario:
  # Medido el 2026-10-21 (22:16 hora de Colombia) en https://www.datos.gov.co/resource/jbjy-vk9h.json
  # ?$select=count(*) as contratos, sum(valor_del_contrato) as valor_total
  # &$where=ciudad='Chía' AND departamento='Cundinamarca' (0,8 s): 12 149 contratos,
  # $1 289 946 058 879,80. ESTADO.md tenía 12 147 y $1,29 billones. El total crece cada día: la
  # verdad es un mínimo, no un valor exacto.
  entrada: {municipio: Chía, departamento: Cundinamarca}
  minimos: {contratos: 12149, valor_total: 1289946058879.80}
  campos: [contratos, contratos_valor_atipico, valor_total]
  latencia_max_ms: 10000
