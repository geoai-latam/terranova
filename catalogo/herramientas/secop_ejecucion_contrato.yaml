id: secop_ejecucion_contrato
version: 1
familia: contratacion
fuente: cce.secop2.ejecucion
pregunta: "¿Cómo va la ejecución de este contrato de SECOP II?"
descripcion: >
  CÓMO VA un contrato de SECOP II: su plan de ejecución (entregas, hitos y % de avance) por su
  identificador (CO1.PCCNTR.…), uno por elemento. Es el avance en el tiempo, no el lugar; para DÓNDE
  se ejecuta (municipios) usa secop_ubicaciones_contrato.
  (Fuente: Colombia Compra Eficiente; licencia: CC BY-SA 4.0.)
entrada: {id_contrato: id_secop}
consulta:
  operacion: por_codigo
  resultado: lista
  tool: datos_consultar
  argumentos:
    portal: datos.gov.co
    id: mfmm-jqmq
    select: "identificadorcontrato, tipoejecucion, nombreplan, fechadeentregaesperada, fechadeentregareal, porcentajedeavanceesperado, porcentaje_de_avance_real, estado_del_contrato, descripci_n"
    where: "identificadorcontrato = '{id_contrato}'"
    order: "fechadeentregaesperada, nombreplan"
    max_filas: 1000
  campos: [identificadorcontrato, tipoejecucion, nombreplan, fechadeentregaesperada, fechadeentregareal, porcentajedeavanceesperado, porcentaje_de_avance_real, estado_del_contrato, descripci_n]
salida: SecopEjecucionContrato
derivados:
  numero_registros: {de: conteo, tipo: int}
cobro: registro
canario:
  entrada: {id_contrato: CO1.PCCNTR.5709738}
  verdad: {id_contrato: CO1.PCCNTR.5709738}
  minimos: {numero_registros: 6}
  campos: [avance_esperado_pct, avance_real_pct, descripcion, estado, fecha_entrega_esperada, fecha_entrega_real, id_contrato, numero_registros, plan, tipo_ejecucion]
  latencia_max_ms: 10000
