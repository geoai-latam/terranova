id: secop_integrado_contratos_entidad
version: 2
familia: contratacion
fuente: cce.secop.integrado
pregunta: "¿Cuántos contratos firmó esta entidad cada año, sumando SECOP I y SECOP II?"
descripcion: >
  Contratos de una entidad estatal por su NIT en el SECOP Integrado (SECOP I y II), por año de
  firma y origen: número de contratos y valor total en pesos. Cada contrato cuenta una vez, con su
  mayor valor registrado (la fuente lo repite en cada cambio de estado; las adiciones suben el valor).
  Va unos meses detrás de SECOP II: para lo reciente, mejor las herramientas de SECOP II.
  Si no tiene el NIT de la entidad, búsquelo con secop_entidades_municipio; no lo suponga.
  Los contratos de 20 billones o más no suman: son errores de digitación de la fuente (uno de
  Medellín dice 440 000 billones) y `contratos_valor_atipico` dice cuántos hubo.
  (Fuente: Colombia Compra Eficiente; licencia: CC BY-SA 4.0.)
entrada: {nit_entidad: nit_entidad}
consulta:
  operacion: por_codigo
  resultado: lista
  tool: datos_consultar
  argumentos:
    portal: datos.gov.co
    id: rpmr-utcd
    # Spec 07: en Pitalito, 2025, son 1 748 filas para 652 contratos; sumar filas daba $174 000 millones
    # (son $63 157 millones; SECOP II directo da 659 contratos y $63 057 millones).
    previo_select: "date_extract_y(fecha_de_firma_del_contrato) AS anio, origen, numero_del_contrato, max(valor_contrato) AS valor"
    previo_group: "anio, origen, numero_del_contrato"
    select: "anio, origen, count(*) AS contratos, sum(case(valor < 20000000000000, valor, true, 0)) AS valor_total, sum(case(valor >= 20000000000000, 1, true, 0)) AS contratos_valor_atipico"
    where: "nit_de_la_entidad = '{nit_entidad}'"
    group: "anio, origen"
    order: "anio, origen"
    max_filas: 100
  campos: [nit_de_la_entidad, fecha_de_firma_del_contrato, valor_contrato, origen]
salida: IntegradoContratosEntidad
derivados:
  anio: {de: columna, campo: anio, tipo: int}
  contratos: {de: columna, campo: contratos, tipo: int}
  valor_total: {de: columna, campo: valor_total, tipo: float}
  contratos_valor_atipico: {de: columna, campo: contratos_valor_atipico, tipo: int}
avisos:
- cuando: encontrado
  texto: >
    Las filas con `anio` vacío no son contratos firmados: son los registros sin fecha de firma
    (procesos en borrador, cancelados, en aprobación o enviados al proveedor). En la Gobernación
    del Huila, el 2026-11-05, eran 539 de SECOP II por $5,7 billones. No los sume con los años.
cobro: agregado
canario:
  # Medido el 2026-10-22 en rpmr-utcd: Municipio de Pitalito, 2018 en SECOP I → 1 contrato, $9 995 000.
  entrada: {nit_entidad: 891180077}
  verdad: {anio: 2018, origen: SECOPI, contratos: 1, valor_total: 9995000.0}
  campos: [anio, contratos, contratos_valor_atipico, origen, valor_total]
  latencia_max_ms: 20000
