id: sinic_predio_en_punto
version: 3
familia: territorio
fuente: igac.sinic_terreno
pregunta: "¿Qué predio hay en este punto de un municipio con gestor catastral propio (Bogotá, Medellín, Cali, Barranquilla…)?"
descripcion: >
  Predio (terreno) que contiene un punto en los municipios con gestor catastral propio, del Sistema
  Nacional de Información Catastral (SINIC) del IGAC: número predial nacional, zona, condición (PH,
  NPH), destinación económica, tipo de predio y de derecho. Cubre los 333 municipios que la base del
  IGAC no tiene: Bogotá, Medellín y el Valle de Aburrá, Cali, Barranquilla, Bucaramanga, Cartagena,
  Catastro Antioquia, Cundinamarca, el Valle del Cauca y otros gestores propios. Para los demás
  municipios (la mayoría, Chía entre ellos), igac_predio_en_punto; si no se sabe quién es el
  gestor, predio_en_punto, que elige la base. Sin propietarios. Sale de la copia de Terrnova (linderos
  simplificados a ~1 m). Las vías, los andenes y las plazas no son terreno de ningún predio: un punto que cae ahí no
  trae predio aunque haya lotes a pocos metros. Para un lote, un punto dentro de él, o ficha_lote
  con su polígono.
  (Fuente: IGAC, SINIC; licencia: CC BY-SA 4.0.)
entrada: {lon: float, lat: float}
consulta:
  operacion: en_punto
  tool: consultar_copia
  argumentos:
    tabla: sinic_terreno
    punto: ["{lon}", "{lat}"]
    select: [cod_divipola, departamento, municipio, numero_predial_nacional, zona, condicion_predio, destinacion_economica, tipo_predio, tipo_derecho]
    geometria: simplificada
    order: [numero_predial_nacional]
    limite: 5
  campos: [cod_divipola, departamento, municipio, numero_predial_nacional, zona, condicion_predio, destinacion_economica, tipo_predio, tipo_derecho]
salida: PredioSinicEnPunto
# Fuera del MCP: predio_en_punto elige la base sola y el agente confundía las dos (#15). Sigue
# en REST y dentro de predio_en_punto, ficha_lugar y ficha_lote.
en_mcp: false
avisos:
- cuando: vacio
  texto: >
    Ningún terreno del SINIC contiene el punto. Puede caer en una vía, un andén o una plaza, que
    no son terreno de ningún predio: si es una dirección, mueva el punto hacia dentro del lote.
    O el municipio no tiene gestor catastral propio y su predio está en la base del IGAC
    (igac_predio_en_punto; predio_en_punto busca en las dos). Que no haya terreno aquí no quiere
    decir que el lugar no tenga dueño.
cobro: punto
canario:
  # Chapinero (Bogotá); medido el 2026-10-28 en la capa 3: número predial 110010182020400210003900000000,
  # PH matriz, habitacional, dominio.
  entrada: {lon: -74.0565, lat: 4.6486}
  verdad: {numero_predial: "110010182020400210003900000000", municipio_divipola: "11001", destinacion_economica: Habitacional}
  campos: [condicion_predio, departamento, destinacion_economica, municipio, municipio_divipola, numero_predial, tipo_derecho, tipo_predio, zona]
  latencia_max_ms: 5000
