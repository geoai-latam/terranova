id: supersociedades_situacion_financiera
version: 3
familia: empresas
fuente: supersociedades.niif_situacion_financiera
pregunta: "¿Cómo está el balance (activos, pasivos, patrimonio) de esta sociedad?"
descripcion: >
  Estado de situación financiera de una sociedad vigilada por Supersociedades, por su NIT: concepto, periodo y valor
  de cada reporte NIIF, del corte más reciente al más antiguo (hasta 1000 filas). Valores en miles de pesos (la fuente lo declara
  desde 2025), del separado y del consolidado por aparte (`punto_entrada`). Cada reporte trae también el año anterior: un año sale en dos
  reportes. `periodo` es el texto de la fuente: «Periodo Actual» o «Periodo Anterior» desde el corte
  de 2018; antes, fechas o años (y en algunos reportes de 2016, el NIT). Las sociedades vigiladas por
  otra superintendencia no salen.
  Si no tiene el NIT, búsquelo por el nombre con rues_empresas_buscar; no lo suponga. La fuente perdió las tildes de algunos conceptos («Ganancia (p�rdida)»).
  (Fuente: Supersociedades; licencia: CC BY-SA 4.0.)
entrada: {nit: nit_empresa}
consulta:
  operacion: por_codigo
  resultado: lista
  tool: datos_consultar
  argumentos:
    id: pfdp-zks5
    portal: datos.gov.co
    select: "nit, fecha_corte, periodo, concepto, valor, punto_entrada, taxonomia, numero_radicado"
    where: "nit = '{nit}'"
    order: "fecha_corte DESC, punto_entrada, concepto, periodo"
    max_filas: 1000
  campos: [nit, fecha_corte, periodo, concepto, valor, punto_entrada, taxonomia, numero_radicado]
salida: SupersociedadesSituacionFinanciera
derivados:
  numero_registros: {de: conteo, tipo: int}
avisos:
- cuando: vacio
  texto: >
    La Supersociedades no tiene estados financieros de ese NIT. Solo reportan aquí las sociedades
    que ella supervisa: las que vigila la Superfinanciera no están (Ecopetrol, que en el reporte de
    las 10 000 empresas más grandes figura con supervisor SUPERFINANCIERA; medido el 2026-11-05).
    supersociedades_empresa_grande_por_nit dice el supervisor de cada año.
- cuando: encontrado
  texto: >
    Los valores están en miles de pesos: 1 344 661 181 son 1,34 billones. La carátula del corte 2025 lo
    declara en 29 211 de sus 29 219 reportes («MILES DE PESOS», ninguna otra unidad), y de 2022 a 2024
    cuadra con el reporte de las 10 000 empresas (medido en Alpina; en Integral y Royal Films, en 2022). Antes de 2025 la
    fuente no declara la unidad. Una sociedad con subsidiarias reporta el estado separado y el
    consolidado del mismo corte: mire punto_entrada antes de sumar o comparar.
cobro: registro
canario:
  # Medido el 2026-10-22 directamente en pfdp-zks5 (nit = 830010665): 175
  # registros; el primero con el orden de la ficha da la verdad. Los registros solo crecen: mínimo.
  entrada: {nit: "830010665"}
  verdad: {nit: "830010665", concepto: "Activos corrientes totales", periodo: "Periodo Actual"}
  minimos: {numero_registros: 175}
  campos: [concepto, fecha_corte, nit, numero_registros, periodo, punto_entrada, radicado, taxonomia, valor]
  latencia_max_ms: 20000
