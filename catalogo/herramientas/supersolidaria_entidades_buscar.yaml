id: supersolidaria_entidades_buscar
version: 2
familia: empresas
fuente: supersolidaria.entidades
pregunta: "¿Esta cooperativa o fondo de empleados está registrado ante la Supersolidaria?"
descripcion: >
  Busca entidades del sector solidario (cooperativas, fondos de empleados, mutuales) por una parte de
  su razón social o de su sigla (COOMEVA), con la sigla exacta primero: NIT, razón social, sigla,
  tipo, municipio, actividad, nivel de supervisión y el último año que reportó a la Supersolidaria (un año viejo puede querer decir que dejó de reportar).
  (Fuente: Supersolidaria; licencia: CC BY-SA 4.0.)
entrada: {nombre: nombre}
consulta:
  operacion: buscar
  resultado: lista
  tool: datos_consultar
  argumentos:
    id: kg2d-yfyg
    portal: datos.gov.co
    select: "nit, nombreentidad, sigla, nombretipo, municipio, nombreactividad, supervision, max(a_o) AS ultimo_reporte"
    # COOMEVA es la sigla: la razón social es «COOPERATIVA MEDICA DEL VALLE Y DE PROFESIONALES DE
    # COLOMBIA». Buscar solo en la razón social daba el Colegio Cooperativo Coomeva (2026-11-02).
    where: "upper(nombreentidad) like upper('%{nombre}%') OR upper(sigla) like upper('%{nombre}%')"
    group: "nit, nombreentidad, sigla, nombretipo, municipio, nombreactividad, supervision"
    # la sigla exacta primero; luego la razón social más corta
    order: "case(upper(sigla) = upper('{nombre}'), 0, true, 1), length(nombreentidad), nombreentidad"
    # 200 grupos: con una fila por NIT quedan menos (14 NIT repetidos en 50 filas para
    # «COOPERATIVA», medido el 2026-11-05)
    max_filas: 200
  campos: [nit, nombreentidad, sigla, nombretipo, municipio, nombreactividad, supervision, a_o]
  # una fila por NIT: la del último reporte (el grupo se parte con cada cambio de un atributo)
  unico_por: nit
  unico_mayor: ultimo_reporte
salida: SupersolidariaEntidadesBuscar
derivados:
  ultimo_reporte: {de: columna, campo: ultimo_reporte, tipo: str}
cobro: agregado
canario:
  # Medido el 2026-11-02 en kg2d-yfyg: «COOMEVA» es una sigla. Con la sigla exacta primero sale
  # la Cooperativa Médica del Valle y de Profesionales de Colombia (890-300-625-1), antes que el
  # Colegio Cooperativo Coomeva y el Fondo de Empleados de Coomeva. El último reporte cambia
  # cada mes: no va en la verdad.
  entrada: {nombre: COOMEVA}
  verdad: {nit: 890-300-625-1, sigla: COOMEVA}
  campos: [actividad, entidad, municipio, nit, nivel_supervision, sigla, tipo, ultimo_reporte]
  latencia_max_ms: 10000
