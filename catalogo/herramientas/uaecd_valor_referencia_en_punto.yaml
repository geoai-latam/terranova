id: uaecd_valor_referencia_en_punto
version: 3
familia: territorio
fuente: uaecd.valor_referencia
pregunta: "¿Cuál es el valor de referencia del m² de terreno en este punto de Bogotá?"
descripcion: >
  Valor de referencia del suelo en Bogotá que calcula el catastro distrital (UAECD): la mediana del
  valor comercial por m² de terreno de la manzana que contiene un punto, en pesos, año por año desde
  2017, y el del último año con valor (valor_m2_ultimo, vigencia_ultima). Un año puede venir sin valor (null). Es un valor de referencia por manzana, no el avalúo de un predio. Solo zonas urbanas y de
  expansión de Bogotá. Sale de la copia de Terrnova.
  (Fuente: UAECD; licencia: CC BY 4.0.)
entrada: {lon: float, lat: float}
consulta:
  operacion: en_punto
  resultado: lista
  tool: consultar_copia
  argumentos:
    tabla: uaecd_valor_referencia
    punto: ["{lon}", "{lat}"]
    select: [MANCODIGO, V_REF, ANO]
    geometria: ninguna
    order: [ANO]
    limite: 30
  campos: [MANCODIGO, V_REF, ANO]
derivados:
  numero_registros: {de: conteo, tipo: int}
  # el último año con valor: una manzana puede cerrar su serie con un año sin valor (la 002569002
  # de Ciudad Bolívar trae 2021 vacío), y ese año no es «el último valor»
  valor_m2_ultimo: {de: ultimo, campo: valor_m2, tipo: float, solo_si: {campo: valor_m2, con_dato: true}}
  vigencia_ultima: {de: ultimo, campo: vigencia, tipo: date, solo_si: {campo: valor_m2, con_dato: true}}
salida: ValorReferenciaEnPunto
avisos:
- cuando: vacio
  texto: >
    Ninguna manzana contiene el punto. Las manzanas no cubren las calles, y un punto en la vía queda
    entre dos manzanas: si es una dirección, mueva el punto hacia dentro del predio y vuelva a
    preguntar. Fuera de las zonas urbanas y de expansión de Bogotá no hay valor de referencia.
cobro: punto
canario:
  # Chapinero; medido el 2026-10-28 en la capa 0: manzana 008204021, 10 años; 2017 → $3 400 000 por
  # m², 2026 → $5 800 000.
  entrada: {lon: -74.0565, lat: 4.6486}
  verdad: {manzana: "008204021", valor_m2: 3400000.0}
  minimos: {numero_registros: 10}
  campos: [manzana, numero_registros, valor_m2, valor_m2_ultimo, vigencia, vigencia_ultima]
  latencia_max_ms: 5000
