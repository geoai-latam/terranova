id: uariv_desplazamiento_municipio
version: 1
familia: justicia
fuente: uariv.desplazamiento_anual
pregunta: "¿Cuántas personas fueron desplazadas de este municipio cada año?"
descripcion: >
  Personas registradas en el Registro Único de Víctimas (RUV) de la UARIV como desplazadas por el
  conflicto desde un municipio (DIVIPOLA), año por año desde 1985 (año del desplazamiento), en el
  corte mensual vigente, con los eventos. Es la expulsión: la llegada que publica la fuente es una
  fracción mínima de la recepción real y no se sirve; cuántas víctimas de desplazamiento viven hoy
  en el municipio está en uariv_victimas_hecho_municipio (ubicación). El año en curso va incompleto.
  Solo sumas por año, nunca personas.
  (Fuente: Unidad para las Víctimas (UARIV); licencia: CC BY-SA 4.0.)
entrada: {municipio_divipola: divipola}
consulta:
  operacion: por_codigo
  resultado: lista
  tool: datos_consultar
  argumentos:
    # Spec 07: los últimos cuatro fines de mes por igualdad y, por año, el corte más reciente
    # (max(clave · 10¹⁰ + cifra) mod 10¹⁰, clave = AAAAMM).
    id: "krnc-8azs"
    portal: datos.gov.co
    previo_select: "vigencia, substring(fecha_corte, 7, 4) || '-' || substring(fecha_corte, 4, 2) || '-' || substring(fecha_corte, 1, 2) AS fi, (substring(fecha_corte, 7, 4) || substring(fecha_corte, 4, 2))::number AS clave, coalesce(sum(per_ocu), 0) AS ocu, coalesce(sum(eventos), 0) AS ev"
    previo_group: "vigencia, fecha_corte"
    select: "vigencia, max(fi) AS fecha_corte, max(clave * 10000000000 + ocu) % 10000000000 AS personas_expulsadas, max(clave * 10000000000 + ev) % 10000000000 AS n_eventos"
    where: "cod_ciudad_muni = {municipio_divipola} AND fecha_corte in (substring((date_trunc_ym(to_floating_timestamp(get_utc_date(), 'America/Bogota')) - 'P1D')::text, 9, 2) || '/' || substring((date_trunc_ym(to_floating_timestamp(get_utc_date(), 'America/Bogota')) - 'P1D')::text, 6, 2) || '/' || substring((date_trunc_ym(to_floating_timestamp(get_utc_date(), 'America/Bogota')) - 'P1D')::text, 1, 4), substring((date_trunc_ym(to_floating_timestamp(get_utc_date(), 'America/Bogota')) - 'P1M' - 'P1D')::text, 9, 2) || '/' || substring((date_trunc_ym(to_floating_timestamp(get_utc_date(), 'America/Bogota')) - 'P1M' - 'P1D')::text, 6, 2) || '/' || substring((date_trunc_ym(to_floating_timestamp(get_utc_date(), 'America/Bogota')) - 'P1M' - 'P1D')::text, 1, 4), substring((date_trunc_ym(to_floating_timestamp(get_utc_date(), 'America/Bogota')) - 'P2M' - 'P1D')::text, 9, 2) || '/' || substring((date_trunc_ym(to_floating_timestamp(get_utc_date(), 'America/Bogota')) - 'P2M' - 'P1D')::text, 6, 2) || '/' || substring((date_trunc_ym(to_floating_timestamp(get_utc_date(), 'America/Bogota')) - 'P2M' - 'P1D')::text, 1, 4), substring((date_trunc_ym(to_floating_timestamp(get_utc_date(), 'America/Bogota')) - 'P3M' - 'P1D')::text, 9, 2) || '/' || substring((date_trunc_ym(to_floating_timestamp(get_utc_date(), 'America/Bogota')) - 'P3M' - 'P1D')::text, 6, 2) || '/' || substring((date_trunc_ym(to_floating_timestamp(get_utc_date(), 'America/Bogota')) - 'P3M' - 'P1D')::text, 1, 4))"
    group: "vigencia"
    order: "vigencia"
    max_filas: 200
  campos: [cod_ciudad_muni, vigencia, fecha_corte, per_ocu, eventos]
derivados:
  personas_expulsadas: {de: columna, campo: personas_expulsadas, tipo: int}
  eventos: {de: columna, campo: n_eventos, tipo: int}
  total_personas_expulsadas: {de: suma, campo: personas_expulsadas, tipo: int}
  numero_registros: {de: conteo, tipo: int}
salida: DesplazamientoRuvMunicipio
cobro: agregado
canario:
  # Medido el 2026-10-28 en krnc-8azs, corte 30/09/2026 de Turbo (05837): 42 años (1985 a 2026);
  # 1985, 955 personas expulsadas; el total, 158 649. Crece con cada corte: pisos.
  entrada: {municipio_divipola: "05837"}
  verdad: {anio: 1985}
  minimos: {numero_registros: 42, personas_expulsadas: 950, total_personas_expulsadas: 158000}
  campos: [anio, eventos, fecha_corte, numero_registros, personas_expulsadas, total_personas_expulsadas]
  latencia_max_ms: 20000
