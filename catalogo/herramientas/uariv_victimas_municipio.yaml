id: uariv_victimas_municipio
version: 1
familia: justicia
fuente: uariv.victimas_municipio
pregunta: "¿Cuántas víctimas del conflicto armado registradas hay en este municipio?"
descripcion: >
  Víctimas del conflicto armado incluidas en el Registro Único de Víctimas (RUV) de la UARIV para un
  municipio (DIVIPOLA), en el corte mensual vigente, sin repetir personas: por ocurrencia (el hecho
  pasó en el municipio), por declaración (declararon allí), por ubicación (viven allí según el
  registro) y sujetos de atención (ubicadas y con derecho a la atención), más los eventos. Las cuatro
  cifras miden cosas distintas y no se suman. Son víctimas registradas, no hechos documentados: los
  hechos del conflicto (masacres, secuestros…) los cuenta el CNMH en las herramientas cnmh_*. Por
  hecho victimizante, uariv_victimas_hecho_municipio. Solo sumas del municipio, nunca personas.
  (Fuente: Unidad para las Víctimas (UARIV); licencia: CC BY-SA 4.0.)
entrada: {municipio_divipola: divipola}
consulta:
  operacion: por_codigo
  resultado: uno
  tool: datos_consultar
  argumentos:
    # Spec 07: la tabla acumula un corte por mes. Se piden por igualdad los últimos cuatro fines de
    # mes (rápido; like o substring en el where recorren 8 M de filas) y la segunda etapa se queda
    # con el corte más reciente: max(clave · 10¹⁰ + cifra) mod 10¹⁰, con clave = AAAAMM.
    id: "ykxr-xynr"
    portal: datos.gov.co
    previo_select: "cod_ciudad_muni, substring(fecha_corte, 7, 4) || '-' || substring(fecha_corte, 4, 2) || '-' || substring(fecha_corte, 1, 2) AS fi, (substring(fecha_corte, 7, 4) || substring(fecha_corte, 4, 2))::number AS clave, coalesce(sum(per_ocu), 0) AS ocu, coalesce(sum(per_decla::number), 0) AS decla, coalesce(sum(per_ubic), 0) AS ubic, coalesce(sum(per_sa), 0) AS sa, coalesce(sum(eventos), 0) AS ev"
    previo_group: "cod_ciudad_muni, fecha_corte"
    select: "cod_ciudad_muni, max(fi) AS fecha_corte, max(clave * 10000000000 + ocu) % 10000000000 AS personas_ocurrencia, max(clave * 10000000000 + decla) % 10000000000 AS personas_declaracion, max(clave * 10000000000 + ubic) % 10000000000 AS personas_ubicacion, max(clave * 10000000000 + sa) % 10000000000 AS personas_sujetos_atencion, max(clave * 10000000000 + ev) % 10000000000 AS n_eventos"
    where: "cod_ciudad_muni = {municipio_divipola} AND fecha_corte in (substring((date_trunc_ym(to_floating_timestamp(get_utc_date(), 'America/Bogota')) - 'P1D')::text, 9, 2) || '/' || substring((date_trunc_ym(to_floating_timestamp(get_utc_date(), 'America/Bogota')) - 'P1D')::text, 6, 2) || '/' || substring((date_trunc_ym(to_floating_timestamp(get_utc_date(), 'America/Bogota')) - 'P1D')::text, 1, 4), substring((date_trunc_ym(to_floating_timestamp(get_utc_date(), 'America/Bogota')) - 'P1M' - 'P1D')::text, 9, 2) || '/' || substring((date_trunc_ym(to_floating_timestamp(get_utc_date(), 'America/Bogota')) - 'P1M' - 'P1D')::text, 6, 2) || '/' || substring((date_trunc_ym(to_floating_timestamp(get_utc_date(), 'America/Bogota')) - 'P1M' - 'P1D')::text, 1, 4), substring((date_trunc_ym(to_floating_timestamp(get_utc_date(), 'America/Bogota')) - 'P2M' - 'P1D')::text, 9, 2) || '/' || substring((date_trunc_ym(to_floating_timestamp(get_utc_date(), 'America/Bogota')) - 'P2M' - 'P1D')::text, 6, 2) || '/' || substring((date_trunc_ym(to_floating_timestamp(get_utc_date(), 'America/Bogota')) - 'P2M' - 'P1D')::text, 1, 4), substring((date_trunc_ym(to_floating_timestamp(get_utc_date(), 'America/Bogota')) - 'P3M' - 'P1D')::text, 9, 2) || '/' || substring((date_trunc_ym(to_floating_timestamp(get_utc_date(), 'America/Bogota')) - 'P3M' - 'P1D')::text, 6, 2) || '/' || substring((date_trunc_ym(to_floating_timestamp(get_utc_date(), 'America/Bogota')) - 'P3M' - 'P1D')::text, 1, 4))"
    group: "cod_ciudad_muni"
    max_filas: 10
  campos: [cod_ciudad_muni, fecha_corte, per_ocu, per_decla, per_ubic, per_sa, eventos]
derivados:
  personas_ocurrencia: {de: columna, campo: personas_ocurrencia, tipo: int}
  personas_declaracion: {de: columna, campo: personas_declaracion, tipo: int}
  personas_ubicacion: {de: columna, campo: personas_ubicacion, tipo: int}
  personas_sujetos_atencion: {de: columna, campo: personas_sujetos_atencion, tipo: int}
  eventos: {de: columna, campo: n_eventos, tipo: int}
salida: VictimasRuvMunicipio
cobro: agregado
canario:
  # Medido el 2026-10-28 en ykxr-xynr, corte 30/09/2026 de Medellín: 245 549 por ocurrencia,
  # 783 837 por declaración, 451 163 por ubicación, 392 116 sujetos de atención, 298 135 eventos. El
  # corte cambia cada mes: la ocurrencia y la declaración solo crecen (pisos), la ubicación no.
  entrada: {municipio_divipola: "05001"}
  verdad: {municipio_divipola: "5001"}
  minimos: {personas_ocurrencia: 245000, personas_declaracion: 783000}
  campos: [eventos, fecha_corte, municipio_divipola, personas_declaracion, personas_ocurrencia, personas_sujetos_atencion, personas_ubicacion]
  latencia_max_ms: 20000
