id: upra_precio_tierra_en_punto
version: 4
familia: territorio
fuente: upra.rango_precios_nacional
pregunta: "¿Cuánto vale la tierra rural en este punto según la UPRA?"
descripcion: >
  Rango de precio comercial de la tierra rural agropecuaria (UPRA) en un punto: rango como lo
  publica la UPRA, en millones de pesos por hectárea, su código, categoría para el mercado de tierras, año del estudio (vigencia),
  área de la zona y municipio. Cubre 18 departamentos; cada uno tiene su año de estudio (2015 a
  2023), así que el precio es el de ese año. Fuera de las áreas del mercado de tierras no hay dato.
  Sale de la copia de Terrnova de la capa de la UPRA.
  (Fuente: UPRA; licencia: CC BY-SA 4.0.)
entrada: {lon: float, lat: float}
consulta:
  operacion: en_punto
  tool: consultar_copia
  argumentos:
    tabla: upra_rango_precios
    punto: ["{lon}", "{lat}"]
    select: [departamen, municipio, cod_dane_mpio, rango_precios, cod_precios, categoria_mtv11, vigencia, area_ha, consecutivo]
    geometria: ninguna
    order: [objectid]
    limite: 5
  campos: [departamen, municipio, cod_dane_mpio, rango_precios, cod_precios, categoria_mtv11, vigencia, area_ha, consecutivo]
salida: PrecioTierraEnPunto
derivados:
  area_ha: {de: columna, campo: area_ha, tipo: float, decimales: 2}
avisos:
- cuando: encontrado
  texto: >
    El precio es el del año del estudio de la UPRA en ese departamento (vigencia), en millones de
    pesos por hectárea de ese año: no está actualizado a hoy. Cada departamento tiene su año
    (Cundinamarca 2016 y 2022, Boyacá 2015 y 2021, Bolívar 2023).
cobro: punto
canario:
  # Medido el 2026-10-22 en rango_precios_nacional/MapServer/0: el punto (punto representativo de la
  # zona 78510) cae en Cota, rango «Mayor que 60 - hasta 70», vigencia 2016.
  entrada: {lon: -74.09602, lat: 4.838895}
  verdad: {municipio: Cota, municipio_divipola: "25214", rango_precio: "Mayor que 60 - hasta 70", codigo_rango_precio: "4.1.1", vigencia: 2016}
  campos: [area_ha, categoria_mercado, codigo_rango_precio, consecutivo, departamento, municipio, municipio_divipola, rango_precio, vigencia]
  latencia_max_ms: 10000
