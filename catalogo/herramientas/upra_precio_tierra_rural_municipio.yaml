id: upra_precio_tierra_rural_municipio
version: 2
familia: estadisticas
fuente: upra.precio_tierra_rural
pregunta: "¿Cuánto vale la tierra rural en este municipio, según UPRA?"
descripcion: >
  Rangos de precio comercial de la tierra rural agropecuaria de un municipio (código DIVIPOLA),
  según la versión de datos.gov.co del estudio de UPRA: por rango, las hectáreas y los polígonos, del
  rango con más área al de menos, con el total del municipio. El precio va en millones de pesos por
  hectárea del año del estudio, que esta versión no dice. Cubre 244 municipios de 13 departamentos.
  Use primero upra_rangos_precio_municipio, que trae el año del estudio y 18 departamentos; esta
  sirve para lo que esa no tiene (Andes, Antioquia, por ejemplo).
  (Fuente: UPRA; licencia: CC BY-SA 4.0.)
entrada: {municipio_divipola: divipola}
consulta:
  operacion: por_codigo
  resultado: lista
  tool: datos_consultar
  argumentos:
    id: rttb-pk7n
    portal: datos.gov.co
    # Un rango se escribe de dos formas («Mayor a 2 - hasta 3», «Mayor que 2 - hasta 3») y las
    # categorías como sigla o nombre («CA», «Cuerpo de Agua»): se agrupa por el código y max() da el
    # nombre largo.
    select: "departamen, municipio, cod_precio, max(rango_prec) AS rango, sum(area_ha) AS hectareas, count(*) AS poligonos"
    where: "cod_dane_m = '{municipio_divipola}'"
    group: "departamen, municipio, cod_precio"
    order: "hectareas DESC, cod_precio"
    max_filas: 100
  campos: [departamen, municipio, cod_precio]
salida: PrecioTierraRuralMunicipio
derivados:
  rango_precio: {de: columna, campo: rango, tipo: str}
  hectareas: {de: columna, campo: hectareas, tipo: float}
  poligonos: {de: columna, campo: poligonos, tipo: int}
  area_ha_total: {de: suma, campo: hectareas, tipo: float}
  poligonos_total: {de: suma, campo: poligonos, tipo: int}
  categoria: {de: codigo, campo: codigo_rango_precio, valores: {CA: cuerpo de agua, ZU: zona urbana, NS: no suelo, SI: sin valor}}
  rango_con_mas_area: {de: primero, campo: rango_precio}
avisos:
- cuando: encontrado
  texto: >
    El precio va en millones de pesos por hectárea del año del estudio, y esta versión no dice el
    año (se publicó el 2022-06-16). Los códigos CA, ZU, NS y SI (cuerpo de agua, zona urbana, no
    suelo, sin valor) son categorías, no precios: `categoria` dice cuál. Si el municipio está en
    upra_rangos_precio_municipio, use esa: dice el año.
- cuando: vacio
  texto: >
    Esta versión del estudio de UPRA solo tiene 244 municipios de 13 departamentos. Pruebe
    upra_rangos_precio_municipio, que cubre 18 departamentos. Que no salga no quiere decir que la
    tierra no tenga precio.
cobro: registro
canario:
  # Medido el 2026-11-03 en rttb-pk7n (cod_dane_m='25214'): Cota, 116 polígonos, 4315,86 ha; el
  # rango con más área es «Mayor a 2200 - hasta 2600», con 1788,10 ha en 30 polígonos.
  entrada: {municipio_divipola: "25214"}
  verdad: {municipio: Cota, departamento: Cundinamarca, poligonos_total: 116, rango_con_mas_area: "Mayor a 2200 - hasta 2600", poligonos: 30}
  campos: [area_ha_total, categoria, codigo_rango_precio, departamento, hectareas, municipio, poligonos, poligonos_total, rango_con_mas_area, rango_precio]
  latencia_max_ms: 5000
