id: upra_rangos_precio_municipio
version: 1
familia: territorio
fuente: upra.rango_precios_nacional
pregunta: "¿Cuántas hectáreas de tierra rural hay en cada rango de precio en este municipio según la UPRA?"
descripcion: >
  Rangos de precio comercial de la tierra rural agropecuaria de un municipio (DIVIPOLA) según la
  UPRA, por año de estudio: hectáreas y número de zonas en cada rango, calculados en el servicio.
  Cubre 18 departamentos con estudios de 2015 a 2023; las categorías E-… (zonas urbanas,
  resguardos) son exclusiones, no precios.
  (Fuente: UPRA; licencia: CC BY-SA 4.0.)
entrada: {municipio_divipola: divipola}
consulta:
  operacion: por_codigo
  resultado: lista
  tool: arcgis_estadisticas
  capas: [0]
  argumentos:
    url: "{url_capa}"
    where: "cod_dane_mpio = '{municipio_divipola}'"
    agrupar: [vigencia, cod_precios, rango_precios]
    medidas:
      - {tipo: sum, campo: area_ha, nombre: hectareas}
      - {tipo: count, campo: consecutivo, nombre: zonas}
    orden: [vigencia, cod_precios]
  campos: [vigencia, cod_precios, rango_precios, area_ha, consecutivo, cod_dane_mpio]
salida: RangosPrecioMunicipio
derivados:
  hectareas: {de: columna, campo: hectareas, tipo: float}
  zonas: {de: columna, campo: zonas, tipo: int}
creditos: 5
canario:
  # Medido el 2026-10-22 en rango_precios_nacional/MapServer/0 (agrupado por vigencia y rango): Cota,
  # 2016, el primer rango (4.1.1, «Mayor que 60 - hasta 70») suma 984,143 ha en 28 zonas.
  entrada: {municipio_divipola: "25214"}
  verdad: {vigencia: 2016, codigo_rango_precio: "4.1.1", hectareas: 984.143, zonas: 28}
  campos: [codigo_rango_precio, hectareas, rango_precio, vigencia, zonas]
  latencia_max_ms: 10000
