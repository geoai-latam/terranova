id: urt_microzona_en_punto
version: 1
familia: territorio
fuente: urt.microzonas
pregunta: "¿Este punto está en una zona microfocalizada para la restitución de tierras?"
descripcion: >
  Zona microfocalizada por la Unidad de Restitución de Tierras (URT) que contiene un punto: la
  resolución vigente, su fecha, el estado (abierta o cerrada), municipio (DIVIPOLA) y la territorial
  que la atiende. Estar en una microzona no significa que un predio tenga una solicitud: significa
  que la URT puede tramitar solicitudes ahí. Solo la zona; nunca solicitudes ni sentencias por predio.
  (Fuente: URT; licencia: CC BY-SA 4.0.)
entrada: {lon: float, lat: float}
consulta:
  operacion: en_punto
  tool: arcgis_query_features
  capas: [3]
  argumentos:
    geometria: ninguna
    url: "{url_capa}"
    bbox: ["{lon}", "{lat}", "{lon}", "{lat}"]
    out_fields: [id_microzona, cod_dane, depto, mpio, n_res_m, fecha_res_vigente, estado_micro, territorial]
    max_features: 5
  campos: [id_microzona, cod_dane, depto, mpio, n_res_m, fecha_res_vigente, estado_micro, territorial]
salida: MicrozonaEnPunto
cobro: punto
canario:
  # El Carmen de Bolívar; medido el 2026-10-28 en la capa 3: microzona 3, RDM 0001 del 6 de agosto
  # de 2012, cerrada.
  entrada: {lon: -75.045, lat: 9.67}
  verdad: {id_microzona: 3, municipio_divipola: "13244", resolucion: "RDM 0001 DE AGOSTO 6 DE 2012", estado: Cerrada}
  campos: [departamento, estado, fecha_resolucion, id_microzona, municipio, municipio_divipola, resolucion, territorial]
  latencia_max_ms: 5000
