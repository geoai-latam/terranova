  decision: evaluacion
  notas: >
    No es una licencia abierta: es una «licencia de usuario final» con cita obligatoria que no
    menciona la redistribución. La parte de población de la ficha usa WorldPop hasta que DANE
    responda por escrito (F0.8). Solo agregados (reserva estadística).

