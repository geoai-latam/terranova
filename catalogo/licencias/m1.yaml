# Licencias de las fuentes M1 (F0.5), verificadas el 2026-10-21.
#
# Cada entrada lleva la evidencia primaria: el `licenseInfo` del ítem, los metadatos o el acto
# administrativo. En F1.2 estas entradas pasan a las fichas de fuente del catálogo (spec 02).
#
# La decisión aplica ADR-0007, ADR-0019 y ADR-0020:
#   produccion   → licencia verificada que permite redistribuir; responde a todas las llaves.
#   evaluacion   → `por_verificar`; solo responde a llaves de evaluación hasta que haya evidencia.
#   fuera        → no permite redistribuir; no entra al catálogo.
# Solo cuentan los ítems del dueño oficial: las copias de terceros traen licencias distintas
# (NC, confidencial).

- id: igac.catastro.base_publica_gestor
  entidad: Instituto Geográfico Agustín Codazzi (IGAC)
  url: https://services2.arcgis.com/RVvWzU3lgJISqdke/arcgis/rest/services/Base_Catastral_Publica_del_Gestor_IGAC_06_2026/FeatureServer
  licencia: {spdx: CC-BY-SA-4.0, url: https://creativecommons.org/licenses/by-sa/4.0/}
  uso_comercial: si
  redistribucion: si
  evidencia:
    url: https://www.arcgis.com/sharing/rest/content/items/6ca71458728f45988e2cd7aa5305a663?f=json
    cita: "Este producto adopta la licencia pública internacional de Reconocimiento-CompartirIgual 4.0 de Creative Commons"
  decision: produccion
  notas: >
    Es el producto que consume `igac_predio_en_punto`. Cada corte mensual es un ítem nuevo, así que
    la licencia se vuelve a leer al descubrir el corte (F1.5). Solo campos catastrales públicos
    (Res. 616/2020, art. 6, hábeas data).

- id: igac.res616.datos_abiertos
  entidad: Instituto Geográfico Agustín Codazzi (IGAC)
  url: https://mapas.igac.gov.co/server/rest/services/
  licencia: {spdx: CC-BY-4.0, url: https://creativecommons.org/licenses/by/4.0/}
  uso_comercial: si
  redistribucion: si
  evidencia:
    url: https://www.igac.gov.co/sites/default/files/transparencia/normograma/resolucion_616_de_2020.pdf
    cita: "ARTÍCULO 7º. LICENCIA CREATIVE COMMONS CC-BY 4.0. Se adopta la Licencia Creative Commons CC-BY 4.0"
  decision: produccion
  notas: >
    Solo cubre los conjuntos del art. 3: catastro, geodesia, geografía, cartografía básica,
    ortoimágenes y agrología nacional (vocación, conflictos de uso, suelos y capacidad de uso).
    Los estudios de agrología hechos con CAR o por convenio (art. 3, parágrafo 2) quedan en
    `evaluacion`, uno por uno.

