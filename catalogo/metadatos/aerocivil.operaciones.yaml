descripcion: 'Conjunto de datos que consolida el total de operaciones aéreas registradas en los aeródromos
  de Colombia con periodicidad mensual, correspondiente al periodo comprendido entre el año 2017 y el
  año en curso. La información se presenta de forma agregada y desagregada según los campos: año, mes,
  aeropuerto operación, origen, destino, empresa, explotador, tipo de vuelo, tipo de tráfico, tipo de
  operación y total operaciones. Estos datos se emplean para el análisis estadístico del transporte aéreo
  y el seguimiento de la actividad aeronáutica nacional e internacional. Se aclara que los campos EMPRESA
  y EXPLOTADOR no forman parte de la información capturada directamente en las fuentes de datos de origen,
  por lo cual pueden presentar registros en blanco. Estos campos son calculados de manera derivada a partir
  del callsign y de la matrícula de la aeronave, respectivamente, información obtenida de los sistemas
  de vigilancia y control, las fajas de progreso, los diarios de superficie y las planillas registradas
  en las torres de control. El conjunto de datos se actualiza trimestralmente, incorporando en cada ciclo
  los archivos correspondientes a los periodos faltantes hasta completar el año e…'
