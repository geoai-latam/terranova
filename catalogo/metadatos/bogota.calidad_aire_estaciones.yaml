  planas cartesianas en el sistema de referencia Magna-Sirgas.Temáticamente da cuenta del nombre de la
  estación de monitoreo que identifica el lugar donde se encuentra instalada, codificación, dirección,
  nombre de la entidad que permite la instalación de los equipos, altura de la estación snmm y altura
  de la estación con referencia al suelo, propósito de medición de la estación (Tráfico, fondo de la ciudad,
  de frontera, industrial) y si la estación está activa o inactiva. Cada estación es integrada por una
  cabina que se instrumenta con un conjunto de equipos de medición de contaminantes atmosféricos primarios
  y secundarios, y de equipos de medición meteorológica manuales o automáticos situados en posición estratégica.
  La capa fue construida a partir del posicionamiento de las estaciones en campo, de la cual se obtuvo
  las coordenadas geográficas correspondientes, que luego se integraron a los datos de la estación definidos
