# Ficha técnica manual (spec 08): el conector de copia no la cosecha de un API; los datos y el
# diccionario salen del DDI del microdato del DANE (ANDA, catálogo 859). filas = las filas
# pre-agregadas medidas para el año 2025 (ZIP Expo_2025).
fuente: dian.comex_exportaciones
metodo: manual
cosechado: '2026-10-26'
origen: https://microdatos.dane.gov.co/index.php/metadata/export/859/ddi
pagina: https://microdatos.dane.gov.co/index.php/catalog/859/get-microdata
titulo: Estadísticas de Exportaciones - EXPO
descripcion: >
  Microdato de las exportaciones de mercancías de Colombia, elaborado por el DANE a partir de las
  declaraciones de exportación (DEX) presentadas ante la DIAN. Cada línea es una declaración;
  Terranova la copia y la pre-agrega a (año, mes, subpartida NANDINA, país de destino) con los
  valores sumados. No contiene NIT, cédula ni nombre de exportador.
publicado: '2025-03-26'
datos_actualizados: '2026-10-22'
frecuencia_declarada: Mensual
cobertura_declarada: Nacional
idioma: Español
categoria: Economía-Microdatos
etiquetas: [comercio exterior, exportaciones, subpartida, NANDINA, aduanas]
filas: 192262
campos:
  anio:
    tipo_fuente: text
    descripcion: año de la declaración (de FECH, AAMM)
    comparacion: texto
  mes:
    tipo_fuente: numeric
    descripcion: mes de la declaración (1–12, de FECH)
    comparacion: numero
    minimo: '1'
    maximo: '12'
  subpartida:
    tipo_fuente: text
    etiqueta: POSAR
    descripcion: subpartida arancelaria NANDINA de 10 dígitos
    comparacion: texto
  pais_destino:
    tipo_fuente: text
    etiqueta: PAIS
    descripcion: código DANE del país de destino de la mercancía
    comparacion: texto
  valor_fob_usd:
    tipo_fuente: numeric
    etiqueta: FOBDOL
    descripcion: valor FOB en dólares (suma)
    comparacion: numero
  valor_fob_pesos:
    tipo_fuente: numeric
    etiqueta: FOBPES
    descripcion: valor FOB en pesos colombianos (suma)
    comparacion: numero
  peso_neto_kg:
    tipo_fuente: numeric
    etiqueta: PNK
    descripcion: peso neto en kilogramos (suma)
    comparacion: numero
  cantidad:
    tipo_fuente: numeric
    etiqueta: CANTI
    descripcion: cantidad en unidades físicas (suma)
    comparacion: numero
  lineas:
    tipo_fuente: numeric
    descripcion: número de líneas de declaración agregadas
    comparacion: numero
