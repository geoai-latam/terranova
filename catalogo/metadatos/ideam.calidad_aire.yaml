titulo: Calidad del Aire en Colombia
descripcion: La base de datos histórica de concentraciones de calidad del aire tiene como finalidad apoyar
  la evaluación del estado de la calidad del aire en el territorio nacional, servir como insumo para el
  análisis ambiental, la formulación, seguimiento y evaluación de políticas públicas, planes, programas
  y proyectos relacionados con la gestión de la calidad del aire, así como facilitar el desarrollo de
  estudios técnicos, científicos y académicos. Además, busca promover el acceso a la información ambiental
  por parte de la ciudadanía, en el marco de los principios de transparencia y gobierno abierto. De conformidad
  con lo dispuesto en el artículo 23 de la Resolución 2254 de 2017, el Instituto de Hidrología, Meteorología
  y Estudios Ambientales – IDEAM, como entidad adscrita al Ministerio de Ambiente y Desarrollo Sostenible,
  administra el Subsistema de Información sobre Calidad del Aire – SISAIRE y consolida y divulga la información
  sobre el estado de la calidad del aire reportada por las autoridades ambientales competentes. En este
  marco, la base de datos histórica de calidad del aire corresponde a información recopilada por el IDEAM
  dentro de la Operación Estadística de Monitoreo y Seguimie…
