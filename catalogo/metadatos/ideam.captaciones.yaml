titulo: Puntos de Captación Concesionados de Aguas Superficiales
descripcion: Corresponde al inventario de los puntos de captación autorizados en las concesiones de aguas
  superficiales otorgadas por las diferentes autoridades ambientales del país. Contiene información sobre
  su ubicación geopolítica, características técnicas del punto de captación, fuente hídrica asociada,
  caudal otorgado, ubicación hidrológica y coordenadas geográficas. El IDEAM coordina la operación del
  SIRH. La completitud, coherencia y actualización de la información registrada son responsabilidad de
  las Autoridades Ambientales; cualquier solicitud deberá dirigirse directamente a la autoridad correspondiente.
