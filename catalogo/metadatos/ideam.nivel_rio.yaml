  de forma horaria. Los datos disponibles a través de este medio pueden ser libremente consumidos bajo
  las siguientes cláusulas: 1. Los datos a visualizar o descargar a continuación no han sido validados
  por el IDEAM. 2. Los datos aquí dispuestos son datos crudos instantáneos provenientes de los sensores
  de las estaciones automáticas de la red propia y/o producto de convenios interadministrativos con terceras
  entidades. 3. Los datos son puestos a disposición de la ciudadanía como mecanismo de transparencia y
  para proveer una herramienta de apoyo a la gestión del riesgo territorial y como datos abiertos en cumplimiento
  de la Ley 1712 de 2014. 4. Es posible que los datos aquí dispuestos tengan cierto retraso en el tiempo
  debido a las frecuencias de envío de datos de los sensores y los medios de transmisión utilizados. 5.
  Los datos presenten errores y/o inconsistencias estando incluso por fuera de los límites considerados
  normales, producto de fallas en los sensores de origen. 6. El poster…'
