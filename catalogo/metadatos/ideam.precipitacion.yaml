descripcion: 'Contiene datos sobre la cantidad de lluvia registrada cada 10 minutos en diferentes estaciones
  meteorológicas ubicadas sobre el territorio colombiano. Los cuales han sido verificados mediante un
  control de calidad básico, de acuerdo con las recomendaciones de la Organización Meteorológica Mundial
  (OMM). Por lo anterior, se han corregido o eliminado valores que no han cumplido con estos controles
  y podrían requerir validaciones adicionales según el uso específico. Este conjunto de datos puede ser
  útil para analizar el comportamiento de la precipitación, determinar fenómenos extremos, realizar estudios
  climáticos e hidrológicos o apoyar sistemas de alerta temprana. Se recomienda a los usuarios aplicar
  criterios adicionales de verificación para usos sensibles o técnicos especializados. Los datos disponibles
  a través de este medio pueden ser libremente consumidos bajo los siguientes clausulas: 1. Los datos
  a visualizar o descargar a continuación no han sido validados por el IDEAM. 2. Los datos aquí dispuestos
  son datos crudos instantáneos provenientes de los sensores de las estaciones automáticas de la red propia
  y/o producto de convenios interadministrativos con terceras entidades. 3…'
