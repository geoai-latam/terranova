descripcion: 'Anteriormente este set de datos se denominaba: "Datos Hidrometeorológicos Crudos - Red de
  Estaciones IDEAM" el cual se actualiza por "Temperatura Ambiente del Aire". Contiene datos de la temperatura
  ambiente del aire registrada cada hora en diferentes estaciones meteorológicas ubicadas en el territorio
  colombiano. Los cuales han sido verificados mediante un control de calidad básico, de acuerdo con las
  recomendaciones de la Organización Meteorológica Mundial (OMM). Por lo anterior, se han corregido o
  eliminado valores que no han cumplido con estos controles y podrían requerir validaciones adicionales
  según el uso específico. Este conjunto de datos lo podemos utilizar para establecer el comportamiento
  diario, mensual y anual de la temperatura máxima del aire, en análisis climatológico y modelos climáticos,
  así como, en alertas tempranas. Se recomienda a los usuarios aplicar criterios adicionales de verificación
  para usos sensibles o técnicos especializados. Los datos disponibles a través de este medio pueden ser
  libremente consumidos bajo los siguientes clausulas: 1. Los datos a visualizar o descargar a continuación
