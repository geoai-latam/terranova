descripcion: La Clasificación por Capacidad de Uso está basada en la interpretación de las Unidades Cartográficas
  que integran el mapa de suelos del país (escala 1:100.000). La interpretación busca establecer las restricciones
  y potencialidades biofísicas de las tierras. Los criterios para evaluarlas y sus rangos de variación
  se adaptaron al país, a partir de la clasificación originada en los Estados Unidos, a través de la experiencia
  proporcionada durante más de cinco décadas de aplicación. La clasificación propende por la utilización
  correcta de las tierras del país y, al estar espacializada, constituye un criterio imprescindible en
  los planes de ordenamiento territorial, en la toma de decisiones con el fin de reducir su uso irracional
  y en la planificación de sus recursos naturales. Este producto es generado por la Subdirección de Agrología
  del Instituto Geográfico Agustín Codazzi - IGAC, para el territorio nacional, el cual fue publicado
  en la obra Suelos y Tierras de Colombia 2016 a escala 1:100.000.
