descripcion: Los conflictos de uso de las tierras resultan de las discrepancias entre el uso que hace
  la población del medio natural y el que debería tener, de acuerdo con sus potencialidades y restricciones
  ambientales. El IGAC, a través de la Subdirección de Agrología, ha venido investigando durante los últimos
  25 años, los criterios y metodologías tendientes a establecer el uso y las prácticas de manejo que deben
  tener los suelos y tierras del país, buscando su productividad sostenible en función de la oferta y
  demanda ambientales. Su mayor dedicación se ha concentrado en aspectos agrícolas, ganaderos, agroforestales,
  forestales y de conservación/recuperación de suelos y aguas. Este producto es generado por la Subdirección
  de Agrología del Instituto Geográfico Agustín Codazzi - IGAC, para el territorio nacional, el cual fue
  publicado en la obra Suelos y Tierras de Colombia 2016 a escala 1:100.000. Dado que el producto integra
  varios insumos, se visualiza la fecha de insumo correspondiente al más reciente utilizado durante su
  elaboración.
