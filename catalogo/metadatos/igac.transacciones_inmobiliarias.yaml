titulo: Registro de transacciones inmobiliarias en Colombia IGAC
descripcion: El dataset corresponde a los 30'905.678 registros de las transacciones inmobiliarias únicas
  dentro del periodo 2015-2023 para 1.105 municipios de Colombia, construidas a partir de la matricula
  inmobiliaria, código de DIVIPOLA, el código de la oficina de registro - ORIP, el número del folio y
  de la anotación, el código del acto de la naturaleza jurídica y el año de radicación. Permite reconocer
  las transacciones que se refieren a folios nuevos, identificar los registros con indicios de dinámica
  inmobiliaria, las transacciones que tienen valor y el valor de las transacciones.
