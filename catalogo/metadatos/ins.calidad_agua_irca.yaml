descripcion: El Sistema de Información de la Vigilancia de la Calidad del Agua de Potable (SIVICAP) fue
  creado con el propósito de monitorear la calidad del agua potable en el ámbito de la vigilancia en salud
  pública para el país. A partir del SIVICAP se genera el Índice de Riesgo de la Calidad de Agua Potable
  (IRCA) que mide en porcentaje el nivel de riesgo de ocurrencia de enfermedades relacionadas con el no
  cumplimiento de características físicas, químicas y microbiológicas del agua para consumo humano. Este
  conjunto de datos tiene los históricos del valor promedio anual del IRCA desagregados por departamento,
  municipio, área urbana y area rural a partir de 2007.
