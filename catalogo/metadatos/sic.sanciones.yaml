titulo: Sanciones impuestas en firme por la SIC
descripcion: 'Listado de las sanciones impuestas en firme (*) de la Superintendencia de Industria y Comercio
  - SIC por la Dirección de Investigaciones de la Delegatura de Protección al Consumidor. El listado incluye
  la información del multado, la fecha inicial de la sanción, y datos adicionales de la sanción como:
  radicado, conducta, y sector. (*) Según el artículo 87 de la Ley 1437 del 2011, los actos administrativos
  quedaran en firme cuando: 1. cuando contra ellos no proceda ningún recurso, desde el día siguiente al
  de su notificación, comunicación o publicación según el caso. 2. desde el día siguiente a la publicación,
  comunicación o notificación de la decisión sobre los recursos interpuestos. 3. desde el día siguiente
  al del vencimiento del término para interponer los recursos, si estos no fueron interpuestos, o se hubiere
  renunciado expresamente a ellos. 4. desde el día siguiente al de la notificación de la aceptación del
  desistimiento de los recursos. 5. desde el día siguiente al de la protocolización a que alude el artículo
  85 para el silencio administrativo positivo.'
