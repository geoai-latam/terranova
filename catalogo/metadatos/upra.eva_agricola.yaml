titulo: Evaluaciones Agropecuarias Municipales – EVA. 2019 - 2025. Base Agrícola
descripcion: La EVA es una investigación que se realiza mediante un mecanismo subjetivo de recolección
  de información respecto al área, la producción y el rendimiento de la actividad agropecuaria municipal.
  El método de cálculo se fundamenta principalmente en la confrontación y conciliación de la información
  que proveen los registros administrativos que manejan entidades y gremios del sector (área registrada,
  área bajo asistencia técnica, sacrificio de ganado, registros de parafiscales etc.), con el conocimiento
  de los funcionarios y los profesionales del sector, respecto al desarrollo y comportamiento de la producción.
  Su cobertura es de 1.103 municipios y de cerca de 200 productos de la canasta agropecuaria. El Gobierno
  Nacional, mediante Resolución 299 de 2019 del Ministerio de Agricultura y Desarrollo Rural (MADR), delegó
  en la Unidad de Planificación Rural Agropecuaria (UPRA) coordinar las actuaciones de las autoridades
  administrativas sectoriales con miras a implementar el Sistema Nacional Unificado de Información Rural
  y Agropecuaria (SNUIRA), el Sistema de Información para la Gestión de Riesgos Agropecuarios (SIGRA),
  consolidar Agronet y gestionar la información del sector agropecuario…
