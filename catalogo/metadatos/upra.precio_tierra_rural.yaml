descripcion: 'Los mapas de precios comerciales de la tierra rural son la línea base para el monitoreo
  y proyección del comportamiento de los precios rurales de los departamentos, y son un insumo para la
  orientación, formulación, seguimiento y evaluación de políticas públicas en el ámbito Nacional y Departamental.
  La divulgación de esta información es una acción afirmativa de transparencia del mercado de tierras,
  con la cual se pretende contribuir a su regularización. Para la elaboración de estos mapas se emplearon
  y analizaron como insumos las capas que se relacionan a continuación: Zonificación física para el mercado
  de tierras rurales agropecuarias del año 2016. Formalización de la propiedad. Distribución y tamaño
  predial. Tiempos de desplazamiento (isócronas). Avalúos catastrales integrales vigencia 2016. Este trabajo
  se complementó con estudios de mercado inmobiliario y de ofertas encontradas en los departamentos. Posteriormente
  se realizó la caracterización de los territorios en estudio y se efectuó el trazado de los polígonos
  de rangos de precios. Por la naturaleza y alcance previsto para este trabajo NO se llevó a cabo un muestreo
  estadístico, pero se realizaron entrevistas semiestructur…'
