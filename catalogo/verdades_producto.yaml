    entrada: {municipio_divipola: "25214"}
    verdad: {poligonos: 116, area_ha_total: 4315.86}
    medicion: "datos.gov.co rttb-pk7n, where cod_dane_m = '25214'"
  - id: t22
    familia: territorio
    pregunta: "¿Cuánto vale la tierra rural en Chía según la UPRA?"
    herramienta: upra_precio_tierra_rural_municipio
    entrada: {municipio_divipola: "25175"}
    estado: no_encontrado
    medicion: "datos.gov.co rttb-pk7n: ninguna fila con cod_dane_m 25175 ni municipio Chía"
