# Solo en desarrollo (F5, la fábrica): expone los conectores en 127.0.0.1 con los puertos que usan
# por defecto los scripts del host (`terranova.conector.CONECTORES_POR_DEFECTO`), para grabar
# doradas y medir canarios sin entrar a la red interna. En la VM NO se usa.
#
#   docker compose -f docker/compose.yml -f docker/compose.desarrollo.yml --env-file docker/.env \
#     up -d arcgis-mcp datos-abiertos-mcp
#   TERRANOVA_CONECTOR_LLAVE=… uv run scripts/grabar_doradas.py <herramienta>
services:
  arcgis-mcp:
    ports: ["127.0.0.1:9400:9400"]
  datos-abiertos-mcp:
    ports: ["127.0.0.1:9900:9900"]
  dane-mcp:
    ports: ["127.0.0.1:9920:9920"]
  amenazas-mcp:
    ports: ["127.0.0.1:9930:9930"]
  imagery-mcp:
    ports: ["127.0.0.1:9100:9100"]
