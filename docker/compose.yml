# Despliegue de Terranova (ADR-0015, F3.7): Caddy es lo único expuesto; dos réplicas de la puerta;
# Postgres (llaves, uso) y Redis (caché, cuota) compartidos; los conectores de GEO Copilot en la red
# interna, sin puerto publicado (ADR-0002).
#
#   cp docker/.env.example docker/.env   # y llenar los secretos
#   docker compose -f docker/compose.yml --env-file docker/.env up -d --build
#   docker compose -f docker/compose.yml --env-file docker/.env exec puerta-a terranova llaves crear --org mi-org --scopes '*'
#
# En una máquina con poca memoria se puede levantar por partes: primero postgres y redis, luego los
# conectores y al final las puertas y caddy.
#
# Endurecimiento: la puerta, el microservicio y los conectores corren sin privilegios
# (read_only + cap_drop:[ALL] + no-new-privileges) y todos los servicios llevan techo de memoria y
# de PIDs (mem_limit/pids_limit) para que un desborde no mate los procesos de video del dueño en la
# VM compartida. Falta por aplicar **en el despliegue, con prueba en la VM** (no a ciegas, porque
# cada imagen tiene sus mañas): read_only/cap_drop en los servicios con estado (postgres usa gosu en
# el init; redis también; caddy necesita NET_BIND_SERVICE para el :80), y un rate_limit de borde en
# Caddy, que exige compilar Caddy con xcaddy (el módulo no viene de serie). La cuota por llave de la
# puerta ya limita la tasa en la aplicación; el de borde sería defensa en profundidad.
#
# Restricciones curadas (F4.1) en la misma base: con un puerto temporal hacia postgres,
#   uv run --extra datasets scripts/dataset_restricciones.py --postgis postgresql://terranova:…@127.0.0.1:…/terranova
# Sin dataset cargado, la ficha consulta RUNAP y ANT en vivo y lo dice en `avisos`.

name: terranova

x-puerta: &puerta
  build:
    context: ..
    dockerfile: Dockerfile
  image: ${TERRANOVA_IMAGEN:-terranova/puerta:local}
  restart: unless-stopped
  environment: &entorno
    TERRANOVA_BD: postgresql://terranova:${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD}@postgres:5432/terranova
    # el dataset curado vive en la misma base (cargado con scripts/dataset_restricciones.py --postgis)
    TERRANOVA_CURADO_URL: postgresql://terranova:${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD}@postgres:5432/terranova
    TERRANOVA_REDIS_URL: redis://:${REDIS_PASSWORD:?define REDIS_PASSWORD}@redis:6379/0
    TERRANOVA_PIMIENTA: ${TERRANOVA_PIMIENTA:?define TERRANOVA_PIMIENTA (≥ 32 caracteres)}
    TERRANOVA_CONECTOR_LLAVE: ${TERRANOVA_CONECTOR_LLAVE:?define TERRANOVA_CONECTOR_LLAVE}
    TERRANOVA_CONECTORES: >-
      {"arcgis-mcp": "http://arcgis-mcp:9400/mcp", "amenazas-mcp": "http://amenazas-mcp:9930/mcp",
      "dane-mcp": "http://dane-mcp:9920/mcp", "datos-abiertos-mcp": "http://datos-abiertos-mcp:9900/mcp",
      "imagery-mcp": "http://imagery-mcp:9100/mcp", "web-mcp": "http://web-mcp:9940/mcp"}
    # G6 (ADR-0028): el buscador del catálogo embebe la consulta con el microservicio de embeddings
    TERRANOVA_EMBEDDINGS_URL: http://embeddings:9950
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_started}
    arcgis-mcp: {condition: service_started}
    amenazas-mcp: {condition: service_started}
    dane-mcp: {condition: service_started}
    datos-abiertos-mcp: {condition: service_started}
    imagery-mcp: {condition: service_started}
    web-mcp: {condition: service_started}
  networks: [borde, interna]
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  # Techo de memoria por contenedor: si uno se desborda lo mata su cgroup, no el host (la VM es
  # compartida con los procesos de video del dueño). Son límites, no reservas: no apartan RAM.
  mem_limit: 512m
  pids_limit: 256

services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${TERRANOVA_PUERTO_LOCAL:-8180}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_datos:/data
    environment:
      TERRANOVA_DOMINIO: ${TERRANOVA_DOMINIO:-:80}
    depends_on: [puerta-a, puerta-b]
    networks: [borde]
    mem_limit: 256m
    pids_limit: 128

  puerta-a: *puerta
  puerta-b:
    <<: *puerta
    build: !reset null  # la misma imagen que puerta-a: se construye una vez
    pull_policy: never

  # F7.1: los canarios de todo el catálogo, en serie, una vez al día; el resultado va a Postgres y
  # alimenta GET /v1/estado. Con TERRANOVA_ALERTA_URL avisa por POST lo que salga rojo.
  canarios:
    <<: *puerta
    build: !reset null
    pull_policy: never
    command: ["terranova", "canarios", "--cada-horas", "24"]
    environment:
      <<: *entorno
      TERRANOVA_ALERTA_URL: ${TERRANOVA_ALERTA_URL:-}

  # G3 (ADR-0024): reconstruye una vez al día las copias del catálogo (`modo: copia`) en el esquema
  # `copia` de Postgres. La puerta las lee con el conector interno `copia`.
  copias:
    <<: *puerta
    build: !reset null
    pull_policy: never
    # cada día revisa y rehace solo las copias que faltan o van por la mitad de su SLA (una capa
    # de agrología con SLA de un año no se rebaja a diario)
    command: ["terranova", "copias", "actualizar", "--solo-vencidas", "--cada-horas", "24"]

  # G6 (ADR-0028): una vez al día cosecha los dos catálogos DCAT (Socrata + ICDE), pide los vectores
  # al microservicio `embeddings` y los aterriza en PostGIS/pgvector (`descubrimiento.datasets`). La
  # puerta los lee con el conector interno del catálogo. Metadatos, no carga (ADR-0026).
  descubrimiento:
    <<: *puerta
    build: !reset null
    pull_policy: never
    entrypoint: ["sh", "-c"]
    command:
      - >-
        while true; do
        terranova catalogo-dcat ingerir --fuente socrata --a-postgis || echo "socrata FALLÓ" >&2;
        terranova catalogo-dcat ingerir --fuente icde --a-postgis || echo "icde FALLÓ" >&2;
        sleep 86400; done
    depends_on:
      postgres: {condition: service_healthy}
      embeddings: {condition: service_started}
    # La pasada completa guarda en memoria todo el catálogo (~34k datasets de Socrata) y sus vectores
    # e5-large (dim 1024, ~1 GB como tuplas de floats): con el techo de la puerta (512m) el job moría.
    mem_limit: 3g

  # G6 (ADR-0028): microservicio de embeddings del catálogo. El modelo (ONNX) va horneado en la
  # imagen, en un solo contenedor (no en cada réplica de la puerta). Solo en la red interna, sin
  # llave (como los conectores MCP, ADR-0002). La puerta y el job de ingesta lo llaman por HTTP.
  embeddings:
    build:
      context: ..
      dockerfile: docker/embeddings/Dockerfile
    image: ${TERRANOVA_EMBEDDINGS_IMAGEN:-terranova/embeddings:local}
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:size=64m,uid=10101"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [interna]
    # e5-large (ONNX FP32, ~2,2 GB de pesos) + activaciones: el más goloso del stack. Con 3g y lotes
    # de 64 el kernel lo mató; ahora el modelo va de a 8 textos y queda 1 GB de holgura.
    mem_limit: 4g
    # Embeber en CPU ocupa todos los núcleos por horas: con prioridad baja, la puerta y Postgres
    # pasan primero cuando compiten (sin límite fijo: si la máquina está libre, usa todo).
    cpu_shares: 256
    pids_limit: 256

  postgres:
    # PostGIS (dataset curado, F4.1) + pgvector (catálogo de descubrimiento, G6/ADR-0028)
    build: {context: .., dockerfile: docker/postgres/Dockerfile}
    image: ${TERRANOVA_POSTGRES_IMAGEN:-terranova/postgres:local}
    restart: unless-stopped
    environment:
      POSTGRES_USER: terranova
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: terranova
    volumes: [postgres_datos:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "terranova"]
      interval: 5s
      retries: 20
    networks: [interna]
    mem_limit: 1g
    pids_limit: 256

  # F7.3 (ADR-0015): pg_dump diario de llaves, uso, canarios y el dataset curado; guarda 14 días en
  # TERRANOVA_RESPALDOS, que se copia FUERA de la VM. Restaurar: docs/RUNBOOK.md §4.
  respaldo:
    image: postgis/postgis:17-3.5-alpine  # la misma versión de pg_dump que el servidor
    restart: unless-stopped
    entrypoint: ["sh", "-c"]
    command:
      - >-
        while true; do
        f=/respaldos/terranova-$$(date -u +%Y%m%dT%H%MZ).dump;
        if pg_dump -h postgres -U terranova -d terranova -Fc -f "$$f.parcial"; then
        mv "$$f.parcial" "$$f" && echo "respaldo $$f";
        else rm -f "$$f.parcial"; echo "RESPALDO FALLÓ" >&2; fi;
        find /respaldos -name 'terranova-*.dump' -mtime +14 -delete;
        sleep 86400; done
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes: ["${TERRANOVA_RESPALDOS:-./respaldos}:/respaldos"]
    depends_on:
      postgres: {condition: service_healthy}
    networks: [interna]
    mem_limit: 256m
    pids_limit: 64

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Redis es caché/cuota, no almacén durable: con un techo de memoria y expulsión LRU nunca crece
    # sin límite (sería otra vía de OOM). --save "" / --appendonly no: no persiste a disco.
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 192mb
      - --maxmemory-policy
      - allkeys-lru
    networks: [interna]
    mem_limit: 256m
    pids_limit: 64

  # Conector de GEO Copilot. En producción va la imagen GHCR con versión fija (ADR-0001); en local se
  # construye desde el repo hermano.
  arcgis-mcp:
    build:
      context: ../conectores
      dockerfile: services/arcgis_mcp/Dockerfile
    image: ${ARCGIS_MCP_IMAGEN:-terranova/arcgis-mcp:local}
    restart: unless-stopped
    environment:
      ARCGIS_MCP_PORT: "9400"
      ARCGIS_MCP_KEYS: '[{"name":"terranova","key":"${TERRANOVA_CONECTOR_LLAVE}","scopes":["arcgis:read"],"rate_limit_per_min":600}]'
      ARCGIS_RESULTADOS_DIR: /resultados
    tmpfs: ["/resultados:size=256m,uid=10004", "/tmp:size=64m,uid=10004"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [interna]
    mem_limit: 512m
    pids_limit: 256

  # Los demás conectores del catálogo (F7.1: sin ellos, sus 10 canarios salen rojos siempre). Misma
  # llave de servicio y el mismo endurecimiento que arcgis-mcp; solo llegan a la red interna.
  amenazas-mcp:
    build: {context: ../conectores, dockerfile: services/amenazas_mcp/Dockerfile}
    image: ${AMENAZAS_MCP_IMAGEN:-terranova/amenazas-mcp:local}
    restart: unless-stopped
    environment:
      AMENAZAS_MCP_PORT: "9930"
      AMENAZAS_MCP_KEYS: '[{"name":"terranova","key":"${TERRANOVA_CONECTOR_LLAVE}","scopes":["amenazas:read"],"rate_limit_per_min":600}]'
    tmpfs: ["/tmp:size=32m,uid=10012"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [interna]
    mem_limit: 256m
    pids_limit: 128

  dane-mcp:
    build: {context: ../conectores, dockerfile: services/dane_mcp/Dockerfile}
    image: ${DANE_MCP_IMAGEN:-terranova/dane-mcp:local}
    restart: unless-stopped
    environment:
      DANE_MCP_PORT: "9920"
      DANE_MCP_KEYS: '[{"name":"terranova","key":"${TERRANOVA_CONECTOR_LLAVE}","scopes":["dane:read"],"rate_limit_per_min":600}]'
      DANE_RESULTADOS_DIR: /tmp/dane-resultados
    tmpfs: ["/tmp:size=256m,uid=10011"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [interna]
    mem_limit: 384m
    pids_limit: 128

  datos-abiertos-mcp:
    build: {context: ../conectores, dockerfile: services/datos_abiertos_mcp/Dockerfile}
    image: ${DATOS_MCP_IMAGEN:-terranova/datos-abiertos-mcp:local}
    restart: unless-stopped
    environment:
      DATOS_MCP_PORT: "9900"
      DATOS_MCP_KEYS: '[{"name":"terranova","key":"${TERRANOVA_CONECTOR_LLAVE}","scopes":["datos:read"],"rate_limit_per_min":600}]'
      DATOS_RESULTADOS_DIR: /tmp/datos-resultados
    tmpfs: ["/tmp:size=256m,uid=10009"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [interna]
    mem_limit: 384m
    pids_limit: 128

  imagery-mcp:
    build: {context: ../conectores, dockerfile: services/imagery_mcp/Dockerfile}
    image: ${IMAGERY_MCP_IMAGEN:-terranova/imagery-mcp:local}
    restart: unless-stopped
    environment:
      IMAGERY_PROVIDER: planetary-computer
      IMAGERY_PORT: "9100"
      # imagery:compute: la cobertura del suelo en un punto se calcula (sin él, 403)
      IMAGERY_MCP_KEYS: '[{"name":"terranova","key":"${TERRANOVA_CONECTOR_LLAVE}","scopes":["imagery:read","imagery:compute"],"rate_limit_per_min":120}]'
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [interna]
    mem_limit: 512m
    pids_limit: 128

  # G4 (F5): APIs web públicas que no están en datos.gov.co ni en ArcGIS (relatoría de Colombia Compra,
  # BanRep SDMX). Solo los dominios de la lista, con robots.txt y una petición por segundo por sitio.
  web-mcp:
    build: {context: ../conectores, dockerfile: services/web_mcp/Dockerfile}
    image: ${WEB_MCP_IMAGEN:-terranova/web-mcp:local}
    restart: unless-stopped
    environment:
      WEB_MCP_PORT: "9940"
      WEB_MCP_DOMINIOS: relatoria.colombiacompra.gov.co,totoro.banrep.gov.co,www.funcionpublica.gov.co,www.corteconstitucional.gov.co,gestornormativo.creg.gov.co,normograma.dian.gov.co,www.dian.gov.co,www.dane.gov.co
      WEB_MCP_KEYS: '[{"name":"terranova","key":"${TERRANOVA_CONECTOR_LLAVE}","scopes":["web:read"],"rate_limit_per_min":120}]'
    read_only: true
    tmpfs: ["/tmp:size=16m,uid=10013"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [interna]
    mem_limit: 256m
    pids_limit: 128

  # F7.2: Prometheus (alertas de los SLO) y Grafana (tablero). Solo con el perfil:
  #   docker compose -f docker/compose.yml --env-file docker/.env --profile observabilidad up -d
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [observabilidad]
    restart: unless-stopped
    volumes:
      - ./observabilidad/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observabilidad/reglas.yml:/etc/prometheus/reglas.yml:ro
      - prometheus_datos:/prometheus
    networks: [interna]
    mem_limit: 512m
    pids_limit: 128

  grafana:
    image: grafana/grafana:12.0.2
    profiles: [observabilidad]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${TERRANOVA_GRAFANA_PUERTO:-3000}:3000"  # solo en la máquina
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?define GRAFANA_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./observabilidad/grafana/datasources.yml:/etc/grafana/provisioning/datasources/terranova.yml:ro
      - ./observabilidad/grafana/tableros.yml:/etc/grafana/provisioning/dashboards/terranova.yml:ro
      - ./observabilidad/grafana/tableros:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]
    networks: [interna]
    mem_limit: 256m
    pids_limit: 128

networks:
  borde: {}
  interna: {}

volumes:
  postgres_datos: {}
  prometheus_datos: {}
  caddy_datos: {}
