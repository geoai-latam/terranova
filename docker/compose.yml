# Despliegue de Terranova (ADR-0015, F3.7): Caddy es lo único expuesto; dos réplicas de la puerta;
# Postgres (llaves, uso) y Redis (caché, cuota) compartidos; los conectores de GEO Copilot en la red
# interna, sin puerto publicado (ADR-0002).
#
#   cp docker/.env.example docker/.env   # y llenar los secretos
#   docker compose -f docker/compose.yml --env-file docker/.env up -d --build
#   docker compose -f docker/compose.yml --env-file docker/.env exec puerta-a terranova llaves crear --org mi-org --scopes '*'
#
# En una máquina con poca memoria se puede levantar por partes: primero postgres y redis, luego los
# conectores y al final las puertas y caddy.
#
# Restricciones curadas (F4.1) en la misma base: con un puerto temporal hacia postgres,
#   uv run --extra datasets scripts/dataset_restricciones.py --postgis postgresql://terranova:…@127.0.0.1:…/terranova
# Sin dataset cargado, la ficha consulta RUNAP y ANT en vivo y lo dice en `avisos`.

name: terranova

x-puerta: &puerta
  build:
    context: ..
    dockerfile: Dockerfile
  image: ${TERRANOVA_IMAGEN:-terranova/puerta:local}
  restart: unless-stopped
  environment: &entorno
    TERRANOVA_BD: postgresql://terranova:${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD}@postgres:5432/terranova
    # el dataset curado vive en la misma base (cargado con scripts/dataset_restricciones.py --postgis)
    TERRANOVA_CURADO_URL: postgresql://terranova:${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD}@postgres:5432/terranova
    TERRANOVA_REDIS_URL: redis://:${REDIS_PASSWORD:?define REDIS_PASSWORD}@redis:6379/0
    TERRANOVA_PIMIENTA: ${TERRANOVA_PIMIENTA:?define TERRANOVA_PIMIENTA (≥ 32 caracteres)}
    TERRANOVA_CONECTOR_LLAVE: ${TERRANOVA_CONECTOR_LLAVE:?define TERRANOVA_CONECTOR_LLAVE}
    TERRANOVA_CONECTORES: '{"arcgis-mcp": "http://arcgis-mcp:9400/mcp"}'
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_started}
    arcgis-mcp: {condition: service_started}
  networks: [borde, interna]
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${TERRANOVA_PUERTO_LOCAL:-8180}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_datos:/data
    environment:
      TERRANOVA_DOMINIO: ${TERRANOVA_DOMINIO:-:80}
    depends_on: [puerta-a, puerta-b]
    networks: [borde]

  puerta-a: *puerta
  puerta-b:
    <<: *puerta
    build: !reset null  # la misma imagen que puerta-a: se construye una vez
    pull_policy: never

  # F7.1: los canarios de todo el catálogo, en serie, una vez al día; el resultado va a Postgres y
  # alimenta GET /v1/estado. Con TERRANOVA_ALERTA_URL avisa por POST lo que salga rojo.
  canarios:
    <<: *puerta
    build: !reset null
    pull_policy: never
    command: ["terranova", "canarios", "--cada-horas", "24"]
    environment:
      <<: *entorno
      TERRANOVA_ALERTA_URL: ${TERRANOVA_ALERTA_URL:-}

  postgres:
    image: postgis/postgis:17-3.5-alpine  # PostGIS: el dataset curado de restricciones (F4.1)
    restart: unless-stopped
    environment:
      POSTGRES_USER: terranova
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: terranova
    volumes: [postgres_datos:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "terranova"]
      interval: 5s
      retries: 20
    networks: [interna]

  # F7.3 (ADR-0015): pg_dump diario de llaves, uso, canarios y el dataset curado; guarda 14 días en
  # TERRANOVA_RESPALDOS, que se copia FUERA de la VM. Restaurar: docs/RUNBOOK.md §4.
  respaldo:
    image: postgis/postgis:17-3.5-alpine  # la misma versión de pg_dump que el servidor
    restart: unless-stopped
    entrypoint: ["sh", "-c"]
    command:
      - >-
        while true; do
        f=/respaldos/terranova-$$(date -u +%Y%m%dT%H%MZ).dump;
        if pg_dump -h postgres -U terranova -d terranova -Fc -f "$$f.parcial"; then
        mv "$$f.parcial" "$$f" && echo "respaldo $$f";
        else rm -f "$$f.parcial"; echo "RESPALDO FALLÓ" >&2; fi;
        find /respaldos -name 'terranova-*.dump' -mtime +14 -delete;
        sleep 86400; done
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes: ["${TERRANOVA_RESPALDOS:-./respaldos}:/respaldos"]
    depends_on:
      postgres: {condition: service_healthy}
    networks: [interna]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--save", "", "--appendonly", "no"]
    networks: [interna]

  # Conector de GEO Copilot. En producción va la imagen GHCR con versión fija (ADR-0001); en local se
  # construye desde el repo hermano.
  arcgis-mcp:
    build:
      context: ../../GEO_COPILOT
      dockerfile: services/arcgis_mcp/Dockerfile
    image: ${ARCGIS_MCP_IMAGEN:-geo-copilot/arcgis-mcp:local}
    restart: unless-stopped
    environment:
      ARCGIS_MCP_PORT: "9400"
      ARCGIS_MCP_KEYS: '[{"name":"terranova","key":"${TERRANOVA_CONECTOR_LLAVE}","scopes":["arcgis:read"],"rate_limit_per_min":600}]'
      ARCGIS_RESULTADOS_DIR: /resultados
    tmpfs: ["/resultados:size=256m,uid=10004", "/tmp:size=64m,uid=10004"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [interna]

  # F7.2: Prometheus (alertas de los SLO) y Grafana (tablero). Solo con el perfil:
  #   docker compose -f docker/compose.yml --env-file docker/.env --profile observabilidad up -d
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [observabilidad]
    restart: unless-stopped
    volumes:
      - ./observabilidad/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observabilidad/reglas.yml:/etc/prometheus/reglas.yml:ro
      - prometheus_datos:/prometheus
    networks: [interna]

  grafana:
    image: grafana/grafana:12.0.2
    profiles: [observabilidad]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${TERRANOVA_GRAFANA_PUERTO:-3000}:3000"  # solo en la máquina
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?define GRAFANA_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./observabilidad/grafana/datasources.yml:/etc/grafana/provisioning/datasources/terranova.yml:ro
      - ./observabilidad/grafana/tableros.yml:/etc/grafana/provisioning/dashboards/terranova.yml:ro
      - ./observabilidad/grafana/tableros:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]
    networks: [interna]

networks:
  borde: {}
  interna: {}

volumes:
  postgres_datos: {}
  prometheus_datos: {}
  caddy_datos: {}
