# Prometheus de Terrnova (F7.2): lee /metrics de cada réplica por la red interna (Caddy no lo deja
# salir) y evalúa las alertas de los SLO de docs/specs/05-metricas-slo.md.
global:
  scrape_interval: 30s
  evaluation_interval: 1m

rule_files:
  - /etc/prometheus/reglas.yml

scrape_configs:
  - job_name: terranova
    metrics_path: /metrics
    # por DNS de la red interna: una réplica que no corre (en la VPS única va solo puerta-a,
    # ADR-0030) no resuelve y no cuenta como caída, así PuertaSinMetricas no salta en falso
    dns_sd_configs:
      - names: ["puerta-a", "puerta-b"]
        type: A
        port: 8100
        refresh_interval: 30s
