[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "terranova"
version = "0.0.1"
description = "Puerta única (MCP + REST) sobre fuentes oficiales colombianas y globales, con el contrato rt/1"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
authors = [{ name = "GeoAI LATAM" }]
dependencies = []

[dependency-groups]
# Ruff y mypy fijados, en la misma versión que GEO Copilot: una versión nueva no pone el CI en rojo
# sola. Si se sube aquí, se sube también en .pre-commit-config.yaml.
dev = [
    "mypy==2.4.0",
    "pre-commit>=4",
    "pytest>=8",
    "ruff==0.16.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/terranova"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "BLE", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
