[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "terranova"
version = "0.0.1"
description = "Puerta única (MCP + REST) sobre fuentes oficiales colombianas y globales, con el contrato rt/1"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
authors = [{ name = "GeoAI LATAM" }]
dependencies = [
    "fastapi>=0.120",
    "fastmcp==4.1.3",
    # la puerta siempre habla HTTP: ConectorMCP (conectores en vivo) y la ingesta de copias (zip/socrata)
    "httpx>=0.28",
    "prometheus-client>=0.21,<1",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
# Caché compartida entre réplicas (ADR-0015); sin ella, la puerta usa caché en memoria.
redis = ["redis>=5,<7"]
postgres = [
    "psycopg[binary]>=3.2,<4",
    "psycopg-pool>=3.2,<4",
]
datasets = [
    "geopandas>=1.0",
    "pandera[geopandas]>=0.20",
    "pyarrow>=17",
    "pyogrio>=0.9",
]
# Embeddings del catálogo de descubrimiento (G6, ADR-0028): modelo multilingüe local (ONNX, sin
# torch) para el buscador semántico, servido por el microservicio (uvicorn). La versión del modelo
# se fija en descubrimiento.py.
descubrimiento = [
    "fastembed>=0.4,<0.10",
    "uvicorn>=0.30",
]

[dependency-groups]
# Ruff y mypy fijados, en la misma versión que GEO Copilot: una versión nueva no pone el CI en rojo
# sola. Si se sube aquí, se sube también en .pre-commit-config.yaml.
dev = [
    "fakeredis[lua]>=2.26",
    "hypothesis>=6.120",
    "jsonschema>=4.23",
    "mypy==2.4.0",
    "pre-commit>=4",
    "pytest>=8",
    "pytest-cov>=6",
    "ruff==0.16.10",
    "schemathesis>=4",
    "types-jsonschema>=4.26.0.20261006",
    "types-pyyaml>=6.0.12.20260906",
]

[project.scripts]
terranova = "terranova.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/terranova"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "BLE", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests", "tests_lentos", "scripts"]

[[tool.mypy.overrides]]
# extra opcional `datasets`: sin tipos publicados
module = ["geopandas.*", "pandas.*", "pandera.*", "shapely.*", "pyogrio.*", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -p no:schemathesis"

[tool.coverage.run]
source = ["terranova"]
# El microservicio de embeddings solo corre con el modelo real (no en la suite sin extras); no
# penaliza el piso por una ruta que se prueba aparte.
omit = ["*/embeddings_servicio.py"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
